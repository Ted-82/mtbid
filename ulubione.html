<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulubione | MTBID</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      min-height: 76px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #111827;
      text-decoration: none;
    }

    .logo span {
      color: #e11d48;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    nav a:hover {
      color: #e11d48;
    }

    .auth {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-outline {
      border: 1px solid #d1d5db;
      background: white;
      color: #111827;
    }

    .btn-red {
      background: #e11d48;
      color: white;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 45px 24px 70px;
    }

    .top {
      margin-bottom: 30px;
    }

    .top h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    .top p {
      margin: 0;
      color: #6b7280;
      font-size: 16px;
    }

    .counter {
      display: inline-flex;
      margin-top: 18px;
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.09);
    }

    .image-wrap {
      height: 220px;
      background: #e5e7eb;
      position: relative;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .demo {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #111827;
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 9px;
      border-radius: 7px;
    }

    .remove {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: white;
      color: #e11d48;
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }

    .body {
      padding: 18px;
    }

    .platform {
      font-size: 12px;
      font-weight: 900;
      color: #e11d48;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }

    .title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 13px;
      color: #111827;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .info-item {
      background: #f8fafc;
      border-radius: 9px;
      padding: 9px;
    }

    .label {
      display: block;
      color: #6b7280;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .value {
      font-size: 13px;
      font-weight: 800;
    }

    .price {
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 14px;
      color: #111827;
    }

    .actions {
      display: flex;
      gap: 9px;
    }

    .actions a,
    .actions button {
      flex: 1;
      text-align: center;
    }

    .empty {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 70px 25px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.04);
    }

    .empty-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .empty h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .empty p {
      color: #6b7280;
      margin: 0 auto 25px;
      max-width: 550px;
      line-height: 1.6;
    }

    footer {
      background: #111827;
      color: #d1d5db;
      padding: 35px 24px;
      margin-top: 20px;
    }

    .footer-inner {
      max-width: 1250px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 25px;
      flex-wrap: wrap;
    }

    .footer-logo {
      color: white;
      font-weight: 900;
      font-size: 22px;
    }

    @media (max-width: 950px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      nav {
        display: none;
      }
    }

    @media (max-width: 620px) {
      .header-inner {
        min-height: 65px;
        padding: 0 16px;
      }

      .logo {
        font-size: 25px;
      }

      .auth .btn-outline {
        display: none;
      }

      .container {
        padding: 30px 16px 50px;
      }

      .top h1 {
        font-size: 30px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .image-wrap {
        height: 230px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      MT<span>BID</span>
    </a>

    <nav>
      <a href="index.html">Aukcje</a>
      <a href="jak-to-dziala.html">Jak to działa</a>
      <a href="o-nas.html">O nas</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="ulubione.html">♡ Ulubione</a>
    </nav>

    <div class="auth">
      <a href="logowanie.html" class="btn btn-outline">Zaloguj</a>
      <a href="rejestracja.html" class="btn btn-red">Rejestracja</a>
    </div>

  </div>
</header>

<main class="container">

  <div class="top">
    <h1>Ulubione samochody</h1>
    <p>Samochody, które zapisujesz podczas przeglądania aukcji.</p>

    <div class="counter" id="counter">
      0 zapisanych samochodów
    </div>
  </div>

  <div id="content"></div>

</main>

<footer>
  <div class="footer-inner">
    <div>
      <div class="footer-logo">MTBID</div>
      <div style="margin-top:8px;">Platforma aukcji samochodów z USA</div>
    </div>

    <div>
      © 2026 MTBID
    </div>
  </div>
</footer>

<script>

const demoCars = [

  {
    vin: "1FMCU9GDXMUA10001",
    platform: "COPART",
    title: "2021 Ford Escape SE",
    year: 2021,
    mileage: "52 341 km",
    damage: "Front End",
    location: "Chicago, IL",
    price: "$7,250",
    image: "https://images.unsplash.com/photo-1551830820-330a71b99659?auto=format&fit=crop&w=1000&q=80"
  },

  {
    vin: "1C4RJFBG8LC200002",
    platform: "IAAI",
    title: "2020 Jeep Grand Cherokee",
    year: 2020,
    mileage: "67 420 km",
    damage: "Side",
    location: "Dallas, TX",
    price: "$9,800",
    image: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=1000&q=80"
  },

  {
    vin: "1HGCV1F34LA300003",
    platform: "COPART",
    title: "2020 Honda Accord Sport",
    year: 2020,
    mileage: "61 200 km",
    damage: "Rear End",
    location: "Miami, FL",
    price: "$8,400",
    image: "https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?auto=format&fit=crop&w=1000&q=80"
  },

  {
    vin: "5YFB4MDE2LP400004",
    platform: "IAAI",
    title: "2020 Toyota Corolla SE",
    year: 2020,
    mileage: "49 870 km",
    damage: "Hail",
    location: "Houston, TX",
    price: "$7,900",
    image: "https://images.unsplash.com/photo-1590362891991-f776e747a588?auto=format&fit=crop&w=1000&q=80"
  },

  {
    vin: "1G1ZD5ST5LF500005",
    platform: "COPART",
    title: "2020 Chevrolet Malibu LT",
    year: 2020,
    mileage: "72 115 km",
    damage: "Front End",
    location: "Atlanta, GA",
    price: "$6,950",
    image: "https://images.unsplash.com/photo-1619767886558-efdc259cde1a?auto=format&fit=crop&w=1000&q=80"
  },

  {
    vin: "WBA5R1C04LF600006",
    platform: "IAAI",
    title: "2020 BMW 330I",
    year: 2020,
    mileage: "58 920 km",
    damage: "Rear End",
    location: "Los Angeles, CA",
    price: "$11,500",
    image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=1000&q=80"
  }

];

function getFavorites() {
  try {
    return JSON.parse(localStorage.getItem("mtbid_favorites") || "[]");
  } catch {
    return [];
  }
}

function removeFavorite(vin) {

  let favorites = getFavorites();

  favorites = favorites.filter(item => {

    if (typeof item === "string") {
      return item !== vin;
    }

    return item.vin !== vin;
  });

  localStorage.setItem(
    "mtbid_favorites",
    JSON.stringify(favorites)
  );

  render();
}

function getSavedCars() {

  const favorites = getFavorites();

  return favorites.map(item => {

    if (typeof item === "object" && item !== null) {
      return item;
    }

    return demoCars.find(car => car.vin === item);

  }).filter(Boolean);
}

function render() {

  const content = document.getElementById("content");
  const counter = document.getElementById("counter");

  const cars = getSavedCars();

  counter.textContent =
    cars.length === 1
      ? "1 zapisany samochód"
      : `${cars.length} zapisanych samochodów`;

  if (!cars.length) {

    content.innerHTML = `
      <div class="empty">

        <div class="empty-icon">♡</div>

        <h2>Nie masz jeszcze ulubionych</h2>

        <p>
          Kliknij serduszko przy samochodzie na stronie aukcji,
          aby dodać go tutaj.
        </p>

        <a href="index.html" class="btn btn-red">
          Przeglądaj aukcje
        </a>

      </div>
    `;

    return;
  }

  content.innerHTML = `
    <div class="grid">

      ${cars.map(car => `

        <article class="card">

          <div class="image-wrap">

            <img
              src="${car.image || car.media?.[0]?.url || 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1000&q=80'}"
              alt="${car.title || 'Samochód'}"
            >

            <div class="demo">
              ${car.is_demo ? "DEMO" : car.platform || "AUKCJA"}
            </div>

            <button
              class="remove"
              onclick="removeFavorite('${car.vin}')"
              title="Usuń z ulubionych"
            >
              ♥
            </button>

          </div>

          <div class="body">

            <div class="platform">
              ${car.platform || "AUKCJA"}
            </div>

            <div class="title">
              ${car.title || `${car.year || ""} ${car.make || ""} ${car.model || ""}`}
            </div>

            <div class="info">

              <div class="info-item">
                <span class="label">Rok</span>
                <span class="value">
                  ${car.year || "-"}
                </span>
              </div>

              <div class="info-item">
                <span class="label">Przebieg</span>
                <span class="value">
                  ${car.mileage || car.odometer?.formatted || car.odometer?.value || "-"}
                </span>
              </div>

              <div class="info-item">
                <span class="label">Uszkodzenie</span>
                <span class="value">
                  ${car.damage || car.condition?.damage || "-"}
                </span>
              </div>

              <div class="info-item">
                <span class="label">Lokalizacja</span>
                <span class="value">
                  ${car.location || "-"}
                </span>
              </div>

            </div>

            <div class="price">
              ${car.price || car.pricing?.current_bid || car.pricing?.estimated_retail || "Cena aukcji"}
            </div>

            <div class="actions">

              <a
                href="car.html?vin=${encodeURIComponent(car.vin)}"
                class="btn btn-red"
              >
                Zobacz auto
              </a>

              <button
                class="btn btn-outline"
                onclick="removeFavorite('${car.vin}')"
              >
                Usuń
              </button>

            </div>

          </div>

        </article>

      `).join("")}

    </div>
  `;
}

render();

</script>

</body>
</html>
