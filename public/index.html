<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rex.Bid — Aukcje samochodów USA</title>

  <meta
    name="description"
    content="Rex.Bid — wyszukiwarka samochodów z aukcji Copart i IAAI."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0d10;
      --panel: #12161b;
      --panel2: #181d23;
      --border: #282e36;
      --text: #f4f6f8;
      --muted: #9aa3ad;
      --accent: #ffb000;
      --accent2: #ffcc55;
      --green: #35d07f;
      --red: #ff5d5d;
      --blue: #55aaff;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 13, 16, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--accent);
    }

    .nav {
      display: flex;
      gap: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav a:hover {
      color: white;
    }

    /* HERO */

    .hero {
      padding: 64px 0 36px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 68px);
      line-height: 1;
      letter-spacing: -3px;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      max-width: 680px;
      margin: 20px auto 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    /* SEARCH */

    .search-box {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      height: 58px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--panel);
      color: white;
      font-size: 16px;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .btn {
      height: 58px;
      border: 0;
      border-radius: 12px;
      padding: 0 26px;
      cursor: pointer;
      font-weight: 800;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #111;
    }

    .btn-primary:hover {
      background: var(--accent2);
      transform: translateY(-1px);
    }

    /* FILTERS */

    .filters {
      margin: 24px 0 34px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns:
        1.2fr
        1fr
        1fr
        1fr
        1fr
        auto;
      gap: 10px;
    }

    .filters input,
    .filters select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel2);
      color: white;
      outline: none;
    }

    .filters button {
      height: 46px;
    }

    /* RESULTS */

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 15px;
    }

    .results-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .cars {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .car-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      transition: 0.2s;
    }

    .car-card:hover {
      border-color: #454c55;
      transform: translateY(-2px);
    }

    .car-image {
      position: relative;
      height: 230px;
      background: #080a0c;
      overflow: hidden;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .platform {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 9px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.75);
      font-size: 11px;
      font-weight: 800;
    }

    .status-badge {
      position: absolute;
      right: 12px;
      top: 12px;
      padding: 6px 9px;
      border-radius: 7px;
      background: rgba(53, 208, 127, 0.9);
      color: #07140d;
      font-size: 11px;
      font-weight: 800;
    }

    .car-content {
      padding: 18px;
    }

    .car-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 800;
    }

    .car-vin {
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }

    .car-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }

    .spec small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .spec strong {
      font-size: 14px;
    }

    .car-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .price {
      font-size: 22px;
      font-weight: 900;
    }

    .details-btn {
      padding: 10px 14px;
      border-radius: 9px;
      background: var(--accent);
      color: #111;
      font-size: 13px;
      font-weight: 800;
    }

    /* EMPTY / LOADING */

    .message {
      padding: 50px 20px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 15px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* FOOTER */

    footer {
      margin-top: 80px;
      padding: 35px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* RESPONSIVE */

    @media (max-width: 1100px) {
      .cars {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 20px, 1440px);
      }

      .header-inner {
        min-height: 62px;
      }

      .nav {
        display: none;
      }

      .hero {
        padding-top: 42px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .search-box {
        flex-direction: column;
      }

      .filters-grid {
        grid-template-columns: 1fr 1fr;
      }

      .cars {
        grid-template-columns: 1fr;
      }

      .car-image {
        height: 250px;
      }
    }

    @media (max-width: 430px) {
      .filters-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">

    <a href="/" class="logo">
      Rex<span>.Bid</span>
    </a>

    <nav class="nav">
      <a href="/">Samochody</a>
      <a href="#search">Wyszukiwarka</a>
      <a href="#results">Aukcje</a>
    </nav>

  </div>
</header>


<main>

  <section class="hero" id="search">

    <div class="container">

      <h1>
        Znajdź swój<br />
        <span>samochód.</span>
      </h1>

      <p>
        Samochody z aukcji Copart i IAAI.
        Wyszukuj po VIN, numerze lotu, marce,
        modelu i parametrach pojazdu.
      </p>

      <form class="search-box" id="searchForm">

        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="VIN, numer lotu, marka lub model..."
        />

        <button
          class="btn btn-primary"
          type="submit"
        >
          Szukaj
        </button>

      </form>

    </div>

  </section>


  <section class="container">

    <div class="filters">

      <div class="filters-grid">

        <select id="platform">
          <option value="">Wszystkie aukcje</option>
          <option value="iaai">IAAI</option>
          <option value="copart">COPART</option>
        </select>

        <input
          id="make"
          type="text"
          placeholder="Marka"
        />

        <input
          id="model"
          type="text"
          placeholder="Model"
        />

        <input
          id="yearFrom"
          type="number"
          placeholder="Rok od"
        />

        <input
          id="yearTo"
          type="number"
          placeholder="Rok do"
        />

        <button
          id="filterButton"
          class="btn btn-primary"
          type="button"
        >
          Filtruj
        </button>

      </div>

    </div>


    <div class="results-header" id="results">

      <h2>
        Oferty samochodów
      </h2>

      <div
        id="resultStatus"
        class="status"
      >
        Ładowanie...
      </div>

    </div>


    <div
      id="cars"
      class="cars"
    ></div>

  </section>

</main>


<footer>
  <div class="container">
    Rex.Bid — Vehicle Auction Marketplace
  </div>
</footer>


<script>
  const API_BASE = "/api";

  const carsContainer =
    document.getElementById("cars");

  const resultStatus =
    document.getElementById("resultStatus");

  const searchForm =
    document.getElementById("searchForm");

  const searchInput =
    document.getElementById("searchInput");

  const platform =
    document.getElementById("platform");

  const make =
    document.getElementById("make");

  const model =
    document.getElementById("model");

  const yearFrom =
    document.getElementById("yearFrom");

  const yearTo =
    document.getElementById("yearTo");

  const filterButton =
    document.getElementById("filterButton");


  /*
   * ==========================================================
   * POMOCNICZE
   * ==========================================================
   */

  function escapeHtml(value) {
    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function formatMoney(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "—";
    }

    const number = Number(value);

    if (Number.isNaN(number)) {
      return escapeHtml(value);
    }

    return "$" +
      number.toLocaleString("en-US");
  }


  /*
   * ==========================================================
   * TYTUŁ SAMOCHODU
   * ==========================================================
   */

  function getTitle(car) {

    if (!car) {
      return "Samochód";
    }

    if (
      car.title &&
      String(car.title).trim()
    ) {
      return String(car.title).trim();
    }

    if (
      car.vehicle &&
      typeof car.vehicle === "object"
    ) {

      const vehicleMake =
        car.vehicle.make ||
        car.vehicle.manufacturer ||
        "";

      const vehicleModel =
        car.vehicle.model ||
        "";

      const vehicleYear =
        car.vehicle.year ||
        "";

      const title =
        [vehicleYear, vehicleMake, vehicleModel]
          .filter(Boolean)
          .join(" ");

      if (title) {
        return title;
      }
    }


    const year =
      car.year ||
      car.vehicle_year ||
      "";

    const carMake =
      car.make ||
      car.brand ||
      car.manufacturer ||
      "";

    const carModel =
      car.model ||
      "";

    const title =
      [year, carMake, carModel]
        .filter(Boolean)
        .join(" ");

    if (title) {
      return title;
    }


    if (car.vin) {
      return "Samochód " + car.vin;
    }

    if (car.lot_number) {
      return "Samochód — Lot " + car.lot_number;
    }

    return "Samochód";
  }


  /*
   * ==========================================================
   * ZDJĘCIE SAMOCHODU
   *
   * WAŻNE:
   * Wcześniej kod wywoływał getCarImage(),
   * ale taka funkcja nie istniała.
   *
   * Teraz funkcja obsługuje różne formaty API.
   * ==========================================================
   */

  function getCarImage(car) {

    if (!car) {
      return "";
    }


    /* image */

    if (
      typeof car.image === "string" &&
      car.image.trim()
    ) {
      return car.image.trim();
    }


    /* image_url */

    if (
      typeof car.image_url === "string" &&
      car.image_url.trim()
    ) {
      return car.image_url.trim();
    }


    /* photo */

    if (
      typeof car.photo === "string" &&
      car.photo.trim()
    ) {
      return car.photo.trim();
    }


    /* photo_url */

    if (
      typeof car.photo_url === "string" &&
      car.photo_url.trim()
    ) {
      return car.photo_url.trim();
    }


    /*
     * media.thumbs
     */

    if (
      car.media &&
      !Array.isArray(car.media) &&
      Array.isArray(car.media.thumbs) &&
      car.media.thumbs.length
    ) {

      const thumb =
        car.media.thumbs.find(
          item =>
            typeof item === "string" &&
            item.trim()
        );

      if (thumb) {
        return thumb;
      }
    }


    /*
     * media.items
     */

    if (
      car.media &&
      !Array.isArray(car.media) &&
      Array.isArray(car.media.items) &&
      car.media.items.length
    ) {

      const firstImage =
        car.media.items.find(
          item =>
            item &&
            (
              item.type === "image" ||
              item.type === "photo" ||
              !item.type
            )
        );

      if (firstImage) {

        if (
          typeof firstImage.large === "string" &&
          firstImage.large.trim()
        ) {
          return firstImage.large;
        }

        if (
          typeof firstImage.url === "string" &&
          firstImage.url.trim()
        ) {
          return firstImage.url;
        }

        if (
          typeof firstImage.src === "string" &&
          firstImage.src.trim()
        ) {
          return firstImage.src;
        }

        if (
          typeof firstImage.medium === "string" &&
          firstImage.medium.trim()
        ) {
          return firstImage.medium;
        }

        if (
          typeof firstImage.thumb === "string" &&
          firstImage.thumb.trim()
        ) {
          return firstImage.thumb;
        }
      }
    }


    /*
     * media jako tablica
     */

    if (
      Array.isArray(car.media) &&
      car.media.length
    ) {

      for (const item of car.media) {

        if (
          typeof item === "string" &&
          item.trim()
        ) {
          return item.trim();
        }

        if (
          item &&
          typeof item === "object"
        ) {

          const possibleImage =
            item.large ||
            item.url ||
            item.src ||
            item.medium ||
            item.thumb ||
            item.image;

          if (
            typeof possibleImage === "string" &&
            possibleImage.trim()
          ) {
            return possibleImage.trim();
          }
        }
      }
    }


    /*
     * photos jako tablica
     */

    if (
      Array.isArray(car.photos) &&
      car.photos.length
    ) {

      for (const item of car.photos) {

        if (
          typeof item === "string" &&
          item.trim()
        ) {
          return item.trim();
        }

        if (
          item &&
          typeof item === "object"
        ) {

          const possibleImage =
            item.large ||
            item.url ||
            item.src ||
            item.medium ||
            item.thumb;

          if (
            typeof possibleImage === "string" &&
            possibleImage.trim()
          ) {
            return possibleImage.trim();
          }
        }
      }
    }


    /*
     * images jako tablica
     */

    if (
      Array.isArray(car.images) &&
      car.images.length
    ) {

      for (const item of car.images) {

        if (
          typeof item === "string" &&
          item.trim()
        ) {
          return item.trim();
        }

        if (
          item &&
          typeof item === "object"
        ) {

          const possibleImage =
            item.large ||
            item.url ||
            item.src ||
            item.medium ||
            item.thumb;

          if (
            typeof possibleImage === "string" &&
            possibleImage.trim()
          ) {
            return possibleImage.trim();
          }
        }
      }
    }


    /*
     * gallery
     */

    if (
      Array.isArray(car.gallery) &&
      car.gallery.length
    ) {

      for (const item of car.gallery) {

        if (
          typeof item === "string" &&
          item.trim()
        ) {
          return item.trim();
        }

        if (
          item &&
          typeof item === "object"
        ) {

          const possibleImage =
            item.large ||
            item.url ||
            item.src ||
            item.medium ||
            item.thumb;

          if (
            typeof possibleImage === "string" &&
            possibleImage.trim()
          ) {
            return possibleImage.trim();
          }
        }
      }
    }


    return "";
  }


  /*
   * ==========================================================
   * VIN
   * ==========================================================
   */

  function getVin(car) {

    if (!car) {
      return "";
    }

    return (
      car.vin ||
      car.VIN ||
      car.slug_vin ||
      car.vehicle_vin ||
      ""
    );
  }


  /*
   * ==========================================================
   * LOT
   * ==========================================================
   */

  function getLot(car) {

    if (!car) {
      return "—";
    }

    return (
      car.lot_number ||
      car.lot ||
      car.stock_number ||
      car.stock ||
      car.lotNumber ||
      "—"
    );
  }


  /*
   * ==========================================================
   * CENA
   * ==========================================================
   */

  function getPrice(car) {

    if (!car) {
      return null;
    }


    if (
      car.pricing &&
      typeof car.pricing === "object"
    ) {

      if (
        car.pricing.current_bid_usd !== undefined
      ) {
        return car.pricing.current_bid_usd;
      }

      if (
        car.pricing.current_bid !== undefined
      ) {
        return car.pricing.current_bid;
      }

      if (
        car.pricing.bid !== undefined
      ) {
        return car.pricing.bid;
      }

      if (
        car.pricing.price !== undefined
      ) {
        return car.pricing.price;
      }
    }


    return (
      car.price ??
      car.current_bid ??
      car.bid ??
      car.high_bid ??
      null
    );
  }


  /*
   * ==========================================================
   * PRZEBIEG
   * ==========================================================
   */

  function getMileage(car) {

    if (!car) {
      return "—";
    }


    if (
      car.odometer &&
      typeof car.odometer === "object"
    ) {

      if (
        car.odometer.mi !== undefined &&
        car.odometer.mi !== null
      ) {

        const value =
          Number(car.odometer.mi);

        if (!Number.isNaN(value)) {
          return (
            value.toLocaleString("en-US") +
            " mi"
          );
        }

        return (
          car.odometer.mi +
          " mi"
        );
      }

      if (
        car.odometer.value !== undefined
      ) {

        return String(
          car.odometer.value
        );
      }
    }


    if (
      car.mileage !== undefined &&
      car.mileage !== null &&
      car.mileage !== ""
    ) {

      const value =
        Number(car.mileage);

      if (!Number.isNaN(value)) {

        return (
          value.toLocaleString("en-US") +
          " mi"
        );
      }

      return String(car.mileage);
    }


    return "—";
  }


  /*
   * ==========================================================
   * USZKODZENIE
   * ==========================================================
   */

  function getDamage(car) {

    if (!car) {
      return "—";
    }


    if (
      car.condition &&
      typeof car.condition === "object"
    ) {

      if (
        car.condition.primary_damage
      ) {
        return car.condition.primary_damage;
      }

      if (
        car.condition.primaryDamage
      ) {
        return car.condition.primaryDamage;
      }

      if (
        car.condition.damage
      ) {
        return car.condition.damage;
      }
    }


    return (
      car.damage ||
      car.primary_damage ||
      car.primaryDamage ||
      "—"
    );
  }


  /*
   * ==========================================================
   * PLATFORMA
   * ==========================================================
   */

  function getPlatform(car) {

    if (!car) {
      return "—";
    }

    return (
      car.platform ||
      car.auction_platform ||
      car.auctionPlatform ||
      car.source ||
      car.auction ||
      "—"
    )
      .toString()
      .toUpperCase();
  }


  /*
   * ==========================================================
   * LOKALIZACJA
   * ==========================================================
   */

  function getLocation(car) {

    if (!car) {
      return "—";
    }


    if (
      car.location &&
      typeof car.location === "object"
    ) {

      return (
        car.location.display ||
        car.location.name ||
        car.location.city ||
        car.location.state ||
        "—"
      );
    }


    if (
      car.location
    ) {
      return car.location;
    }


    if (
      car.city &&
      car.state
    ) {
      return (
        car.city +
        ", " +
        car.state
      );
    }


    return (
      car.city ||
      car.state ||
      "—"
    );
  }


  /*
   * ==========================================================
   * STATUS
   * ==========================================================
   */

  function getStatus(car) {

    if (!car) {
      return "";
    }


    if (
      car.auction &&
      typeof car.auction === "object" &&
      car.auction.state
    ) {
      return car.auction.state;
    }


    return (
      car.status ||
      car.state ||
      ""
    );
  }


  /*
   * ==========================================================
   * RENDEROWANIE SAMOCHODÓW
   * ==========================================================
   */

  function renderCars(cars) {

    if (
      !Array.isArray(cars) ||
      cars.length === 0
    ) {

      carsContainer.innerHTML = `
        <div
          class="message"
          style="grid-column:1/-1"
        >
          Nie znaleziono samochodów.
        </div>
      `;

      resultStatus.textContent =
        "0 ofert";

      return;
    }


    resultStatus.textContent =
      `${cars.length} ofert`;


    carsContainer.innerHTML =
      cars.map(car => {

        const image =
          getCarImage(car);

        const title =
          getTitle(car);

        const vin =
          getVin(car);

        const lot =
          getLot(car);

        const price =
          getPrice(car);

        const mileage =
          getMileage(car);

        const damage =
          getDamage(car);

        const location =
          getLocation(car);

        const platformName =
          getPlatform(car);

        const status =
          getStatus(car);

        const identifier =
          vin ||
          lot ||
          "";


        /*
         * ZDJĘCIE
         */

        const imageHtml =
          image
            ? `
              <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              />

              <div
                style="
                  display:none;
                  width:100%;
                  height:100%;
                  align-items:center;
                  justify-content:center;
                  color:#68717b;
                  font-size:14px;
                "
              >
                Brak zdjęcia
              </div>
            `
            : `
              <div
                style="
                  width:100%;
                  height:100%;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  color:#68717b;
                  font-size:14px;
                "
              >
                Brak zdjęcia
              </div>
            `;


        /*
         * STATUS
         */

        let statusHtml = "";

        if (status) {

          const normalizedStatus =
            String(status).toLowerCase();

          let statusText =
            String(status).toUpperCase();

          if (
            normalizedStatus === "open" ||
            normalizedStatus === "active"
          ) {
            statusText = "AKTYWNA";
          }

          statusHtml = `
            <div class="status-badge">
              ${escapeHtml(statusText)}
            </div>
          `;
        }


        /*
         * LINK
         */

        const detailUrl =
          identifier
            ? `/car.html?vin=${encodeURIComponent(identifier)}`
            : "#";


        return `
          <article class="car-card">

            <a
              href="${detailUrl}"
            >

              <div class="car-image">

                ${imageHtml}

                <div class="platform">
                  ${escapeHtml(platformName)}
                </div>

                ${statusHtml}

              </div>


              <div class="car-content">

                <h3 class="car-title">
                  ${escapeHtml(title)}
                </h3>


                <div class="car-vin">
                  VIN:
                  ${escapeHtml(vin || "—")}
                </div>


                <div class="car-grid">

                  <div class="spec">

                    <small>
                      Rok
                    </small>

                    <strong>
                      ${escapeHtml(
                        car.year ||
                        car.vehicle_year ||
                        "—"
                      )}
                    </strong>

                  </div>


                  <div class="spec">

                    <small>
                      Przebieg
                    </small>

                    <strong>
                      ${escapeHtml(mileage)}
                    </strong>

                  </div>


                  <div class="spec">

                    <small>
                      Uszkodzenie
                    </small>

                    <strong>
                      ${escapeHtml(damage)}
                    </strong>

                  </div>


                  <div class="spec">

                    <small>
                      Lot
                    </small>

                    <strong>
                      ${escapeHtml(lot)}
                    </strong>

                  </div>


                  <div class="spec">

                    <small>
                      Lokalizacja
                    </small>

                    <strong>
                      ${escapeHtml(location)}
                    </strong>

                  </div>


                  <div class="spec">

                    <small>
                      Platforma
                    </small>

                    <strong>
                      ${escapeHtml(platformName)}
                    </strong>

                  </div>

                </div>


                <div class="car-bottom">

                  <div class="price">
                    ${formatMoney(price)}
                  </div>

                  <span class="details-btn">
                    Zobacz ofertę →
                  </span>

                </div>

              </div>

            </a>

          </article>
        `;

      }).join("");
  }


  /*
   * ==========================================================
   * LOADING
   * ==========================================================
   */

  function showLoading() {

    carsContainer.innerHTML = `
      <div
        class="message"
        style="grid-column:1/-1"
      >

        <div class="spinner"></div>

        Pobieranie ofert...

      </div>
    `;

    resultStatus.textContent =
      "Ładowanie...";
  }


  /*
   * ==========================================================
   * ERROR
   * ==========================================================
   */

  function showError(message) {

    carsContainer.innerHTML = `
      <div
        class="message"
        style="grid-column:1/-1"
      >

        <strong
          style="
            display:block;
            color:#ff5d5d;
            margin-bottom:10px;
            font-size:18px;
          "
        >
          Nie udało się pobrać ofert
        </strong>

        <div>
          ${escapeHtml(message)}
        </div>

      </div>
    `;

    resultStatus.textContent =
      "Błąd";
  }


  /*
   * ==========================================================
   * WCZYTYWANIE OFERT
   * ==========================================================
   */

  async function loadCars() {

    showLoading();


    const params =
      new URLSearchParams();


    const search =
      searchInput.value.trim();


    if (search) {

      params.set(
        "s",
        search
      );
    }


    if (platform.value) {

      params.set(
        "platform",
        platform.value
      );
    }


    if (make.value.trim()) {

      params.set(
        "make",
        make.value.trim()
      );
    }


    if (model.value.trim()) {

      params.set(
        "model",
        model.value.trim()
      );
    }


    if (yearFrom.value) {

      params.set(
        "year_from",
        yearFrom.value
      );
    }


    if (yearTo.value) {

      params.set(
        "year_to",
        yearTo.value
      );
    }


    params.set(
      "per_page",
      "20"
    );


    try {

      const response =
        await fetch(
          `${API_BASE}/cars?${params.toString()}`,
          {
            method: "GET",

            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      const contentType =
        response.headers.get(
          "content-type"
        ) || "";


      /*
       * Jeżeli API nie zwróci JSON,
       * pokażemy prawdziwą odpowiedź.
       */

      if (
        !contentType.includes(
          "application/json"
        )
      ) {

        const text =
          await response.text();

        throw new Error(
          `API nie zwróciło JSON. HTTP ${response.status}. ${text.slice(0, 300)}`
        );
      }


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error ||
          `HTTP ${response.status}`
        );
      }


      if (
        result.ok === false
      ) {

        throw new Error(
          result.error ||
          "API zwróciło błąd"
        );
      }


      /*
       * Obsługa kilku możliwych formatów odpowiedzi API.
       */

      let cars = [];


      if (
        Array.isArray(result.data)
      ) {

        cars = result.data;

      } else if (
        result.data &&
        Array.isArray(result.data.cars)
      ) {

        cars = result.data.cars;

      } else if (
        Array.isArray(result.cars)
      ) {

        cars = result.cars;

      } else if (
        Array.isArray(result.results)
      ) {

        cars = result.results;

      } else if (
        Array.isArray(result.items)
      ) {

        cars = result.items;
      }


      renderCars(cars);


    } catch (error) {

      console.error(
        "Rex.Bid API error:",
        error
      );


      showError(
        error &&
        error.message
          ? error.message
          : "Nieznany błąd"
      );
    }
  }


  /*
   * ==========================================================
   * WYSZUKIWANIE
   * ==========================================================
   */

  searchForm.addEventListener(
    "submit",
    event => {

      event.preventDefault();

      loadCars();


      document
        .getElementById("results")
        .scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
    }
  );


  /*
   * ==========================================================
   * FILTRY
   * ==========================================================
   */

  filterButton.addEventListener(
    "click",
    loadCars
  );


  /*
   * ==========================================================
   * START
   * ==========================================================
   */

  loadCars();

</script>

</body>
</html>
