<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rex.Bid — Aukcje samochodowe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #17191c;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .topbar {
      background: #111315;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }

    .nav {
      max-width: 1400px;
      min-height: 72px;
      margin: auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }

    .logo span {
      color: #ffb400;
    }

    .menu {
      display: flex;
      gap: 24px;
      flex: 1;
    }

    .menu a {
      color: #d5d8db;
      font-size: 14px;
      font-weight: 700;
    }

    .menu a:hover {
      color: #fff;
    }

    .hero {
      background: #111315;
      color: white;
      padding: 55px 24px 65px;
    }

    .hero-inner {
      max-width: 1200px;
      margin: auto;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 42px;
      letter-spacing: -1px;
    }

    .hero p {
      margin: 0 0 28px;
      color: #bfc3c7;
      font-size: 16px;
    }

    .search {
      max-width: 850px;
      margin: auto;
      display: flex;
      background: white;
      border-radius: 9px;
      padding: 5px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 15px;
      font-size: 15px;
    }

    .search button {
      border: 0;
      background: #ffb400;
      color: #111315;
      border-radius: 7px;
      padding: 0 25px;
      font-weight: 900;
      cursor: pointer;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 30px 24px 70px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .filter {
      background: white;
      border: 1px solid #dfe2e5;
      border-radius: 8px;
      padding: 12px;
      outline: 0;
    }

    .results-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .results-title {
      font-size: 22px;
      font-weight: 900;
    }

    .results-count {
      color: #70757b;
      font-size: 13px;
    }

    .status {
      background: white;
      border: 1px solid #e0e3e6;
      border-radius: 10px;
      padding: 35px;
      text-align: center;
      color: #666;
    }

    .status strong {
      display: block;
      color: #17191c;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .cars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #e0e3e6;
      border-radius: 10px;
      overflow: hidden;
      transition: .15s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 22px rgba(0,0,0,.08);
    }

    .image-wrap {
      height: 230px;
      background: #e8eaec;
      position: relative;
    }

    .car-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .platform {
      position: absolute;
      left: 12px;
      top: 12px;
      background: #111315;
      color: white;
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 10px;
      font-weight: 900;
    }

    .card-body {
      padding: 17px;
    }

    .card-title {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .vin {
      color: #777d83;
      font-size: 11px;
      margin-bottom: 15px;
      word-break: break-all;
    }

    .price {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid #eceef0;
      border-bottom: 1px solid #eceef0;
    }

    .spec {
      padding: 10px 5px;
    }

    .spec:nth-child(odd) {
      border-right: 1px solid #eceef0;
    }

    .spec-label {
      color: #858a90;
      font-size: 10px;
      margin-bottom: 4px;
    }

    .spec-value {
      font-size: 12px;
      font-weight: 800;
    }

    .card-button {
      display: block;
      background: #ffb400;
      color: #111315;
      text-align: center;
      padding: 12px;
      border-radius: 7px;
      margin-top: 15px;
      font-size: 13px;
      font-weight: 900;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .pagination button {
      border: 1px solid #d8dce0;
      background: white;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 800;
    }

    .pagination button:hover {
      background: #f0f1f2;
    }

    footer {
      background: #111315;
      color: #aeb3b8;
      padding: 35px 24px;
    }

    .footer-inner {
      max-width: 1400px;
      margin: auto;
    }

    .footer-logo {
      color: white;
      font-size: 25px;
      font-weight: 900;
    }

    .footer-logo span {
      color: #ffb400;
    }

    .copyright {
      margin-top: 12px;
      font-size: 12px;
    }

    @media (max-width: 1000px) {
      .cars {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .nav {
        padding: 14px;
      }

      .menu {
        display: none;
      }

      .hero {
        padding: 40px 15px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .search {
        display: block;
        padding: 5px;
      }

      .search input {
        width: 100%;
      }

      .search button {
        width: 100%;
        height: 45px;
      }

      .container {
        padding: 22px 14px 50px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .cars {
        grid-template-columns: 1fr;
      }

      .results-top {
        display: block;
      }

      .results-count {
        margin-top: 5px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="nav">

    <a href="index.html" class="logo">
      Rex<span>.Bid</span>
    </a>

    <nav class="menu">
      <a href="index.html">Aukcje</a>
      <a href="jak-to-dziala.html">Jak to działa</a>
      <a href="o-nas.html">O nas</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="ulubione.html">♡ Ulubione</a>
    </nav>

  </div>
</header>


<section class="hero">

  <div class="hero-inner">

    <h1>Aukcje samochodów z USA</h1>

    <p>
      Wyszukuj samochody z Copart i IAAI
      w jednym miejscu.
    </p>

    <form class="search" id="searchForm">

      <input
        id="searchInput"
        type="text"
        placeholder="VIN, marka, model lub numer lot..."
      >

      <button type="submit">
        SZUKAJ
      </button>

    </form>

  </div>

</section>


<main class="container">

  <div class="toolbar">

    <select id="platformFilter" class="filter">
      <option value="">Wszystkie platformy</option>
      <option value="COPART">Copart</option>
      <option value="IAAI">IAAI</option>
    </select>

    <input
      id="makeFilter"
      class="filter"
      placeholder="Marka"
    >

    <input
      id="yearFrom"
      class="filter"
      type="number"
      placeholder="Rok od"
    >

    <select id="statusFilter" class="filter">
      <option value="">Wszystkie aukcje</option>
      <option value="live">Aktywne</option>
      <option value="ended">Zakończone</option>
    </select>

  </div>


  <div class="results-top">

    <div class="results-title">
      Najnowsze aukcje
    </div>

    <div
      class="results-count"
      id="resultsCount"
    >
      Ładowanie...
    </div>

  </div>


  <div id="status" class="status">
    <strong>Ładowanie aukcji...</strong>
    Pobieranie danych z API.
  </div>


  <div
    id="cars"
    class="cars"
    style="display:none"
  ></div>


  <div
    id="pagination"
    class="pagination"
    style="display:none"
  >

    <button id="nextButton">
      Następne aukcje →
    </button>

  </div>

</main>


<footer>

  <div class="footer-inner">

    <div class="footer-logo">
      Rex<span>.Bid</span>
    </div>

    <div class="copyright">
      © 2026 Rex.Bid. Wszystkie prawa zastrzeżone.
    </div>

  </div>

</footer>


<script>

const FALLBACK_IMAGE =
  "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80";


let currentCursor = null;


function safe(value, fallback = "—") {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return fallback;
  }

  return value;
}


function money(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "—";
  }

  const number = Number(value);

  if (Number.isNaN(number)) {
    return value;
  }

  return "$" +
    number.toLocaleString("en-US");
}


function getMileage(car) {

  if (
    car.odometer &&
    typeof car.odometer === "object"
  ) {

    if (
      car.odometer.mi !== undefined
    ) {
      return Number(
        car.odometer.mi
      ).toLocaleString("en-US") + " mi";
    }

    if (
      car.odometer.km !== undefined
    ) {
      return Number(
        car.odometer.km
      ).toLocaleString("en-US") + " km";
    }

  }

  return safe(
    car.mileage
  );
}


function getPrice(car) {

  if (
    car.pricing &&
    typeof car.pricing === "object"
  ) {

    if (
      car.pricing.current_bid_usd !==
      undefined
    ) {
      return car.pricing.current_bid_usd;
    }

    if (
      car.pricing.buy_now_usd !==
      undefined
    ) {
      return car.pricing.buy_now_usd;
    }

  }

  return car.price;
}


function getDamage(car) {

  if (
    car.condition &&
    car.condition.primary_damage
  ) {
    return car.condition.primary_damage;
  }

  return safe(car.damage);
}


function getLocation(car) {

  if (
    car.location &&
    typeof car.location === "object"
  ) {

    if (car.location.display) {
      return car.location.display;
    }

    if (car.location.city) {
      return car.location.city;
    }

  }

  return safe(
    car.location,
    "USA"
  );
}


function getImages(car) {

  let images = [];

  if (
    car.media &&
    Array.isArray(car.media.images)
  ) {
    images = car.media.images;
  }

  if (
    car.media &&
    Array.isArray(car.media.thumbs)
  ) {
    images = images.length
      ? images
      : car.media.thumbs;
  }

  if (
    Array.isArray(car.images)
  ) {
    images = car.images;
  }

  images = images.filter(
    item => typeof item === "string" && item
  );

  return images.length
    ? images
    : [FALLBACK_IMAGE];
}


function getTitle(car) {

  if (car.title) {
    return car.title;
  }

  return (
    safe(car.year, "") +
    " " +
    safe(car.make, "") +
    " " +
    safe(car.model, "")
  ).trim();
}


function getVin(car) {

  return (
    car.vin ||
    car.vehicle_vin ||
    car.lot_number ||
    car.lot ||
    ""
  );
}


function getPlatform(car) {

  return String(
    car.platform ||
    car.source ||
    ""
  ).toUpperCase();
}


function buildCard(car) {

  const vin = getVin(car);

  const title = getTitle(car);

  const images = getImages(car);

  const image = images[0];

  const price = getPrice(car);

  const platform =
    getPlatform(car);

  const mileage =
    getMileage(car);

  const damage =
    getDamage(car);

  const location =
    getLocation(car);

  const lot =
    car.lot ||
    car.lot_number ||
    "—";

  return `

    <article class="card">

      <div class="image-wrap">

        <img
          class="car-image"
          src="${escapeHtml(image)}"
          alt="${escapeHtml(title)}"
          loading="lazy"
          onerror="this.src='${FALLBACK_IMAGE}'"
        >

        ${
          platform
            ? `<div class="platform">${escapeHtml(platform)}</div>`
            : ""
        }

      </div>


      <div class="card-body">

        <div class="card-title">
          ${escapeHtml(title)}
        </div>

        <div class="vin">
          VIN: ${escapeHtml(vin || "—")}
        </div>

        <div class="price">
          ${money(price)}
        </div>


        <div class="specs">

          <div class="spec">

            <div class="spec-label">
              PRZEBIEG
            </div>

            <div class="spec-value">
              ${escapeHtml(mileage)}
            </div>

          </div>


          <div class="spec">

            <div class="spec-label">
              USZKODZENIE
            </div>

            <div class="spec-value">
              ${escapeHtml(damage)}
            </div>

          </div>


          <div class="spec">

            <div class="spec-label">
              LOKALIZACJA
            </div>

            <div class="spec-value">
              ${escapeHtml(location)}
            </div>

          </div>


          <div class="spec">

            <div class="spec-label">
              LOT
            </div>

            <div class="spec-value">
              ${escapeHtml(lot)}
            </div>

          </div>

        </div>


        <a
          class="card-button"
          href="car.html?vin=${encodeURIComponent(vin)}"
        >
          ZOBACZ SAMOCHÓD →
        </a>

      </div>

    </article>

  `;
}


function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function showStatus(title, message) {

  const status =
    document.getElementById("status");

  status.style.display = "block";

  status.innerHTML = `
    <strong>${escapeHtml(title)}</strong>
    ${escapeHtml(message)}
  `;

}


function hideStatus() {

  document.getElementById(
    "status"
  ).style.display = "none";

}


async function loadCars(
  append = false
) {

  const carsElement =
    document.getElementById("cars");

  const search =
    document.getElementById(
      "searchInput"
    ).value.trim();

  const platform =
    document.getElementById(
      "platformFilter"
    ).value;

  const make =
    document.getElementById(
      "makeFilter"
    ).value.trim();

  const yearFrom =
    document.getElementById(
      "yearFrom"
    ).value;


  const params =
    new URLSearchParams();

  params.set(
    "per_page",
    "20"
  );


  if (search) {
    params.set(
      "s",
      search
    );
  }


  if (platform) {
    params.set(
      "platform",
      platform
    );
  }


  if (make) {
    params.set(
      "make",
      make
    );
  }


  if (yearFrom) {
    params.set(
      "year_from",
      yearFrom
    );
  }


  if (
    append &&
    currentCursor
  ) {
    params.set(
      "cursor",
      currentCursor
    );
  }


  showStatus(
    "Ładowanie aukcji...",
    "Pobieranie danych."
  );


  try {

    const response =
      await fetch(
        "/api/cars?" +
        params.toString()
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.error ||
        "Błąd API"
      );

    }


    const cars =
      Array.isArray(
        result.data
      )
        ? result.data
        : [];


    if (!append) {

      carsElement.innerHTML = "";

    }


    if (!cars.length) {

      if (!append) {

        showStatus(
          "Brak ofert",
          "Nie znaleziono samochodów dla wybranych kryteriów."
        );

      }

      document.getElementById(
        "pagination"
      ).style.display = "none";

      return;

    }


    carsElement.insertAdjacentHTML(
      "beforeend",
      cars.map(
        buildCard
      ).join("")
    );


    hideStatus();

    carsElement.style.display =
      "grid";


    document.getElementById(
      "resultsCount"
    ).textContent =
      cars.length +
      (
        cars.length === 1
          ? " oferta"
          : " ofert"
      );


    currentCursor =
      result.meta?.next_cursor ||
      result.next_cursor ||
      null;


    document.getElementById(
      "pagination"
    ).style.display =
      currentCursor
        ? "flex"
        : "none";


  } catch (error) {

    console.error(error);

    showStatus(
      "Nie udało się pobrać ofert",
      "API zwróciło błąd: " +
      error.message
    );

    carsElement.style.display =
      "none";

  }

}


document
  .getElementById("searchForm")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();

      currentCursor = null;

      loadCars(false);

    }
  );


document
  .getElementById("platformFilter")
  .addEventListener(
    "change",
    function() {

      currentCursor = null;

      loadCars(false);

    }
  );


document
  .getElementById("makeFilter")
  .addEventListener(
    "change",
    function() {

      currentCursor = null;

      loadCars(false);

    }
  );


document
  .getElementById("yearFrom")
  .addEventListener(
    "change",
    function() {

      currentCursor = null;

      loadCars(false);

    }
  );


document
  .getElementById("statusFilter")
  .addEventListener(
    "change",
    function() {

      currentCursor = null;

      loadCars(false);

    }
  );


document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    function() {

      if (currentCursor) {
        loadCars(true);
      }

    }
  );


loadCars(false);

</script>

</body>
</html>
