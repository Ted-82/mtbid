<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porównanie samochodów | Rex.Bid</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#1c2d3c;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}a{color:inherit}header{background:#fff;border-bottom:1px solid #dfe5ea}.head,main{width:min(1240px,calc(100% - 36px));margin:auto}.head{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:23px;font-weight:900;text-decoration:none;letter-spacing:-1px}.logo span{color:#d99b18}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{font-size:13px;text-decoration:none;color:#51616e;font-weight:700}.counter{margin-left:4px;padding:2px 6px;border-radius:20px;background:#eef1f4}main{padding:34px 0 60px}h1{margin:0;font-size:clamp(27px,4vw,38px);letter-spacing:-.04em}.sub{color:#6d7a85;line-height:1.6;margin:9px 0 24px}.local-note{color:#788590;font-size:12px;margin:0 0 20px}.empty{padding:48px 20px;border:1px dashed #bdc9d2;border-radius:15px;background:#fff;text-align:center}.empty p{color:#73818d}.button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1px solid #d5dee5;border-radius:8px;background:#fff;color:#293c4a;font:700 12px Arial,sans-serif;text-decoration:none;cursor:pointer}.button:hover{border-color:#c79325;background:#fffaf0}.table-wrap{overflow:auto;border:1px solid #dde4e9;border-radius:14px;background:#fff;box-shadow:0 6px 22px #1731490c}.compare-table{border-collapse:separate;border-spacing:0;min-width:760px;width:100%}.compare-table th,.compare-table td{padding:13px 14px;text-align:left;vertical-align:top;border-bottom:1px solid #edf0f2;min-width:190px}.compare-table th:first-child,.compare-table td:first-child{position:sticky;left:0;z-index:1;min-width:155px;width:155px;background:#f8fafb;color:#62717e;font-size:11px;font-weight:800}.compare-table thead th{background:#f8fafb}.compare-table thead th:first-child{z-index:2}.vehicle-head{display:grid;gap:10px}.vehicle-head img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#edf1f4}.vehicle-head strong{font-size:14px;line-height:1.4}.vehicle-head .actions{display:flex;flex-wrap:wrap;gap:6px}.vehicle-head .button{min-height:34px;padding:0 9px;font-size:11px}.value{font-size:13px;line-height:1.5;overflow-wrap:anywhere}.price-label{display:block;color:#74818c;font-size:10px;font-weight:800;margin-bottom:2px}.status{display:inline-block;padding:4px 7px;border-radius:20px;background:#eff3f5;font-size:11px;font-weight:800}.note{font-size:11px;color:#788590;margin-top:12px}@media(max-width:640px){.head,main{width:calc(100% - 24px)}.head{min-height:60px}.head nav{gap:10px}.compare-table th,.compare-table td{padding:10px;min-width:175px}.compare-table th:first-child,.compare-table td:first-child{min-width:125px;width:125px}}
    .vehicle-head-image{display:grid;place-items:center;aspect-ratio:16/10;border-radius:8px;background:#edf1f4;color:#7a8791}
  </style>
</head>
<body>
<header><div class="head"><a href="/" class="logo">Rex<span>.Bid</span></a><nav aria-label="Nawigacja"><a href="/">Samochody</a><a href="/ulubione.html">Obserwowane <span class="counter" data-rexbid-count="favorites">0</span></a><a href="/compare.html" aria-current="page">Porównanie <span class="counter" data-rexbid-count="compare">0</span></a></nav></div></header>
<main><h1>Porównanie samochodów</h1><p class="sub">Zestaw obok siebie wybrane dane aukcyjne i pojazdu. Pokazujemy wyłącznie informacje zapisane z dostępnych danych.</p><p class="local-note">Dane porównania zapisane na tym urządzeniu.</p><div id="compareContent" aria-live="polite"></div></main>
<script src="/rexbid-storage.js"></script>
<script>
(() => {
  const storage = window.RexBidStorage;
  const target = document.getElementById("compareContent");
  const esc = storage.escapeHtml;
  const val = value => value === null || value === undefined || String(value).trim() === "" ? "—" : esc(value);
  const money = value => value === null || value === undefined || !Number.isFinite(Number(value)) ? "" : new Intl.NumberFormat("en-US", {style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(value));
  const statusLabel = value => ({finished:"Zakończona",sold:"Sprzedano",closed:"Zakończona",ended:"Zakończona",open:"Aktywna",active:"Aktywna",live:"W trakcie",upcoming:"Zaplanowana",scheduled:"Zaplanowana",not_sold:"Nie sprzedano"})[String(value || "").toLowerCase()] || value || "—";
  function priceInfo(car) {
    const state = String(car.auction?.state || "").toLowerCase();
    const finished = ["finished","sold","closed","ended","not_sold","no_sale"].includes(state);
    const p = car.pricing || {};
    if (finished && p.sale_price_usd !== null && p.sale_price_usd !== undefined) return ["Cena sprzedaży", money(p.sale_price_usd)];
    if (finished && p.final_price_usd !== null && p.final_price_usd !== undefined) return ["Cena sprzedaży", money(p.final_price_usd)];
    if (finished && p.last_sold_price_usd !== null && p.last_sold_price_usd !== undefined) return ["Ostatnia cena sprzedaży", money(p.last_sold_price_usd)];
    if (p.current_bid_usd !== null && p.current_bid_usd !== undefined) return ["Aktualna oferta", money(p.current_bid_usd)];
    if (p.buy_now_usd !== null && p.buy_now_usd !== undefined) return ["Kup teraz", money(p.buy_now_usd)];
    return ["Cena aukcji", ""];
  }
  const rows = [
    ["Rok", car => val(car.year)], ["Marka", car => val(car.make)], ["Model", car => val(car.model)], ["Wersja", car => val(car.series)],
    ["Platforma", car => val(car.platform)], ["VIN", car => val(car.vin)], ["LOT", car => val(car.lot)],
    ["Cena", car => { const p = priceInfo(car); return `<span class="price-label">${esc(p[0])}</span>${p[1] ? esc(p[1]) : "—"}`; }],
    ["Przebieg", car => val(car.odometer)], ["Główne uszkodzenie", car => val(car.primary_damage)],
    ["Drugorzędne uszkodzenie", car => val(car.secondary_damage)], ["Dokument / title", car => val(car.title_document)],
    ["Silnik", car => val(car.engine)], ["Paliwo", car => val(car.fuel)], ["Skrzynia", car => val(car.transmission)],
    ["Napęd", car => val(car.drivetrain)], ["Lokalizacja", car => val(car.location)],
    ["Data aukcji", car => val(car.auction?.date)], ["Status aukcji", car => `<span class="status">${val(statusLabel(car.auction?.state))}</span>`],
    ["Sprzedający", car => val(car.seller)]
  ];
  function render() {
    const cars = storage.getCompare();
    storage.refreshCounts();
    if (!cars.length) {
      target.innerHTML = '<div class="empty"><h2>Nie wybrano samochodów</h2><p>Dodaj maksymalnie trzy pojazdy z listy lub karty samochodu.</p><a class="button" href="/">Przejdź do samochodów</a></div>';
      return;
    }
    const headers = cars.map(car => {
      const image = storage.safeImageUrl(car.image);
      return `<th><div class="vehicle-head">${image ? `<img src="${esc(image)}" alt="${val(car.title)}" loading="lazy">` : '<div class="vehicle-head-image">—</div>'}<strong>${val(car.title || [car.year,car.make,car.model,car.series].filter(Boolean).join(" "))}</strong><div class="actions"><a class="button" href="${esc(storage.detailHref(car))}">Otwórz auto</a><button class="button" data-remove="${esc(car.id)}" type="button">Usuń</button></div></div></th>`;
    }).join("");
    const body = rows.map(([label, renderValue]) => `<tr><th scope="row">${esc(label)}</th>${cars.map(car => `<td><div class="value">${renderValue(car)}</div></td>`).join("")}</tr>`).join("");
    target.innerHTML = `<div class="table-wrap" role="region" aria-label="Tabela porównania samochodów" tabindex="0"><table class="compare-table"><thead><tr><th scope="col">Dane</th>${headers}</tr></thead><tbody>${body}</tbody></table></div><p class="note">Brakujące informacje są oznaczone kreską. Rex.Bid nie ocenia ani nie szereguje pojazdów.</p>`;
  }
  target.addEventListener("click", event => {
    const button = event.target.closest("button[data-remove]");
    if (!button) return;
    storage.removeCompare(button.dataset.remove);
    render();
  });
  render();
})();
</script>
</body>
</html>
