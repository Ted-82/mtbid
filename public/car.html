  /* AUCTION HISTORY — historia zmian ceny/statusu dla każdego VIN-u */
  const HISTORY_KEY = "rex_bid_auction_history_v1";
  const HISTORY_MAX_PER_VIN = 500;

  function historyKey() {
    const vin = String(getVin() || "").trim().toUpperCase();
    const platform = String(platformName() || "").trim().toUpperCase();
    const lot = String(getLot() || "").trim();
    return `${platform}|${lot}|${vin}`;
  }

  function readAuctionHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      const data = raw ? JSON.parse(raw) : {};
      return data && typeof data === "object" ? data : {};
    } catch (_) {
      return {};
    }
  }

  function writeAuctionHistory(data) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(data));
    } catch (_) {
      // Brak miejsca / tryb prywatny — historia bieżącej strony nadal działa.
    }
  }

  function saveAuctionSnapshot() {
    const key = historyKey();
    if (!key || key.endsWith("|")) return;

    const phase = auctionPhase();
    const bid = getAuctionBid();
    const snapshot = {
      at: new Date().toISOString(),
      phase,
      status: String(getAuctionStatus() || ""),
      bid: isEmpty(bid) ? null : Number(bid),
      auctionStart: getAuctionStart() || null,
      auctionEnd: getAuctionEnd() || null
    };

    const data = readAuctionHistory();
    const list = Array.isArray(data[key]) ? data[key] : [];
    const previous = list[list.length - 1];

    // Nie zapisujemy identycznych odczytów co 10 sekund.
    if (
      previous &&
      previous.phase === snapshot.phase &&
      String(previous.status) === String(snapshot.status) &&
      String(previous.bid) === String(snapshot.bid)
    ) {
      return;
    }

    list.push(snapshot);
    data[key] = list.slice(-HISTORY_MAX_PER_VIN);
    writeAuctionHistory(data);
    renderAuctionHistory();
  }

  function historyField(record, keys) {
    for (const key of keys) {
      if (record && Object.prototype.hasOwnProperty.call(record, key) && !isEmpty(record[key])) {
        return record[key];
      }
    }
    return null;
  }

  function historyNested(record, paths) {
    for (const path of paths) {
      let value = record;
      for (const part of path) {
        if (!value || typeof value !== "object") {
          value = null;
          break;
        }
        value = value[part];
      }
      if (!isEmpty(value)) return value;
    }
    return null;
  }

  function normalizeHistoryRecord(record) {
    if (!record || typeof record !== "object") return null;

    const platform = first(
      historyField(record,["platform","source","auction_platform"]),
      historyNested(record,[["vehicle","platform"],["auction","platform"]]),
      platformName()
    );

    // Apibara rozróżnia datę aukcji od daty sprzedaży.
    // Dla sprzedanych rekordów Bid.Cars pokazuje dzień sprzedaży, więc
    // najpierw korzystamy z auction.last_sold_day. Dla niesprzedanych
    // pokazujemy faktyczną datę aukcji (auction.auction_at).
    const rawStatus = first(
      historyNested(record,[["auction","last_sold_status"]]),
      historyField(record,["last_sold_status","lastSoldStatus"]),
      historyNested(record,[["sale","status"]]),
      historyField(record,["sale_status","saleStatus","outcome","result","status","auction_status","auctionStatus","state","lot_sub_status","lotSubStatus"]),
      historyNested(record,[["auction","sale_status"],["auction","saleStatus"],["auction","outcome"],["auction","result"],["auction","status"],["auction","state"],["auction","lot_sub_status"]])
    );
    const statusText = String(displayValue(rawStatus) || "").toLowerCase();
    const isSold = /sold on approval|on approval|sale pending approval|\bsold\b|sale complete|completed|won|approved/.test(statusText)
      && !/not sold|no sale|unsold|failed/.test(statusText);

    const date = isSold
      ? first(
          historyNested(record,[["auction","last_sold_day"]]),
          historyField(record,["last_sold_day","lastSoldDay"]),
          historyNested(record,[["sale","date"],["sale","sold_at"]]),
          historyField(record,["sale_date","saleDate","sold_at","soldAt"]),
          historyNested(record,[["auction","auction_at"],["auction","auctionAt"],["auction","full_date"]]),
          historyField(record,["auction_date","auctionDate","auction_at","auctionAt","date"])
        )
      : first(
          historyNested(record,[["auction","auction_at"],["auction","auctionAt"],["auction","full_date"]]),
          historyField(record,["auction_date","auctionDate","auction_at","auctionAt","date","sale_date","saleDate"]),
          historyNested(record,[["sale","date"]])
        );

    const lot = first(
      historyField(record,["lot_number","lotNumber","lot","stock_number","stockNumber","stock"]),
      historyNested(record,[["vehicle","lot_number"],["auction","lot_number"],["auction","lotNumber"]]),
      getLot()
    );

    // Cena sprzedaży i bieżąca oferta są osobnymi wartościami.
    // Nie używamy Buy Now / estimated_cost ani przypadkowego pola price.
    const salePrice = first(
      historyNested(record,[["pricing","last_sold_price_usd"]]),
      historyField(record,["last_sold_price_usd","lastSoldPriceUsd","last_sold_price","lastSoldPrice"]),
      historyNested(record,[["pricing","sale_price_usd"],["pricing","final_bid_usd"],["pricing","final_price_usd"],["pricing","sold_price_usd"]]),
      historyField(record,["sale_price_usd","salePriceUsd","final_bid_usd","finalBidUsd","final_price_usd","finalPriceUsd","sold_price_usd","soldPriceUsd","sale_price","salePrice","final_bid","finalBid","final_price","finalPrice","sold_price","soldPrice"])
    );

    const currentBid = first(
      historyNested(record,[["pricing","current_bid_usd"],["pricing","currentBidUsd"]]),
      historyField(record,["current_bid_usd","currentBidUsd","current_bid","currentBid","bid","Bid"]),
      historyNested(record,[["auction","current_bid_usd"],["auction","currentBidUsd"]])
    );

    // Dla sprzedanych pokazujemy cenę sprzedaży. Dla niesprzedanych /
    // relistów pokazujemy ostatnią ofertę, tak jak w historii Bid.Cars.
    const price = isSold ? salePrice : first(currentBid, salePrice);

    const seller = first(
      historyField(record,["seller_name","sellerName","seller"]),
      historyNested(record,[["seller","name"],["seller","displayName"]]),
      historyField(record,["seller_type","sellerType"]),
      historyNested(record,[["seller","type"]])
    );

    if (isEmpty(date) && isEmpty(price) && isEmpty(rawStatus) && isEmpty(lot)) return null;

    return {
      platform: String(displayValue(platform) || platformName()),
      date,
      lot,
      price: isEmpty(price) ? null : price,
      status: String(displayValue(rawStatus) || "").trim(),
      seller: String(displayValue(seller) || "").trim(),
      raw: record
    };
  }

  function historyStatusLabel(status) {
    const s = String(status || "").toLowerCase().trim();
    if (!s) return "Brak informacji";
    if (/sold on approval|on approval|sale pending approval/.test(s)) return "Sprzedano warunkowo";
    if (/sold|sale complete|completed|won|approved/.test(s) && !/not sold|no sale|unsold|failed/.test(s)) return "Sprzedano";
    if (/not sold|no sale|unsold|not_sold|failed/.test(s)) return "Nie sprzedano";
    if (/live|open|active|running|in progress/.test(s)) return "W trakcie";
    if (/upcoming|future|scheduled|pre.?bid/.test(s)) return "W przygotowaniu";
    if (/closed|ended|finished|complete/.test(s)) return "Zakończona";
    return displayValue(status) || "Brak informacji";
  }

  function historyStatusClass(status) {
    const label = historyStatusLabel(status).toLowerCase();
    if (label.includes("sprzedano")) return "sold";
    if (label.includes("nie sprzedano")) return "not-sold";
    if (label.includes("trakcie")) return "live";
    if (label.includes("przygotowaniu")) return "upcoming";
    return "unknown";
  }

  function historyRecordKey(item) {
    return [
      String(item.platform || "").toLowerCase(),
      String(item.date || ""),
      String(item.lot || ""),
      String(item.price ?? ""),
      String(item.status || "").toLowerCase()
    ].join("|");
  }

  function historyRecordsForRender() {
    const all = [...auctionHistoryRecords];

    const map = new Map();
    for (const item of all) {
      const key = historyRecordKey(item);
      if (!map.has(key)) map.set(key,item);
    }

    return Array.from(map.values()).sort((a,b) => {
      const da = new Date(a.date || 0).getTime();
      const db = new Date(b.date || 0).getTime();
      return db - da;
    });
  }

  function renderAuctionHistory() {
    const box = document.getElementById("auctionHistory");
    if (!box) return;

    const list = historyRecordsForRender();

    if (!list.length) {
      box.innerHTML = '<div class="empty" style="padding:20px">Brak dostępnej historii aukcji dla tego VIN-u.</div>';
      return;
    }

    const platforms = [...new Set(list.map(item => String(item.platform || platformName()).toLowerCase()))];
    const showPlatform = platforms.length > 1;

    const rows = list.map(item => {
      const price = item.price === null || isEmpty(item.price) || Number.isNaN(Number(item.price))
        ? "—"
        : money(item.price);
      const status = historyStatusLabel(item.status);
      const platform = String(item.platform || platformName()).toUpperCase();
      const platformCls = platform.toLowerCase().includes("iaai") || platform === "IAA" ? "iaai" : "copart";

      return `
        <tr>
          ${showPlatform ? `<td><span class="history-platform ${platformCls}">${esc(platform)}</span></td>` : ""}
          <td>${esc(formatHistoryDate(item.date))}</td>
          <td>${esc(item.lot || "—")}</td>
          <td class="history-price">${esc(price)}</td>
          <td><span class="history-status ${historyStatusClass(item.status)}">${esc(status)}</span></td>
          <td>${esc(item.seller || "—")}</td>
        </tr>
      `;
    }).join("");

    box.innerHTML = `
      <div class="history-scroll">
        <table class="history-table ${showPlatform ? "with-platform" : "without-platform"}">
          <thead>
            <tr>
              ${showPlatform ? "<th>Aukcja</th>" : ""}
              <th>Data</th>
              <th>LOT</th>
              <th>Końcowa oferta</th>
              <th>Status</th>
              <th>Sprzedający</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="history-count">Dostępne rekordy historii: <strong>${list.length}</strong>. Daty i ceny pochodzą z historii aukcyjnej Apibara; snapshoty Rex.Bid nie są mieszane z historią sprzedaży.</div>
    `;
  }

  function formatHistoryDate(value) {
    if (isEmpty(value)) return "—";
    const raw = String(value).trim();
    // Apibara's last_sold_day is already a calendar date. Do not parse it
    // through UTC/local timezone conversion, otherwise the displayed day
    // can shift by one day.
    const dayOnly = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (dayOnly) return `${dayOnly[3]}.${dayOnly[2]}.${dayOnly[1]}`;

    const d = new Date(raw);
    if (Number.isNaN(d.getTime())) return raw;
    return d.toLocaleDateString("pl-PL", {year:"numeric",month:"2-digit",day:"2-digit"});
  }

  function getCurrentAuctionHistoryFinalBid() {
    const currentLot = String(getLot() || "").trim();
    const currentDate = getAuctionStart();
    const currentTime = currentDate ? new Date(currentDate).getTime() : NaN;

    const candidates = auctionHistoryRecords.filter(item => {
      const lotMatch = !currentLot || String(item.lot || "").trim() === currentLot;
      if (!lotMatch) return false;
      const t = item.date ? new Date(item.date).getTime() : NaN;
      if (!Number.isFinite(currentTime) || !Number.isFinite(t)) return true;
      return Math.abs(currentTime - t) <= 48 * 60 * 60 * 1000;
    });

    for (const item of candidates) {
      if (historyStatusLabel(item.status) === "Sprzedano" || historyStatusLabel(item.status) === "Sprzedano warunkowo") {
        if (!isEmpty(item.price)) return item.price;
      }
    }

    return null;
  }

  async function fetchAuctionHistory() {
    const box = document.getElementById("auctionHistory");
    if (!box) return;

    const identifier = getVin() || getLot();
    if (!identifier) return;

    try {
      let cursor = null;
      const collected = [];
      const seenCursors = new Set();
      const maxPages = 20;

      for (let pageNo = 0; pageNo < maxPages; pageNo++) {
        const query = new URLSearchParams({per_page:"20"});
        if (cursor) query.set("cursor",cursor);

        const response = await fetch(`${API_BASE}/car/${encodeURIComponent(identifier)}/history?${query.toString()}`, {
          headers: {"Accept":"application/json"},
          cache: "no-store"
        });

        if (!response.ok) throw new Error(`Historia HTTP ${response.status}`);
        const json = await response.json();
        const data = json?.data;
        const rawRecords = Array.isArray(data?.history)
          ? data.history
          : Array.isArray(data) ? data : [];

        rawRecords.forEach(record => {
          const normalized = normalizeHistoryRecord(record);
          if (normalized) collected.push(normalized);
        });

        const next = json?.meta?.next_cursor || data?.meta?.next_cursor || null;
        if (!next || seenCursors.has(next)) break;
        seenCursors.add(next);
        cursor = next;
      }

      auctionHistoryRecords = collected;
      renderAuctionHistory();
      updateAuctionUi();
      updateForecastFromCalculator();
    } catch (error) {
      console.warn("Rex.Bid auction history:", error);
      // Jeżeli historia źródłowa jest niedostępna, zostawiamy lokalne snapshoty.
      renderAuctionHistory();
    }
  }

  function startAuctionRefresh() {
    if (auctionRefreshTimer) clearInterval(auctionRefreshTimer);
    // Podczas oczekiwania i LIVE odświeżamy ofertę co 10 sekund,
    // dzięki czemu cena/status mogą zmieniać się bez przeładowania strony.
    auctionRefreshTimer = setInterval(() => {
      // Nie zatrzymujemy odświeżania tylko dlatego, że poprzedni snapshot
      // miał status "sold/closed". Jeśli aukcja ma przyszły start albo
      // właśnie trwa, nowe dane mogą zmienić cenę i status.
      const startRaw = getAuctionStart();
      const start = startRaw ? new Date(startRaw).getTime() : NaN;
      const now = Date.now();
      const shouldWatch =
        (Number.isFinite(start) && now <= start + 12 * 60 * 60 * 1000) ||
        auctionPhase() === "prebid" ||
        auctionPhase() === "live";

      if (shouldWatch) refreshAuctionData();
    }, 10000);
  }

  async function init() {
    if (!VIN && !LOT) {
      page.innerHTML = `<div class="error">Brak parametru VIN lub LOT w adresie strony.</div>`;
      return;
    }

    page.innerHTML = `
      <div class="panel empty">
        <div style="font-size:30px;margin-bottom:10px">⏳</div>
        Pobieranie danych samochodu...
      </div>
    `;

    try {
      car = await fetchVehicle();

      if (!car) throw new Error("Nie znaleziono samochodu.");

      photos = normalizeMedia(car);
      buildPage();
    } catch (error) {
      console.error("Rex.Bid car error:",error);
      page.innerHTML = `
        <div class="error">
          <strong style="display:block;color:#ff6d6d;font-size:18px;margin-bottom:8px">
            Nie udało się pobrać samochodu
          </strong>
          ${esc(error?.message || "Nieznany błąd")}
        </div>
      `;
    }
  }

  init();
</script>
