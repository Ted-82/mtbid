<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rex.Bid — Samochód</title>

<meta
    name="description"
    content="Szczegóły samochodu z aukcji Copart i IAAI."
>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f5f7;
    --white: #ffffff;
    --black: #111315;
    --text: #17191c;
    --muted: #727981;
    --border: #e0e3e7;
    --border-dark: #cfd3d8;
    --yellow: #ffb400;
    --yellow-hover: #ffc531;
    --green: #18833d;
    --green-bg: #e8f7ed;
    --orange: #9a6800;
    --orange-bg: #fff4d8;
    --red: #d93025;
    --red-bg: #fdebea;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

button,
input,
select {
    font: inherit;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================================
   HEADER
========================================================= */

.topbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(17, 19, 21, .96);
    backdrop-filter: blur(14px);

    color: white;

    border-bottom: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 2px 15px rgba(0,0,0,.14);
}

.nav {
    max-width: 1400px;
    min-height: 72px;

    margin: 0 auto;
    padding: 0 24px;

    display: flex;
    align-items: center;

    gap: 30px;
}

.logo {
    font-size: 28px;
    font-weight: 950;
    letter-spacing: -1.5px;
    white-space: nowrap;
}

.logo span {
    color: var(--yellow);
}

.menu {
    display: flex;
    align-items: center;
    gap: 24px;
    flex: 1;
}

.menu a {
    color: #d9dcdf;
    font-size: 14px;
    font-weight: 700;
    transition: .2s;
}

.menu a:hover {
    color: white;
}

.back {
    color: #d9dcdf;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
}

.back:hover {
    color: white;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {
    width: min(1300px, calc(100% - 32px));

    margin: 0 auto;

    padding:
        35px
        0
        80px;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.loading,
.error {
    background: var(--white);

    border: 1px solid var(--border);
    border-radius: 14px;

    padding: 60px 25px;

    text-align: center;

    box-shadow:
        0 2px 8px rgba(0,0,0,.03);
}

.loading strong,
.error strong {
    display: block;

    font-size: 21px;

    margin-bottom: 10px;
}

.error {
    color: var(--muted);
}

.loading-spinner {
    width: 38px;
    height: 38px;

    margin:
        0 auto
        18px;

    border:
        3px solid #e5e7e9;

    border-top-color:
        var(--yellow);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   CAR HEADER
========================================================= */

.car-header {
    background: var(--white);

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 24px;

    margin-bottom: 20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.03);
}

.header-top {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    gap: 25px;
}

.header-left {
    min-width: 0;
}

.badges {
    display: flex;
    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 12px;
}

.platform {
    display: inline-flex;
    align-items: center;

    background: var(--black);
    color: white;

    padding: 6px 10px;

    border-radius: 6px;

    font-size: 11px;
    font-weight: 900;
}

.status {
    display: inline-flex;
    align-items: center;

    padding: 6px 10px;

    border-radius: 6px;

    font-size: 11px;
    font-weight: 900;
}

.status.active {
    background: var(--green-bg);
    color: var(--green);
}

.status.upcoming {
    background: var(--orange-bg);
    color: var(--orange);
}

.status.ended {
    background: #eceef0;
    color: #666;
}

.status.unknown {
    background: #f0f1f3;
    color: #666;
}

.car-header h1 {
    margin: 0 0 9px;

    font-size: 32px;
    line-height: 1.15;

    letter-spacing: -.8px;
}

.subtitle {
    color: var(--muted);

    font-size: 14px;

    word-break: break-word;
}

.favorite {
    flex-shrink: 0;

    border:
        1px solid var(--border-dark);

    background: white;

    border-radius: 8px;

    padding: 11px 16px;

    cursor: pointer;

    font-weight: 800;

    transition: .2s;
}

.favorite:hover {
    border-color: #aaa;
}

.favorite.active {
    color: #e4002b;

    border-color:
        #f1b4bd;

    background:
        #fff6f7;
}


/* =========================================================
   MAIN GRID
========================================================= */

.main-grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1.45fr)
        minmax(320px, .75fr);

    gap: 20px;

    align-items: start;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery {
    background: var(--white);

    border:
        1px solid var(--border);

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.03);
}

.main-image-wrapper {
    position: relative;

    width: 100%;
    height: 560px;

    background:
        #eceef0;

    display: flex;
    align-items: center;
    justify-content: center;
}

.main-image {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    cursor: zoom-in;
}

.image-counter {
    position: absolute;

    right: 14px;
    bottom: 14px;

    background:
        rgba(0,0,0,.72);

    color: white;

    padding: 7px 10px;

    border-radius: 6px;

    font-size: 12px;
    font-weight: 800;
}

.no-image {
    color: #7b8289;

    font-size: 15px;
    font-weight: 700;
}

.thumbs {
    display: flex;

    gap: 8px;

    padding: 12px;

    overflow-x: auto;

    border-top:
        1px solid var(--border);
}

.thumbs::-webkit-scrollbar {
    height: 7px;
}

.thumbs::-webkit-scrollbar-thumb {
    background: #cfd3d8;
    border-radius: 10px;
}

.thumb {
    width: 92px;
    height: 68px;

    object-fit: cover;

    cursor: pointer;

    border:
        2px solid transparent;

    border-radius: 6px;

    flex-shrink: 0;

    background: #eceef0;

    transition: .15s;
}

.thumb:hover {
    border-color: #b9bec4;
}

.thumb.active {
    border-color:
        var(--yellow);
}


/* =========================================================
   INFO CARD
========================================================= */

.info-card {
    background: var(--white);

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 24px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.03);
}

.price-label {
    color: #777d83;

    font-size: 11px;
    font-weight: 900;

    margin-bottom: 5px;
}

.price {
    font-size: 38px;
    line-height: 1;

    font-weight: 950;

    letter-spacing: -1px;

    margin-bottom: 14px;
}

.auction-status {
    display: inline-flex;

    margin-bottom: 16px;

    padding: 7px 10px;

    border-radius: 6px;

    font-size: 11px;
    font-weight: 900;
}

.auction-status.active {
    background: var(--green-bg);
    color: var(--green);
}

.auction-status.upcoming {
    background: var(--orange-bg);
    color: var(--orange);
}

.auction-status.ended {
    background: #eceef0;
    color: #666;
}

.auction-status.unknown {
    background: #f0f1f3;
    color: #666;
}

.info-row {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    gap: 18px;

    padding: 12px 0;

    border-bottom:
        1px solid #eceef0;

    font-size: 14px;
}

.info-row:last-of-type {
    border-bottom: 0;
}

.info-label {
    color: #777d83;
}

.info-value {
    max-width: 62%;

    font-weight: 800;

    text-align: right;

    word-break: break-word;
}


/* =========================================================
   AUCTION BUTTON
========================================================= */

.auction-button {
    display: block;

    width: 100%;

    margin-top: 20px;

    background:
        var(--yellow);

    color:
        #111315;

    text-align: center;

    padding: 14px;

    border-radius: 8px;

    font-size: 13px;

    font-weight: 950;

    transition: .2s;
}

.auction-button:hover {
    background:
        var(--yellow-hover);

    transform:
        translateY(-1px);
}

.auction-button.disabled {
    background: #e8eaec;
    color: #858a90;

    cursor: default;
}

.auction-button.disabled:hover {
    transform: none;
}


/* =========================================================
   DETAILS
========================================================= */

.details {
    background: var(--white);

    border:
        1px solid var(--border);

    border-radius: 14px;

    margin-top: 20px;

    padding: 25px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.03);
}

.details h2 {
    margin: 0 0 20px;

    font-size: 22px;

    letter-spacing: -.3px;
}

.details-grid {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 1px;

    background:
        #e4e6e8;

    border:
        1px solid #e4e6e8;
}

.detail {
    background: white;

    padding: 16px;
}

.detail-label {
    color: #777d83;

    font-size: 11px;

    margin-bottom: 6px;
}

.detail-value {
    font-size: 14px;

    font-weight: 800;

    word-break: break-word;
}


/* =========================================================
   HISTORY
========================================================= */

.history {
    margin-top: 20px;
}

.history-empty {
    color: #777;

    padding:
        5px 0
        10px;
}

.history-table-wrapper {
    width: 100%;

    overflow-x: auto;
}

.history-table {
    width: 100%;

    border-collapse: collapse;

    font-size: 14px;
}

.history-table th,
.history-table td {
    padding: 13px;

    border-bottom:
        1px solid #eceef0;

    text-align: left;

    white-space: nowrap;
}

.history-table th {
    color: #777d83;

    font-size: 11px;

    text-transform: uppercase;
}

.history-table td {
    font-weight: 600;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    background:
        #111315;

    color:
        #bfc3c7;

    padding:
        35px 24px;
}

.footer-inner {
    max-width: 1300px;

    margin: 0 auto;
}

.footer-logo {
    color: white;

    font-size: 24px;

    font-weight: 900;
}

.footer-logo span {
    color: var(--yellow);
}

.copyright {
    margin-top: 15px;

    font-size: 12px;

    color: #858b91;
}


/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {
    position: fixed;

    inset: 0;

    z-index: 5000;

    background:
        rgba(0,0,0,.94);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    max-width: 95vw;
    max-height: 92vh;

    object-fit: contain;
}

.lightbox-close {
    position: absolute;

    top: 18px;
    right: 22px;

    width: 44px;
    height: 44px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.12);

    color: white;

    font-size: 25px;

    cursor: pointer;
}

.lightbox-close:hover {
    background:
        rgba(255,255,255,.22);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1050px) {

    .main-grid {
        grid-template-columns: 1fr;
    }

    .info-card {
        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 0 25px;
    }

    .info-card .price-label,
    .info-card .price,
    .info-card .auction-status,
    .info-card .auction-button {
        grid-column: 1 / -1;
    }

    .main-image-wrapper {
        height: 500px;
    }
}


@media (max-width: 850px) {

    .details-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .menu {
        gap: 14px;
    }

    .menu a:nth-child(3),
    .menu a:nth-child(4) {
        display: none;
    }
}


@media (max-width: 650px) {

    .nav {
        min-height: 62px;

        padding:
            0 15px;

        gap: 15px;
    }

    .logo {
        font-size: 24px;
    }

    .menu {
        display: none;
    }

    .back {
        margin-left: auto;
    }

    .container {
        width:
            min(
                100% - 20px,
                1300px
            );

        padding:
            20px
            0
            55px;
    }

    .car-header {
        padding: 18px;
    }

    .header-top {
        flex-direction: column;
    }

    .favorite {
        width: 100%;
    }

    .car-header h1 {
        font-size: 25px;
    }

    .main-image-wrapper {
        height: 300px;
    }

    .info-card {
        display: block;
    }

    .details {
        padding: 18px;
    }

    .details-grid {
        grid-template-columns: 1fr;
    }

    .price {
        font-size: 31px;
    }
}


@media (max-width: 430px) {

    .main-image-wrapper {
        height: 250px;
    }

    .thumb {
        width: 78px;
        height: 58px;
    }

    .info-row {
        font-size: 13px;
    }

    .info-value {
        max-width: 58%;
    }
}

</style>
</head>

<script>


/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function safe(
    value,
    fallback = "—"
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    return value;
}


function displayValue(
    value,
    fallback = "—"
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }


    if (
        typeof value === "string" ||
        typeof value === "number" ||
        typeof value === "boolean"
    ) {

        return String(value);
    }


    if (Array.isArray(value)) {

        const result =
            value
                .map(item =>
                    displayValue(
                        item,
                        ""
                    )
                )
                .filter(Boolean)
                .join(", ");

        return result || fallback;
    }


    if (
        typeof value === "object"
    ) {

        const preferred = [

            "name",
            "value",
            "display",
            "label",
            "description",
            "text",
            "type",
            "title"

        ];


        for (
            const key of preferred
        ) {

            if (
                value[key] !== undefined &&
                value[key] !== null &&
                value[key] !== ""
            ) {

                return displayValue(
                    value[key],
                    fallback
                );
            }
        }


        const values =
            Object.values(value)
                .map(item =>
                    displayValue(
                        item,
                        ""
                    )
                )
                .filter(Boolean);


        if (values.length) {

            return values.join(", ");
        }
    }


    return fallback;
}


/* =========================================================
   MONEY
========================================================= */

function money(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }


    if (
        typeof value === "object"
    ) {

        value =
            value.amount ??
            value.value ??
            value.usd ??
            value.price ??
            null;
    }


    const number =
        Number(value);


    if (
        !Number.isFinite(number)
    ) {

        return displayValue(value);
    }


    return "$" +
        number.toLocaleString(
            "en-US"
        );
}


/* =========================================================
   PRICE
========================================================= */

function getPrice(car) {

    const candidates = [

        car.pricing?.current_bid_usd,

        car.pricing?.current_bid,

        car.pricing?.currentBid,

        car.current_bid_usd,

        car.current_bid,

        car.currentBid,

        car.price,

        car.sale_price,

        car.sale?.price,

        car.bid

    ];


    for (
        const value of candidates
    ) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            return value;
        }
    }


    return null;
}


/* =========================================================
   MILEAGE
========================================================= */

function getMileage(car) {

    const candidates = [

        car.odometer?.mi,

        car.odometer?.miles,

        car.odometer?.value,

        car.odometer,

        car.mileage,

        car.miles

    ];


    for (
        const value of candidates
    ) {

        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {
            continue;
        }


        if (
            typeof value === "object"
        ) {

            const number =
                value.mi ??
                value.miles ??
                value.value;


            if (
                number !== undefined
            ) {

                return Number(number)
                    .toLocaleString(
                        "en-US"
                    ) +
                    " mi";
            }
        }


        if (
            !Number.isNaN(
                Number(value)
            )
        ) {

            return Number(value)
                .toLocaleString(
                    "en-US"
                ) +
                " mi";
        }


        return displayValue(value);
    }


    return "—";
}


/* =========================================================
   DAMAGE
========================================================= */

function getDamage(car) {

    return displayValue(

        car.condition?.primary_damage ??

        car.condition?.primaryDamage ??

        car.primary_damage ??

        car.damage ??

        car.damage_type ??

        car.damageType

    );
}


/* =========================================================
   SECONDARY DAMAGE / CONDITION
========================================================= */

function getSecondaryDamage(car) {

    return displayValue(

        car.condition?.secondary_damage ??

        car.condition?.secondaryDamage ??

        car.secondary_damage ??

        car.secondaryDamage ??

        car.run_cond

    );
}


/* =========================================================
   LOCATION
========================================================= */

function getLocation(car) {

    return displayValue(

        car.location?.display ??

        car.location?.name ??

        car.location?.city ??

        car.location ??

        car.city

    );
}


/* =========================================================
   FUEL
========================================================= */

function getFuel(car) {

    return displayValue(

        car.fuel_type ??

        car.fuelType ??

        car.engine?.fuel_type ??

        car.engine?.fuel ??

        car.fuel

    );
}


/* =========================================================
   TRANSMISSION
========================================================= */

function getTransmission(car) {

    return displayValue(

        car.transmission ??

        car.transmission_type ??

        car.transmissionType ??

        car.specs?.transmission

    );
}


/* =========================================================
   DRIVE
========================================================= */

function getDrive(car) {

    return displayValue(

        car.drive_type ??

        car.driveType ??

        car.specs?.drive_type ??

        car.drive

    );
}


/* =========================================================
   ENGINE
========================================================= */

function getEngine(car) {

    return displayValue(

        car.engine?.description ??

        car.engine?.name ??

        car.engine?.type ??

        car.engine?.size ??

        car.engine

    );
}


/* =========================================================
   BODY
========================================================= */

function getBodyType(car) {

    return displayValue(

        car.body_type ??

        car.bodyType ??

        car.body?.type ??

        car.body?.style ??

        car.body_style

    );
}


/* =========================================================
   COLOR
========================================================= */

function getColor(car) {

        car.colors?.exterior ??

        car.colors?.primary

}


/* =========================================================
   LOT
========================================================= */

function getLot(car) {

        car.stock_number ??

        car.stockNumber

    );
}


/* =========================================================
   AUCTION DATE
========================================================= */

function getAuctionDate(car) {

    return (

        car.auction_date ??

        car.auction?.date ??

        car.auction?.start_time ??

        car.auction?.startTime ??

        car.auction?.scheduled_at ??

        car.auction?.scheduledAt ??

        car.sale_date ??

        car.sale?.date ??

        null

    );
}


/* =========================================================
   DATE
========================================================= */

function formatDate(value) {

    if (!value) {
        return "—";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return displayValue(value);
    }


    return date.toLocaleString(
        "pl-PL",
        {
            year: "numeric",
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   STATUS
========================================================= */

function getStatus(car) {

    const raw =
        String(

            car.lot_status ??

            car.lotStatus ??

            car.status ??

            car.auction_status ??

            car.auctionStatus ??

            car.sale_status ??

            car.saleStatus ??

            car.auction?.state ??

            ""

        ).toLowerCase();


    if (
        raw.includes("sold") ||
        raw.includes("ended") ||
        raw.includes("closed") ||
        raw.includes("completed") ||
        raw.includes("sold")
    ) {

        return {

            key: "ended",

            label:
                "AUKCJA ZAKOŃCZONA"

        };
    }


    if (
        raw.includes("upcoming") ||
        raw.includes("future") ||
        raw.includes("scheduled") ||
        raw.includes("pending")
    ) {

        return {

            key: "upcoming",

            label:
                "NADCHODZĄCA AUKCJA"

        };
    }


    const dateValue =
        getAuctionDate(car);


    if (dateValue) {

        const date =
            new Date(dateValue);


        if (
            !Number.isNaN(
                date.getTime()
            )
        ) {

            if (
                date.getTime() >
                Date.now()
            ) {

                return {

                    key: "upcoming",

                    label:
                        "NADCHODZĄCA AUKCJA"

                };
            }
        }
    }


    return {

        key: "active",

        label:
            "AKTYWNA AUKCJA"

    };
}


/* =========================================================
   TITLE
========================================================= */

function carTitle(car) {

    if (car.title) {
        return String(car.title);
    }


    return [

        car.year,

        car.make,

        car.model

    ]
        .filter(
            value =>
                value !== null &&
                value !== undefined &&
                value !== ""
        )
        .join(" ");
}


/* =========================================================
   VIN
========================================================= */

function getVin(car) {

    return (

        car.vin ??

        car.VIN ??

        car.slug_vin ??

        car.slugVin ??

        ""

    );
}


/* =========================================================
   PLATFORM
========================================================= */

function getPlatform(car) {

    return displayValue(

        car.platform ??

        car.auction?.platform ??

        car.source

    ).toUpperCase();
}


/* =========================================================
   IMAGES
========================================================= */

function getImages(car) {

    let images = [];


    if (
        Array.isArray(car.images)
    ) {

        images.push(
            ...car.images
        );
    }


    if (
        car.media &&
        Array.isArray(
            car.media.images
        )
    ) {

        images.push(
            ...car.media.images
        );
    }


    if (
        car.media &&
        Array.isArray(
            car.media.thumbs
        )
    ) {

        images.push(
            ...car.media.thumbs
        );
    }


    if (
        Array.isArray(car.photos)
    ) {

        images.push(
            ...car.photos
        );
    }


    if (car.image) {

        images.push(
            car.image
        );
    }


    images =
        images
            .map(image => {

                if (
                    typeof image === "string"
                ) {

                    return image;
                }


                if (
                    typeof image === "object" &&
                    image !== null
                ) {

                    return (

                        image.url ??

                        image.src ??

                        image.image_url ??

                        image.imageUrl ??

                        image.large ??

                        image.medium ??

                        image.thumbnail ??

                        image.thumb ??

                        null

                    );
                }


                return null;

            })
            .filter(Boolean);


    return [
        ...new Set(images)
    ];
}


/* =========================================================
   FAVORITES
========================================================= */

function getFavorites() {

    try {

        return JSON.parse(

            localStorage.getItem(
                "rex_bid_favorites"
            ) || "[]"

        );

    } catch {

        return [];
    }
}


function saveFavorites(items) {

    localStorage.setItem(

        "rex_bid_favorites",

        JSON.stringify(items)

    );
}


function toggleFavorite(vin) {

    if (!vin) {
        return;
    }


    let favorites =
        getFavorites();


    if (
        favorites.includes(vin)
    ) {

        favorites =
            favorites.filter(
                item =>
                    item !== vin
            );

    } else {

        favorites.push(vin);
    }


    saveFavorites(favorites);

    renderFavoriteButton(vin);
}


function renderFavoriteButton(vin) {

    const button =
        document.getElementById(
            "favoriteButton"
        );


    if (!button) {
        return;
    }


    const active =
        getFavorites()
            .includes(vin);


    button.classList.toggle(
        "active",
        active
    );


    button.textContent =
        active
            ? "♥ Usuń z ulubionych"
            : "♡ Dodaj do ulubionych";
}

/* =========================================================
   CHANGE IMAGE
========================================================= */

function changeImage(
    image,
    element,
    index
) {

    const main =
        document.getElementById(
            "mainImage"
        );


    if (main) {

        main.src = image;
    }


    document
        .querySelectorAll(".thumb")
        .forEach(
            thumb =>
                thumb.classList.remove(
                    "active"
                )
        );


    if (element) {

        element.classList.add(
            "active"
        );
    }


    const counter =
        document.getElementById(
            "imageCounter"
        );


    if (counter) {

        const total =
            document.querySelectorAll(
                ".thumb"
            ).length;


        counter.textContent =
            `${index + 1} / ${total}`;
    }
}


/* =========================================================
   LIGHTBOX
========================================================= */

function openLightbox(image) {

    if (!image) {
        return;
    }


    const lightbox =
        document.getElementById(
            "lightbox"
        );


    const imageElement =
        document.getElementById(
            "lightboxImage"
        );


    imageElement.src =
        image;


    lightbox.classList.add(
        "open"
    );


    document.body.style.overflow =
        "hidden";
}


function closeLightbox() {

    const lightbox =
        document.getElementById(
            "lightbox"
        );


    lightbox.classList.remove(
        "open"
    );


    document.body.style.overflow =
        "";
}


document
    .getElementById("lightbox")
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "lightbox"
            ) {

                closeLightbox();
            }

        }
    );


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeLightbox();
        }

    }
);

/* =========================================================
   LOAD CAR
========================================================= */

async function loadCar() {

    const app =
        document.getElementById(
            "app"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const vin =
        params.get("vin");


    if (!vin) {

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie znaleziono samochodu
                </strong>

                Brak numeru VIN w adresie.

            </div>

        `;

        return;
    }


    try {

        /*
         * Korzystamy z działającego endpointu:
         *
         * /api/cars?s=VIN
         */

        const response =
            await fetch(

                "/api/cars?s=" +
                encodeURIComponent(vin),

                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Błąd HTTP " +
                response.status
            );
        }


        const result =
            await response.json();


        if (
            !result.ok
        ) {

            throw new Error(
                result.error ||
                "Błąd API"
            );
        }


        const cars =
            Array.isArray(
                result.data
            )
            ? result.data
            : [];


        /*
         * Najpierw próbujemy znaleźć
         * dokładnie ten VIN.
         *
         * Jeżeli API zwróci tylko
         * jeden rekord, używamy go.
         */

        const wantedVin =
            String(vin)
                .trim()
                .toUpperCase();


        const car =
            cars.find(
                item => {

                    const itemVin =
                        String(
                            item.vin ??
                            item.VIN ??
                            item.slug_vin ??
                            ""
                        )
                            .trim()
                            .toUpperCase();


                    return (
                        itemVin ===
                        wantedVin
                    );
                }
            ) ||
            cars[0];


        if (!car) {

            app.innerHTML = `

                <div class="error">

                    <strong>
                        Nie znaleziono samochodu
                    </strong>

                    Oferta nie jest dostępna
                    w bazie Rex.Bid.

                </div>

            `;

            return;
        }


        renderCar(car);


    } catch (error) {

        console.error(
            "Rex.Bid car error:",
            error
        );


        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie udało się pobrać samochodu
                </strong>
