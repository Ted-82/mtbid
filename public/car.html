<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Rex.Bid — Oferta samochodu</title>

  <meta
    name="description"
    content="Szczegóły samochodu z aukcji Copart i IAAI."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0d10;
      --panel: #12161b;
      --panel2: #181d23;
      --panel3: #20262e;
      --border: #282e36;
      --text: #f4f6f8;
      --muted: #9aa3ad;
      --accent: #ffb000;
      --accent2: #ffcc55;
      --green: #35d07f;
      --red: #ff5d5d;
      --blue: #55aaff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(255, 176, 0, 0.08),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }

    .container {
      width: min(
        1440px,
        calc(100% - 32px)
      );
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(
        11,
        13,
        16,
        0.94
      );
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav a:hover {
      color: white;
    }

    /* =========================
       PAGE
    ========================= */

    main {
      padding: 36px 0 80px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .back:hover {
      color: white;
    }

    /* =========================
       TOP
    ========================= */

    .top-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1.45fr)
        minmax(360px, 0.75fr);
      gap: 22px;
      align-items: start;
    }

    /* =========================
       GALLERY
    ========================= */

    .gallery {
      min-width: 0;
    }

    .main-image {
      position: relative;
      height: 560px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #080a0c;
    }

    .main-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #080a0c;
    }

    .image-counter {
      position: absolute;
      left: 16px;
      bottom: 16px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .image-platform {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    .thumbs {
      display: grid;
      grid-template-columns:
        repeat(8, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .thumb {
      height: 82px;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 9px;
      background: var(--panel);
      cursor: pointer;
    }

    .thumb:hover {
      border-color: #666;
    }

    .thumb.active {
      border-color: var(--accent);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(
        255,
        176,
        0,
        0.12
      );
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(
        53,
        208,
        127,
        0.12
      );
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .summary h1 {
      margin: 0;
      font-size: clamp(
        28px,
        3vw,
        42px
      );
      line-height: 1.08;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    /* =========================
       VIN
    ========================= */

    .vin-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel2);
    }

    .vin-text {
      min-width: 0;
      flex: 1;
    }

    .vin-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .vin-value {
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .copy-btn {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel3);
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* =========================
       AUCTION
    ========================= */

    .auction-box {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel2);
    }

    .auction-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .auction-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .auction-date {
      font-size: 17px;
      font-weight: 900;
    }

    .lot {
      text-align: right;
    }

    .lot strong {
      font-size: 17px;
    }

    .countdown {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .countdown-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 9px;
    }

    .countdown-value {
      color: var(--accent);
      font-size: 22px;
      font-weight: 900;
    }

    /* =========================
       PRICE
    ========================= */

    .price-box {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          rgba(255, 176, 0, 0.1),
          rgba(255, 176, 0, 0.02)
        ),
        var(--panel2);
    }

    .price-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .price {
      font-size: 32px;
      font-weight: 950;
      letter-spacing: -1px;
    }

    .price-note {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .action-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-primary {
      border: 0;
      background: var(--accent);
      color: #111;
    }

    .action-primary:hover {
      background: var(--accent2);
      transform: translateY(-1px);
    }

    .action-secondary {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: white;
    }

    .action-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* =========================
       DETAILS
    ========================= */

    .details-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        360px;
      gap: 22px;
      margin-top: 22px;
    }

    .section {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .section + .section {
      margin-top: 22px;
    }

    .section h2 {
      margin: 0 0 20px;
      font-size: 21px;
      letter-spacing: -0.4px;
    }

    .spec-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
    }

    .spec {
      min-width: 0;
      padding: 15px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .spec-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .spec-value {
      display: block;
      overflow-wrap: anywhere;
      font-size: 14px;
      font-weight: 800;
    }

    /* =========================
       DAMAGE
    ========================= */

    .damage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .damage-card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel2);
    }

    .damage-card .label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 7px;
    }

    .damage-card .value {
      font-size: 15px;
      font-weight: 900;
    }

    .damage-primary {
      border-color: rgba(
        255,
        93,
        93,
        0.4
      );
    }

    .damage-primary .value {
      color: var(--red);
    }

    /* =========================
       SIDEBAR
    ========================= */

    .side-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .side-card + .side-card {
      margin-top: 22px;
    }

    .side-card h3 {
      margin: 0 0 17px;
      font-size: 17px;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .info-label {
      color: var(--muted);
      font-size: 12px;
    }

    .info-value {
      max-width: 60%;
      text-align: right;
      overflow-wrap: anywhere;
      font-size: 13px;
      font-weight: 800;
    }

    /* =========================
       LOCATION
    ========================= */

    .location-box {
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel2);
    }

    .location-name {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .location-address {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       ERROR / LOADING
    ========================= */

    .message {
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .message strong {
      display: block;
      margin-bottom: 10px;
      color: var(--red);
      font-size: 20px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin-bottom: 16px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 200;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #171b20;
      color: white;
      font-size: 13px;
      font-weight: 700;
      box-shadow:
        0 15px 50px
        rgba(0, 0, 0, 0.4);
      transform: translateY(30px);
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 35px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {
      .top-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        order: -1;
      }

      .details-layout {
        grid-template-columns: 1fr;
      }

      .main-image {
        height: 500px;
      }
    }

    @media (max-width: 800px) {
      .container {
        width: min(
          100% - 20px,
          1440px
        );
      }

      .nav {
        display: none;
      }

      main {
        padding-top: 22px;
      }

      .main-image {
        height: 390px;
      }

      .thumbs {
        grid-template-columns:
          repeat(5, minmax(0, 1fr));
      }

      .thumb {
        height: 65px;
      }

      .spec-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .damage-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .summary {
        padding: 18px;
      }

      .summary h1 {
        font-size: 29px;
      }

      .main-image {
        height: 300px;
        border-radius: 13px;
      }

      .thumbs {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
      }

      .thumb {
        height: 60px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .spec-grid {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 18px;
      }

      .auction-top {
        flex-direction: column;
      }

      .lot {
        text-align: left;
      }

      .price {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">

    <a
      href="/"
      class="logo"
    >
      Rex<span>.Bid</span>
    </a>

    <nav class="nav">
      <a href="/">
        Samochody
      </a>

      <a href="/#search">
        Wyszukiwarka
      </a>

      <a href="/#results">
        Aukcje
      </a>
    </nav>

  </div>
</header>


<main>
  <div class="container">

    <a
      href="/"
      class="back"
    >
      ← Wróć do samochodów
    </a>


    <div id="page">
      <div class="message">

        <div class="spinner"></div>

        <div>
          Pobieranie danych samochodu...
        </div>

      </div>
    </div>

  </div>
</main>


<footer>
  <div class="container">
    Rex.Bid — Vehicle Auction Marketplace
  </div>
</footer>


<div
  id="toast"
  class="toast"
></div>


<script>
  const API_BASE = "/api";

  const page =
    document.getElementById("page");

  const toast =
    document.getElementById("toast");


  /* =========================
     BASIC HELPERS
  ========================= */

  function escapeHtml(value) {
    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function firstValue(...values) {
    for (const value of values) {
      if (
        value !== null &&
        value !== undefined &&
        value !== ""
      ) {
        return value;
      }
    }

    return "";
  }


  function formatMoney(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "—";
    }

    const number =
      Number(
        String(value)
          .replaceAll("$", "")
          .replaceAll(",", "")
      );

    if (Number.isNaN(number)) {
      return escapeHtml(value);
    }

    return (
      "$" +
      number.toLocaleString("en-US")
    );
  }


  function formatNumber(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "—";
    }

    const number =
      Number(
        String(value)
          .replaceAll(",", "")
          .replaceAll("mi", "")
          .trim()
      );

    if (Number.isNaN(number)) {
      return escapeHtml(value);
    }

    return number.toLocaleString("en-US");
  }


  function getVin(car) {
    return firstValue(
      car.vin,
      car.VIN,
      car.slug_vin
    );
  }


  function getTitle(car) {
    return firstValue(
      car.title,
      car.name,
      car.vehicle,
      (
        [
          car.year,
          car.make,
          car.model
        ]
          .filter(Boolean)
          .join(" ")
      ),
      "Samochód"
    );
  }


  function getLot(car) {
    return firstValue(
      car.lot_number,
      car.lot,
      car.stock_number,
      car.stockNumber,
      car.StockNumber
    );
  }


  function getPlatform(car) {
    return String(
      firstValue(
        car.platform,
        car.Platform
      ) || "—"
    ).toUpperCase();
  }


  function getYear(car) {
    return firstValue(
      car.year,
      car.Year
    );
  }


  function getMake(car) {
    return firstValue(
      car.make,
      car.Make
    );
  }


  function getModel(car) {
    return firstValue(
      car.model,
      car.Model
    );
  }


  function getSeries(car) {
    return firstValue(
      car.series,
      car.Series
    );
  }


  /* =========================
     IMAGE HANDLING
  ========================= */

  function getImages(car) {
    const images = [];


    function addImage(url) {
      if (
        typeof url !== "string" ||
        !url.trim()
      ) {
        return;
      }

      const clean =
        url.trim();

      if (
        !images.includes(clean)
      ) {
        images.push(clean);
      }
    }


    if (
      typeof car.image === "string"
    ) {
      addImage(car.image);
    }


    if (
      typeof car.image_url === "string"
    ) {
      addImage(car.image_url);
    }


    if (
      typeof car.imageUrl === "string"
    ) {
      addImage(car.imageUrl);
    }


    if (
      car.media &&
      Array.isArray(car.media.thumbs)
    ) {
      car.media.thumbs.forEach(
        item => {
          if (
            typeof item === "string"
          ) {
            addImage(item);
          }
        }
      );
    }


    if (
      car.media &&
      Array.isArray(car.media.items)
    ) {
      car.media.items.forEach(
        item => {
          if (!item) {
            return;
          }

          if (
            item.type &&
            item.type !== "image"
          ) {
            return;
          }

          addImage(
            item.large
          );

          if (
            images.length === 0
          ) {
            addImage(
              item.url
            );
          }
        }
      );
    }


    if (
      Array.isArray(car.media)
    ) {
      car.media.forEach(
        item => {

          if (
            typeof item === "string"
          ) {
            addImage(item);
            return;
          }

          if (!item) {
            return;
          }

          if (
            item.type &&
            item.type !== "image"
          ) {
            return;
          }

          addImage(
            item.large
          );

          addImage(
            item.url
          );

          addImage(
            item.thumb
          );
        }
      );
    }


    if (
      car.images &&
      Array.isArray(car.images)
    ) {
      car.images.forEach(
        item => {

          if (
            typeof item === "string"
          ) {
            addImage(item);
            return;
          }

          if (!item) {
            return;
          }

          addImage(
            item.large
          );

          addImage(
            item.url
          );

          addImage(
            item.thumb
          );
        }
      );
    }


    if (
      car.photos &&
      Array.isArray(car.photos)
    ) {
      car.photos.forEach(
        item => {

          if (
            typeof item === "string"
          ) {
            addImage(item);
            return;
          }

          if (!item) {
            return;
          }

          addImage(
            item.large
          );

          addImage(
            item.url
          );

          addImage(
            item.thumb
          );
        }
      );
    }


    return images;
  }


  /* =========================
     NESTED DATA
  ========================= */

  function getCondition(car) {
    return (
      car.condition || {}
    );
  }


  function getAuction(car) {
    return (
      car.auction || {}
    );
  }


  function getLocation(car) {
    const location =
      car.location;


    if (
      location &&
      typeof location === "object"
    ) {
      return {
        display:
          firstValue(
            location.display,
            location.name
          ),

        name:
          firstValue(
            location.name,
            location.display
          ),

        address:
          location.address || "",

        city:
          location.city || "",

        state:
          location.state || "",

        zip:
          location.zip || "",

        lat:
          location.lat,

        lng:
          location.lng
      };
    }


    return {
      display:
        location || "",

      name:
        location || "",

      address: "",
      city: "",
      state: "",
      zip: "",
      lat: null,
      lng: null
    };
  }


  function getMileage(car) {
    if (
      car.odometer &&
      typeof car.odometer === "object"
    ) {
      return firstValue(
        car.odometer.mi,
        car.odometer.value
      );
    }

    return firstValue(
      car.mileage,
      car.odometer
    );
  }


  function getDamage(car) {
    const condition =
      getCondition(car);


    return {
      primary:
        firstValue(
          condition.primary_damage,
          car.primary_damage,
          car.damage
        ),

      secondary:
        firstValue(
          condition.secondary_damage,
          car.secondary_damage
        )
    };
  }


  function getPrice(car) {
    const pricing =
      car.pricing || {};

    const auction =
      getAuction(car);


    return firstValue(
      pricing.current_bid_usd,
      pricing.current_bid,
      car.current_bid,
      car.currentBid,
      car.price,
      auction.current_bid,
      auction.high_bid
    );
  }


  function getStatus(car) {
    const auction =
      getAuction(car);


    return firstValue(
      auction.state,
      auction.status,
      car.status
    );
  }


  function getAuctionDate(car) {
    const auction =
      getAuction(car);


    return firstValue(
      auction.full_date,
      auction.auction_at,
      auction.ad,
      car.ad
    );
  }


  function getEngine(car) {
    return firstValue(
      car.engine,
      car.engine_size,
      car.engineSize
    );
  }


  function getTransmission(car) {
    return firstValue(
      car.transmission,
      car.transmission_type
    );
  }


  function getDrive(car) {
    return firstValue(
      car.drive,
      car.driveline,
      car.drive_line,
      car.driveLine
    );
  }


  function getFuel(car) {
    return firstValue(
      car.fuel,
      car.fuel_type,
      car.fuelType
    );
  }


  function getColor(car) {
    return firstValue(
      car.color,
      car.exterior_color,
      car.exteriorColor
    );
  }


  function getBody(car) {
    return firstValue(
      car.body_style,
      car.bodyStyle,
      car.type
    );
  }


  function getTitleInfo(car) {
    return firstValue(
      car.title_type,
      car.title,
      car.title_document
    );
  }


  /* =========================
     DATE
  ========================= */

  function formatAuctionDate(value) {
    if (!value) {
      return "—";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return String(value);
    }

    return date.toLocaleString(
      "pl-PL",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );
  }


  function getTimestamp(value) {
    if (!value) {
      return null;
    }

    const timestamp =
      new Date(value).getTime();

    if (
      Number.isNaN(timestamp)
    ) {
      return null;
    }

    return timestamp;
  }


  /* =========================
     TOAST
  ========================= */

  let toastTimer = null;


  function showToast(message) {
    toast.textContent =
      message;

    toast.classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {
          toast.classList.remove(
            "show"
          );
        },
        1800
      );
  }


  /* =========================
     COPY
  ========================= */

  async function copyText(text) {
    if (!text) {
      return;
    }

    try {
      await navigator.clipboard.writeText(
        text
      );

      showToast(
        "Skopiowano"
      );

    } catch (error) {

      const input =
        document.createElement(
          "textarea"
        );

      input.value =
        text;

      document.body.appendChild(
        input
      );

      input.select();

      document.execCommand(
        "copy"
      );

      input.remove();

      showToast(
        "Skopiowano"
      );
    }
  }


  /* =========================
     MAIN GALLERY
  ========================= */

  let galleryImages = [];

  let activeImage = 0;


  function setMainImage(index) {
    if (
      !galleryImages.length
    ) {
      return;
    }

    activeImage =
      index;

    const main =
      document.getElementById(
        "mainCarImage"
      );

    const counter =
      document.getElementById(
        "imageCounter"
      );

    if (main) {
      main.src =
        galleryImages[
          activeImage
        ];
    }

    if (counter) {
      counter.textContent =
        `${activeImage + 1} / ${galleryImages.length}`;
    }


    document
      .querySelectorAll(
        ".thumb"
      )
      .forEach(
        (element, index) => {

          element.classList.toggle(
            "active",
            index === activeImage
          );

        }
      );
  }


  function buildGallery(car) {
    galleryImages =
      getImages(car);


    if (
      !galleryImages.length
    ) {

      return `
        <div class="main-image">
          <div
            style="
              width:100%;
              height:100%;
              display:flex;
              align-items:center;
              justify-content:center;
              color:#68717b;
            "
          >
            Brak zdjęcia
          </div>
        </div>
      `;
    }


    const thumbs =
      galleryImages
        .slice(0, 24)
        .map(
          (image, index) => `
            <button
              class="thumb ${index === 0 ? "active" : ""}"
              type="button"
              data-image-index="${index}"
            >
              <img
                src="${escapeHtml(image)}"
                alt="Zdjęcie ${index + 1}"
                loading="lazy"
                onerror="this.style.opacity='0.2'"
              />
            </button>
          `
        )
        .join("");


    return `
      <div class="main-image">

        <img
          id="mainCarImage"
          src="${escapeHtml(galleryImages[0])}"
          alt="${escapeHtml(getTitle(car))}"
        />

        <div class="image-platform">
          ${escapeHtml(getPlatform(car))}
        </div>

        <div
          id="imageCounter"
          class="image-counter"
        >
          1 / ${galleryImages.length}
        </div>

      </div>

      ${
        thumbs
          ? `
            <div class="thumbs">
              ${thumbs}
            </div>
          `
          : ""
      }
    `;
  }

  /* =========================
     COUNTDOWN
  ========================= */

  let countdownTimer = null;


  function startCountdown(
    timestamp
  ) {

    if (!timestamp) {
      return;
    }


    const element =
      document.getElementById(
        "countdown"
      );


    if (!element) {
      return;
    }


    clearInterval(
      countdownTimer
    );


    function update() {

      const diff =
        timestamp -
        Date.now();


      if (diff <= 0) {

        element.textContent =
          "Aukcja rozpoczęta";

        clearInterval(
          countdownTimer
        );

        return;
      }


      const totalSeconds =
        Math.floor(
          diff / 1000
        );


      const days =
        Math.floor(
          totalSeconds /
          86400
        );


      const hours =
        Math.floor(
          (
            totalSeconds %
            86400
          ) / 3600
        );


      const minutes =
        Math.floor(
          (
            totalSeconds %
            3600
          ) / 60
        );


      const seconds =
        totalSeconds %
        60;


      element.textContent =
        days > 0
          ? `${days}d ${hours}h ${minutes}m ${seconds}s`
          : `${hours}h ${minutes}m ${seconds}s`;
    }


    update();

    countdownTimer =
      setInterval(
        update,
        1000
      );
  }


  /* =========================
     LOAD CAR
  ========================= */

  async function loadCar() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const vin =
      (
        params.get("vin") ||
        ""
      ).trim();


    const lot =
      (
        params.get("lot") ||
        ""
      ).trim();


    const search =
      vin ||
      lot;


    if (!search) {

      page.innerHTML = `
        <div class="message">

          <strong>
            Brak samochodu
          </strong>

          <div>
            Podaj VIN lub numer LOT.
          </div>

        </div>
      `;

      return;
    }


    try {

      const apiParams =
        new URLSearchParams();


      apiParams.set(
        "s",
        search
      );


      apiParams.set(
        "per_page",
        "20"
      );


      const response =
        await fetch(
          `${API_BASE}/cars?${apiParams.toString()}`,
          {
            method: "GET",
            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      const result =
        await response.json();


      if (!response.ok) {
        throw new Error(
          result.error ||
          `HTTP ${response.status}`
        );
      }


      if (!result.ok) {
        throw new Error(
          result.error ||
          "API zwróciło błąd"
        );
      }


      const cars =
        Array.isArray(
          result.data
        )
          ? result.data
          : [];


      if (!cars.length) {
        throw new Error(
          "Nie znaleziono samochodu dla podanego VIN / numeru LOT."
        );
      }


      let car =
        cars[0];


      if (vin) {

        const exact =
          cars.find(
            item =>
              String(
                getVin(item)
              ).toUpperCase() ===
              vin.toUpperCase()
          );


        if (exact) {
          car = exact;
        }

      }


      if (
        lot &&
        !vin
      ) {

        const exact =
          cars.find(
            item =>
              String(
                getLot(item)
              ).toLowerCase() ===
              lot.toLowerCase()
          );


        if (exact) {
          car = exact;
        }

      }


      renderCar(car);


    } catch (error) {

      console.error(
        "Rex.Bid car error:",
        error
      );


      page.innerHTML = `
        <div class="message">

          <strong>
            Nie udało się pobrać samochodu
          </strong>

          <div>
            ${escapeHtml(
              error.message ||
              "Nieznany błąd"
            )}
          </div>

          <a
            href="/"
            class="action-btn action-primary"
            style="
              margin-top:20px;
              padding:0 22px;
            "
          >
            Wróć do wyszukiwarki
          </a>

        </div>
      `;
    }
  }


  /* =========================
     START

  loadCar();
