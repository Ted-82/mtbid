<script>

function safe(value, fallback = "—") {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    return String(value);
}


function displayValue(value, fallback = "—") {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    if (
        typeof value === "string" ||
        typeof value === "number" ||
        typeof value === "boolean"
    ) {
        return String(value);
    }

    if (Array.isArray(value)) {

        return value
            .map(item => displayValue(item, ""))
            .filter(Boolean)
            .join(", ") || fallback;
    }

    if (typeof value === "object") {

        const preferred = [
            "name",
            "value",
            "display",
            "label",
            "description",
            "text",
            "type",
            "title"
        ];

        for (const key of preferred) {

            if (
                value[key] !== undefined &&
                value[key] !== null &&
                value[key] !== ""
            ) {

                return displayValue(
                    value[key],
                    fallback
                );
            }
        }

        return fallback;
    }

    return fallback;
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
 * API zwraca czas w UTC.
 */
function formatDate(value) {

    if (!value) {
        return "—";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return displayValue(value);
    }

    return date.toLocaleString(
        "pl-PL",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function money(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    if (typeof value === "object") {

        value =
            value.amount ??
            value.value ??
            value.usd ??
            value.price ??
            null;
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return displayValue(value);
    }

    return "$" +
        number.toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );
}


/*
 * ============================
 * DANE POJAZDU
 * ============================
 */

function getVin(car) {

    return (
        car.vin ??
        car.VIN ??
        ""
    );
}


function getTitle(car) {

    return (
        car.title ??
        car.details?.attributes?.YearMakeModelSeries ??
        `${safe(car.year, "")} ${safe(car.make, "")} ${safe(car.model, "")}`
    ).trim();
}


function getLot(car) {

    return (
        car.lot_number ??
        car.lot ??
        car.details?.attributes?.StockNumber ??
        car.details?.auction_information?.stockNumber ??
        "—"
    );
}


function getPrice(car) {

    return (
        car.pricing?.current_bid_usd ??
        car.pricing?.current_bid2_usd ??
        car.current_bid_usd ??
        car.current_bid ??
        null
    );
}


function getMileage(car) {

    const mileage =
        car.odometer?.mi ??
        car.details?.attributes?.ODOValue ??
        null;

    if (
        mileage === null ||
        mileage === undefined ||
        mileage === ""
    ) {
        return "—";
    }

    const number = Number(
        String(mileage).replace(/,/g, "")
    );

    if (!Number.isFinite(number)) {
        return displayValue(mileage);
    }

    return number.toLocaleString("en-US") + " mi";
}


function getDamage(car) {

    return (
        car.condition?.primary_damage ??
        car.details?.vehicle_information?.PrimaryDamage ??
        car.details?.attributes?.PrimaryDamageDesc ??
        "—"
    );
}


function getSecondaryDamage(car) {

    return (
        car.condition?.secondary_damage ??
        car.details?.attributes?.SecondaryDamageDesc ??
        "—"
    );
}


function getRunCondition(car) {

    return (
        car.condition?.run_condition?.value ??
        car.details?.attributes?.StartsDesc ??
        car.details?.vehicle_information?.StartCode ??
        "—"
    );
}


function getLocation(car) {

    return (
        car.location?.display ??
        car.details?.sale_information?.SellingBranch ??
        car.details?.attributes?.BranchName ??
        "—"
    );
}


function getAddress(car) {

    const address =
        car.details?.saleInformation?.address ??
        car.details?.attributes?.Address;

    const city =
        car.details?.saleInformation?.city ??
        car.details?.attributes?.City;

    const state =
        car.details?.saleInformation?.state ??
        car.details?.attributes?.State;

    const zip =
        car.details?.saleInformation?.zip ??
        car.details?.attributes?.Zip;

    const parts = [
        address,
        city,
        state,
        zip
    ].filter(Boolean);

    return parts.length
        ? parts.join(", ")
        : "—";
}


function getTransmission(car) {

    return (
        car.vehicle_specs?.transmission ??
        car.details?.vehicle_description?.Transmission ??
        car.details?.attributes?.Transmission ??
        "—"
    );
}


function getFuel(car) {

    return (
        car.vehicle_specs?.fuel_type ??
        car.details?.vehicle_description?.FuelType ??
        car.details?.attributes?.FuelTypeDesc ??
        "—"
    );
}


function getDrive(car) {

    return (
        car.vehicle_specs?.drive_type ??
        car.details?.vehicle_description?.DriveLineType ??
        car.details?.attributes?.DriveLineTypeDesc ??
        "—"
    );
}


function getEngine(car) {

    return (
        car.vehicle_specs?.engine?.raw ??
        car.details?.vehicle_description?.Engine ??
        car.details?.attributes?.EngineSize ??
        car.details?.attributes?.EngineInformation ??
        "—"
    );
}


function getBodyType(car) {

    return (
        car.vehicle_specs?.body_style ??
        car.details?.vehicle_description?.BodyStyle ??
        car.details?.attributes?.BodyStyleName ??
        "—"
    );
}


function getColor(car) {

    return (
        car.vehicle_specs?.exterior_color ??
        car.details?.attributes?.ExteriorColor ??
        "—"
    );
}


function getKey(car) {

    if (
        car.condition?.has_key === true
    ) {
        return "Present";
    }

    if (
        car.condition?.has_key === false
    ) {
        return "Brak";
    }

    const value =
        car.details?.attributes?.Keys;

    if (value === "True") {
        return "Present";
    }

    if (value === "False") {
        return "Brak";
    }

    return "—";
}


function getVehicleType(car) {

    return (
        car.type ??
        car.details?.attributes?.InventoryType ??
        car.details?.vehicle_description?.Vehicle ??
        "—"
    );
}


function getTitleDocument(car) {

    return (
        car.sale_document?.name ??
        car.details?.vehicle_information?.TitleSaleDoc ??
        "—"
    );
}


function getTitleBrand(car) {

    return (
        car.sale_document?.sale_document_group ??
        car.sale_document?.name ??
        car.details?.vehicle_information?.TitleSaleDocBrand ??
        car.details?.sale_information?.Brand ??
        "—"
    );
}


/*
 * ============================
 * AUKCJA
 * ============================
 */

function getAuctionDate(car) {

    return (
        car.auction?.full_date ??
        car.auction?.auction_at ??
        car.details?.auction_information?.prebidInformation?.liveDate ??
        car.details?.attributes?.AuctionDateTime ??
        car.ad ??
        null
    );
}


function getAuctionState(car) {

    return String(
        car.auction?.state ??
        ""
    ).toLowerCase();
}


function getStatus(car) {

    const state =
        getAuctionState(car);

    if (
        state === "closed" ||
        state === "ended" ||
        state === "sold"
    ) {

        return {
            key: "ended",
            label: "AUKCJA ZAKOŃCZONA"
        };
    }


    if (
        state === "open"
    ) {

        const auctionDate =
            getAuctionDate(car);

        if (auctionDate) {

            const date =
                new Date(auctionDate);

            if (
                !Number.isNaN(date.getTime()) &&
                date.getTime() > Date.now()
            ) {

                return {
                    key: "upcoming",
                    label: "NADCHODZĄCA AUKCJA"
                };
            }
        }

        return {
            key: "active",
            label: "AKTYWNA AUKCJA"
        };
    }


    const auctionDate =
        getAuctionDate(car);

    if (auctionDate) {

        const date =
            new Date(auctionDate);

        if (
            !Number.isNaN(date.getTime())
        ) {

            if (
                date.getTime() > Date.now()
            ) {

                return {
                    key: "upcoming",
                    label: "NADCHODZĄCA AUKCJA"
                };
            }
        }
    }


    return {
        key: "active",
        label: "AKTYWNA AUKCJA"
    };
}


function getBidCount(car) {

    return (
        car.details
            ?.auction_information
            ?.prebidInformation
            ?.bidCountText ??
        null
    );
}


function getBidIncrement(car) {

    const value =
        car.details?.bid_increment ??
        car.details
            ?.auction_information
            ?.biddingInformation
            ?.bidIncrement ??
        null;

    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    return "$" +
        Number(value).toLocaleString("en-US");
}


/*
 * ============================
 * ZDJĘCIA
 * ============================
 */

function cleanImageUrl(value) {

    if (!value) {
        return null;
    }

    let url =
        String(value).trim();

    /*
     * API w pokazanym JSON-ie
     * zwraca czasami:
     *
     * [https://...](https://...)
     *
     * Wyciągamy z tego prawdziwy URL.
     */

    const markdownMatch =
        url.match(
            /^\[.*?\]\((https?:\/\/.*)\)$/
        );

    if (markdownMatch) {
        url = markdownMatch[1];
    }

    /*
     * Usuwamy ewentualne znaki escape
     * pochodzące z JSON / markdown.
     */

    url =
        url
            .replace(/\\&/g, "&")
            .replace(/\\~/g, "~")
            .replace(/\\\?/g, "?")
            .replace(/\\=/g, "=");

    return url;
}


function getImages(car) {

    const images = [];


    /*
     * Najlepsze źródło:
     *
     * media.items[].large
     */

    if (
        Array.isArray(
            car.media?.items
        )
    ) {

        car.media.items.forEach(item => {

            if (
                item &&
                item.type === "image"
            ) {

                const url =
                    cleanImageUrl(
                        item.large ??
                        item.thumb ??
                        item.url
                    );

                if (url) {
                    images.push(url);
                }
            }

        });
    }


    /*
     * Fallback na media.thumbs
     */

    if (
        !images.length &&
        Array.isArray(
            car.media?.thumbs
        )
    ) {

        car.media.thumbs.forEach(item => {

            const url =
                cleanImageUrl(item);

            if (url) {
                images.push(url);
            }

        });
    }


    /*
     * Fallback dla innych wersji API.
     */

    if (
        Array.isArray(car.images)
    ) {

        car.images.forEach(item => {

            let url = null;

            if (
                typeof item === "string"
            ) {
                url = item;
            }

            if (
                item &&
                typeof item === "object"
            ) {

                url =
                    item.large ??
                    item.url ??
                    item.src ??
                    item.image_url ??
                    item.medium ??
                    item.thumbnail;
            }

            url =
                cleanImageUrl(url);

            if (url) {
                images.push(url);
            }

        });
    }


    return [
        ...new Set(images)
    ];
}


/*
 * ============================
 * VIDEO
 * ============================
 */

function getVideoUrl(car) {

    if (
        Array.isArray(
            car.media?.items
        )
    ) {

        const video =
            car.media.items.find(
                item =>
                    item &&
                    item.type === "video"
            );

        if (video) {

            return cleanImageUrl(
                video.url
            );
        }
    }

    return null;
}


/*
 * ============================
 * ULUBIONE
 * ============================
 */

function getFavorites() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "rex_bid_favorites"
            ) || "[]"
        );

    } catch {

        return [];
    }
}


function saveFavorites(items) {

    localStorage.setItem(
        "rex_bid_favorites",
        JSON.stringify(items)
    );
}


function toggleFavorite(vin) {

    if (!vin) {
        return;
    }

    let favorites =
        getFavorites();

    if (
        favorites.includes(vin)
    ) {

        favorites =
            favorites.filter(
                item => item !== vin
            );

    } else {

        favorites.push(vin);
    }

    saveFavorites(favorites);

    renderFavoriteButton(vin);
}


function renderFavoriteButton(vin) {

    const button =
        document.getElementById(
            "favoriteButton"
        );

    if (!button) {
        return;
    }

    const active =
        getFavorites()
            .includes(vin);

    button.classList.toggle(
        "active",
        active
    );

    button.textContent =
        active
            ? "♥ Usuń z ulubionych"
            : "♡ Dodaj do ulubionych";
}

function renderHistory(car) {

        return `

/*
 * ============================
 * GALERIA
 * ============================
 */

function changeImage(
    image,
    element,
    index
) {

    const main =
        document.getElementById(
            "mainImage"
        );

    if (main) {

        main.src = image;

        main.onerror = function() {

            this.style.display = "none";

            const fallback =
                document.getElementById(
                    "imageFallback"
                );

            if (fallback) {
                fallback.style.display = "flex";
            }
        };

        main.onload = function() {

            this.style.display = "block";

            const fallback =
                document.getElementById(
                    "imageFallback"
                );

            if (fallback) {
                fallback.style.display = "none";
            }
        };
    }


    document
        .querySelectorAll(".thumb")
        .forEach(
            thumb =>
                thumb.classList.remove(
                    "active"
                )
        );


    element.classList.add("active");


    const counter =
        document.getElementById(
            "imageCounter"
        );

    if (counter) {

        const total =
            document.querySelectorAll(
                ".thumb"
            ).length;

        counter.textContent =
            `${index + 1} / ${total}`;
    }
}


/*

 * W obecnym JSON-ie nie ma URL-a
 * aukcji IAAI, dlatego przycisk
 * pozostaje ukryty zamiast prowadzić
 * do przypadkowego adresu.
 */

function setupAuctionLink(car) {

    const button =
        document.getElementById(
            "auctionButton"
        );

    if (!button) {
        return;
    }

    const url =
        car.auction_url ??
        car.auction?.url ??
        car.source_url ??
        car.source?.url ??
        null;


    if (!url) {

        button.style.display =
            "none";

        return;
    }


    button.href = url;
    button.style.display = "block";
}

/*
 * ============================
 * POBIERANIE SAMOCHODU
 * ============================
 */

async function loadCar() {

    const app =
        document.getElementById(
            "app"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const vin =
        params.get("vin");


    if (!vin) {

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie znaleziono samochodu
                </strong>

                Brak numeru VIN w adresie.

            </div>

        `;

        return;
    }


    try {

        /*
         * TEN ENDPOINT JUŻ DZIAŁA:
         *
         * /api/cars?s=VIN
         */

        const response =
            await fetch(
                "/api/cars?s=" +
                encodeURIComponent(vin),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Błąd HTTP " +
                response.status
            );
        }


        const result =
            await response.json();


        if (!result.ok) {

            throw new Error(
                result.error ||
                "Błąd API"
            );
        }


        const cars =
            Array.isArray(
                result.data
            )
                ? result.data
                : [];


        const wantedVin =
            String(vin)
                .trim()
                .toUpperCase();


        const car =
            cars.find(
                item =>
                    String(
                        item.vin ??
                        item.VIN ??
                        ""
                    )
                    .trim()
                    .toUpperCase() ===
                    wantedVin
            ) ||
            cars[0];


        if (!car) {

            app.innerHTML = `

                <div class="error">

                    <strong>
                        Nie znaleziono samochodu
                    </strong>

                    Oferta dla VIN
                    ${escapeHtml(vin)}
                    nie jest dostępna.

                </div>

            `;

            return;
        }


        renderCar(car);


    } catch (error) {

        console.error(
            "Rex.Bid car error:",
            error
        );


        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie udało się pobrać samochodu
                </strong>

                Wystąpił problem z połączeniem
                z API.

                <br><br>

                <small>
                    ${escapeHtml(
                        error.message
                    )}
                </small>

            </div>

        `;
    }
}
