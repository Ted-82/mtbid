<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rex.Bid — samochód</title>
  <meta name="description" content="Rex.Bid — szczegóły pojazdu z aukcji Copart i IAAI." />

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg:#0b0d10;
      --panel:#12161b;
      --panel2:#181d23;
      --border:#282e36;
      --text:#f4f6f8;
      --muted:#9aa3ad;
      --accent:#ffb000;
      --accent2:#ffd05c;
      --green:#35d07f;
      --red:#ff5d5d;
      --orange:#ff8d3a;
      --blue:#55aaff;
    }

    html { scroll-behavior:smooth; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    body.modal-open { overflow:hidden; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }

    .container {
      width:min(1440px,calc(100% - 32px));
      margin:0 auto;
    }

    header {
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(11,13,16,.94);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
    }

    .header-inner {
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .logo {
      font-size:24px;
      font-weight:900;
      letter-spacing:-1.4px;
    }
    .logo span { color:var(--accent); }

    .nav {
      display:flex;
      gap:22px;
      color:var(--muted);
      font-size:13px;
    }
    .nav a:hover { color:#fff; }

    main { padding:18px 0 70px; }

    .back {
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:14px;
      color:var(--muted);
      font-size:12px;
    }
    .back:hover { color:#fff; }

    .top-grid {
      display:grid;
      grid-template-columns:minmax(0,1.65fr) minmax(320px,.7fr);
      gap:14px;
      align-items:start;
    }

    .panel {
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
    }

    .gallery {
      padding:0;
      background:#080a0c;
    }

    .main-photo {
      position:relative;
      height:min(62vw,560px);
      min-height:360px;
      background:#080a0c;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .main-photo img {
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      cursor:zoom-in;
    }

    .main-photo .media-label {
      position:absolute;
      left:12px;
      top:12px;
      padding:7px 10px;
      border-radius:7px;
      background:rgba(0,0,0,.76);
      font-size:11px;
      font-weight:900;
      z-index:3;
    }

    .photo-count {
      position:absolute;
      right:12px;
      bottom:12px;
      padding:7px 10px;
      border-radius:7px;
      background:rgba(0,0,0,.76);
      font-size:11px;
      z-index:3;
    }

    .gallery-arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:42px;
      height:42px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:50%;
      background:rgba(0,0,0,.6);
      color:#fff;
      font-size:25px;
      z-index:5;
    }
    .gallery-arrow:hover { background:rgba(0,0,0,.85); }
    .gallery-arrow.prev { left:12px; }
    .gallery-arrow.next { right:12px; }

    .thumb-wrap {
      padding:8px;
      border-top:1px solid var(--border);
      background:#0c0f12;
    }

    .thumbs {
      display:grid;
      grid-template-columns:repeat(8,minmax(0,1fr));
      gap:6px;
      max-height:220px;
      overflow:auto;
      scrollbar-width:thin;
    }

    .thumb {
      position:relative;
      aspect-ratio:4/3;
      padding:0;
      border:1px solid transparent;
      border-radius:7px;
      overflow:hidden;
      background:#101318;
    }
    .thumb:hover { border-color:#6d7680; }
    .thumb.active { border-color:var(--accent); }
    .thumb img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .thumb.hd::after {
      content:"HD";
      position:absolute;
      right:4px;
      bottom:4px;
      padding:2px 4px;
      border-radius:3px;
      background:rgba(0,0,0,.75);
      color:#fff;
      font-size:8px;
      font-weight:900;
    }

    .media-toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:10px;
      border-top:1px solid var(--border);
      background:#0e1115;
    }

    .media-btn {
      border:1px solid var(--border);
      background:var(--panel2);
      color:#fff;
      padding:9px 12px;
      border-radius:8px;
      font-size:12px;
      font-weight:800;
    }
    .media-btn:hover {
      border-color:#59616b;
      background:#20262d;
    }
    .media-btn.accent {
      background:var(--accent);
      color:#111;
      border-color:var(--accent);
    }

    .summary {
      padding:18px;
      position:sticky;
      top:88px;
    }

    .source-badge {
      display:inline-flex;
      padding:6px 9px;
      border-radius:7px;
      background:#20262d;
      color:#fff;
      font-size:10px;
      font-weight:900;
      margin-bottom:12px;
    }

    .summary h1 {
      margin:0 0 12px;
      font-size:27px;
      line-height:1.05;
      letter-spacing:-1px;
    }

    .live {
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-left:6px;
      padding:5px 8px;
      border-radius:6px;
      background:rgba(53,208,127,.16);
      color:var(--green);
      font-size:10px;
      font-weight:900;
      vertical-align:middle;
    }

    .live-dot {
      width:6px;
      height:6px;
      border-radius:50%;
      background:var(--green);
    }

    .vin-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:10px;
      margin-bottom:10px;
      background:var(--panel2);
      border:1px solid var(--border);
      border-radius:8px;
    }
    .vin-row small { color:var(--muted); display:block; font-size:9px; margin-bottom:3px; }
    .vin-row strong { font-size:11px; word-break:break-all; }

    .copy-btn {
      flex:none;
      border:1px solid var(--border);
      background:#20262d;
      color:#fff;
      padding:7px 9px;
      border-radius:6px;
      font-size:10px;
      font-weight:800;
    }

    .auction-box {
      border:1px solid var(--border);
      border-radius:9px;
      overflow:hidden;
      margin-bottom:10px;
    }

    .auction-row {
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:10px;
      border-bottom:1px solid var(--border);
    }
    .auction-row:last-child { border-bottom:0; }
    .auction-row small { color:var(--muted); display:block; font-size:9px; margin-bottom:3px; }
    .auction-row strong { font-size:11px; text-align:right; }

    .countdown {
      color:var(--accent);
      font-size:18px!important;
    }

    .price-box {
      padding:12px;
      border:1px solid var(--border);
      border-radius:9px;
      background:linear-gradient(180deg,#20221f,#171a18);
      margin-bottom:10px;
    }
    .price-box small { color:var(--muted); font-size:9px; }
    .price {
      font-size:26px;
      font-weight:950;
      margin-top:2px;
    }
    .price-sub { color:var(--muted); font-size:9px; margin-top:2px; }

    .action-row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .action {
      height:42px;
      border-radius:8px;
      border:1px solid var(--border);
      background:var(--panel2);
      color:#fff;
      font-weight:800;
      font-size:11px;
    }
    .action.primary { background:var(--accent); color:#111; border-color:var(--accent); }
    .source-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.source-link{display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);font-size:11px;font-weight:900}.source-link:hover{border-color:var(--accent)}
    .calc-card{padding:14px;margin-bottom:14px}.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.calc-field label{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}.calc-field input{width:100%;height:38px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);color:#fff;outline:none;font-size:11px}.calc-field input:focus{border-color:var(--accent)}.calc-lines{margin-top:10px;border-top:1px solid var(--border)}.calc-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:10px}.calc-line span:first-child{color:var(--muted)}.calc-total{display:flex;justify-content:space-between;gap:10px;padding-top:11px;font-size:16px;font-weight:950}.calc-pln{color:var(--accent)}.calc-note{margin-top:8px;color:var(--muted);font-size:9px;line-height:1.5}

    .content-grid {
      display:grid;
      grid-template-columns:minmax(0,1.65fr) minmax(280px,.7fr);
      gap:14px;
      margin-top:14px;
      align-items:start;
    }

    .section {
      padding:14px;
      margin-bottom:14px;
    }

    .section-title {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .section-title h2 {
      margin:0;
      font-size:16px;
    }

    .section-title span {
      color:var(--muted);
      font-size:10px;
    }

    .spec-grid {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      border:1px solid var(--border);
      border-radius:9px;
      overflow:hidden;
    }

    .spec {
      min-width:0;
      padding:10px;
      border-right:1px solid var(--border);
      border-bottom:1px solid var(--border);
      background:#11151a;
    }
    .spec:nth-child(3n) { border-right:0; }
    .spec:nth-last-child(-n+3) { border-bottom:0; }
    .spec small {
      display:block;
      color:var(--muted);
      font-size:9px;
      margin-bottom:4px;
    }
    .spec strong {
      display:block;
      font-size:11px;
      line-height:1.35;
      overflow-wrap:anywhere;
    }

    .damage-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .damage {
      padding:13px;
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--panel2);
    }
    .damage.main { border-color:#8b3d3d; }
    .damage small { color:var(--muted); font-size:9px; display:block; margin-bottom:4px; }
    .damage strong { font-size:13px; }
    .damage.main strong { color:var(--red); }

    .side-section {
      padding:14px;
      margin-bottom:14px;
    }

    .side-section h3 {
      margin:0 0 10px;
      font-size:14px;
    }

    .kv {
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:9px 0;
      border-bottom:1px solid var(--border);
      font-size:10px;
    }
    .kv:last-child { border-bottom:0; }
    .kv span { color:var(--muted); }
    .kv strong { text-align:right; overflow-wrap:anywhere; }

    .seller-box {
      padding:12px;
      border-radius:9px;
      background:var(--panel2);
      border:1px solid var(--border);
    }

    .seller-rating {
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:9px;
      font-weight:900;
      font-size:12px;
    }

    .risk-dot {
      width:10px;
      height:10px;
      border-radius:50%;
      background:#6d747c;
    }
    .risk-dot.green { background:var(--green); }
    .risk-dot.orange { background:var(--orange); }
    .risk-dot.red { background:var(--red); }
    .risk-dot.blue { background:var(--blue); }

    .seller-note {
      color:var(--muted);
      font-size:10px;
      line-height:1.5;
    }

    .title-verdict {
      padding:12px;
      border-radius:9px;
      border:1px solid var(--border);
      background:var(--panel2);
      margin-bottom:9px;
    }

    .title-verdict.good { border-color:#276f4b; }
    .title-verdict.warn { border-color:#7c5b24; }
    .title-verdict.bad { border-color:#813c3c; }
    .title-verdict.unknown { border-color:#39414a; }

    .verdict-label {
      font-size:13px;
      font-weight:900;
      margin-bottom:5px;
    }

    .verdict-text {
      color:var(--muted);
      font-size:10px;
      line-height:1.5;
    }

    .materials {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .material {
      padding:11px;
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--panel2);
      text-align:center;
    }
    .material strong {
      display:block;
      font-size:18px;
      margin-bottom:3px;
    }
    .material span {
      color:var(--muted);
      font-size:9px;
    }

    .media-panel {
      padding:0;
    }

    .media-view {
      min-height:360px;
      background:#07090b;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .media-view iframe,
    .media-view video {
      width:100%;
      height:560px;
      border:0;
      background:#000;
    }

    .empty {
      padding:50px 20px;
      text-align:center;
      color:var(--muted);
    }

    .error {
      margin:30px auto;
      max-width:800px;
      padding:25px;
      border:1px solid #663333;
      background:#211316;
      border-radius:12px;
      color:#ff8d8d;
    }

    footer {
      padding:28px 0;
      border-top:1px solid var(--border);
      color:var(--muted);
      text-align:center;
      font-size:11px;
    }

    /* LIGHTBOX */
    .lightbox {
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      background:rgba(0,0,0,.94);
    }
    .lightbox.open { display:block; }

    .lb-top {
      position:absolute;
      left:15px;
      right:15px;
      top:15px;
      z-index:5;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .lb-info {
      color:#fff;
      font-size:12px;
      padding:8px 10px;
      background:rgba(20,23,27,.9);
      border:1px solid #343a42;
      border-radius:7px;
    }

    .lb-controls {
      display:flex;
      gap:6px;
    }

    .lb-controls button {
      width:38px;
      height:38px;
      border:1px solid #343a42;
      border-radius:7px;
      background:#171b20;
      color:#fff;
      font-size:18px;
      font-weight:800;
    }

    .lb-stage {
      position:absolute;
      inset:70px 60px 65px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      touch-action:none;
    }

    .lb-stage img {
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      transform-origin:center center;
      user-select:none;
      -webkit-user-drag:none;
      cursor:grab;
    }
    .lb-stage img.dragging { cursor:grabbing; }

    .lb-bottom {
      position:absolute;
      left:15px;
      right:15px;
      bottom:12px;
      display:flex;
      justify-content:center;
      color:#aaa;
      font-size:10px;
    }

    .lightbox-nav {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      z-index:4;
      width:44px;
      height:44px;
      border:1px solid #343a42;
      border-radius:50%;
      background:rgba(20,23,27,.9);
      color:#fff;
      font-size:25px;
    }
    .lightbox-nav.left { left:10px; }
    .lightbox-nav.right { right:10px; }

    .viewer-modal {
      position:fixed;
      inset:0;
      z-index:1100;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.9);
      padding:25px;
    }
    .viewer-modal.open { display:flex; }

    .viewer-inner {
      width:min(1200px,100%);
      height:min(800px,90vh);
      background:#0c0f13;
      border:1px solid var(--border);
      border-radius:12px;
      overflow:hidden;
      position:relative;
    }

    .viewer-close {
      position:absolute;
      right:10px;
      top:10px;
      z-index:3;
      width:38px;
      height:38px;
      border:1px solid #444;
      border-radius:8px;
      background:rgba(0,0,0,.7);
      color:#fff;
      font-size:20px;
    }

    .viewer-inner iframe,
    .viewer-inner video {
      width:100%;
      height:100%;
      border:0;
      background:#000;
    }

    @media (max-width:1050px) {
      .top-grid,.content-grid { grid-template-columns:1fr; }
      .summary { position:static; }
      .spec-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .spec:nth-child(3n) { border-right:1px solid var(--border); }
      .spec:nth-child(2n) { border-right:0; }
      .spec:nth-last-child(-n+3) { border-bottom:1px solid var(--border); }
      .spec:last-child,.spec:nth-last-child(2) { border-bottom:0; }
    }

    @media (max-width:700px) {
      .container { width:calc(100% - 20px); }
      .nav { display:none; }
      .main-photo { height:62vw; min-height:260px; }
      .thumbs { grid-template-columns:repeat(5,minmax(0,1fr)); max-height:180px; }
      .summary h1 { font-size:24px; }
      .spec-grid { grid-template-columns:1fr 1fr; }
      .damage-grid { grid-template-columns:1fr; }
      .calc-grid,.source-links { grid-template-columns:1fr; }
      .media-view iframe,.media-view video { height:55vh; }
      .lb-stage { inset:70px 12px 65px; }
      .lightbox-nav.left { left:4px; }
      .lightbox-nav.right { right:4px; }
    }
  </style>
</head>

<body>
<header>
  <div class="container header-inner">
    <a href="/" class="logo">Rex<span>.Bid</span></a>
    <nav class="nav">
      <a href="/">Samochody</a>
      <a href="/#search">Wyszukiwarka</a>
      <a href="/#results">Aukcje</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <a class="back" href="/">← Wróć do samochodów</a>

    <div id="page"></div>
  </div>
</main>

<footer>
  <div class="container">Rex.Bid — Vehicle Auction Marketplace</div>
</footer>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <div class="lb-top">
    <div id="lbInfo" class="lb-info">HD</div>
    <div class="lb-controls">
      <button id="lbMinus" title="Pomniejsz">−</button>
      <button id="lbReset" title="Reset">1:1</button>
      <button id="lbPlus" title="Powiększ">+</button>
      <button id="lbClose" title="Zamknij">×</button>
    </div>
  </div>

  <button id="lbPrev" class="lightbox-nav left">‹</button>
  <button id="lbNext" class="lightbox-nav right">›</button>

  <div id="lbStage" class="lb-stage">
    <img id="lbImage" alt="" />
  </div>

  <div class="lb-bottom">
    Kółko myszy / przyciski + i − = zoom • przeciągnij zdjęcie po powiększeniu
  </div>
</div>

<div id="viewerModal" class="viewer-modal" aria-hidden="true">
  <div class="viewer-inner">
    <button id="viewerClose" class="viewer-close">×</button>
    <div id="viewerContent"></div>
  </div>
</div>

<script>
  const API_BASE = "/api";
  const params = new URLSearchParams(location.search);
  const VIN = (params.get("vin") || "").trim();
  const LOT = (params.get("lot") || "").trim();

  const page = document.getElementById("page");

  let car = null;
  let photos = [];
  let photoIndex = 0;

  let zoom = 1;
  let panX = 0;
  let panY = 0;
  let dragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let startPanX = 0;
  let startPanY = 0;

  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function isEmpty(v) {
    return v === null || v === undefined || String(v).trim() === "" ||
      String(v).trim() === "—" || String(v).trim().toLowerCase() === "null";
  }

  function first(...values) {
    for (const v of values) {
      if (!isEmpty(v)) return v;
    }
    return null;
  }

  function bool(v) {
    if (v === true || v === 1) return true;
    if (typeof v === "string") return ["true","yes","1","present","available","actual"].includes(v.toLowerCase());
    return false;
  }

  function money(v) {

  function unwrapResult(json) {
    if (!json) return null;

    let data = json.data ?? json.result ?? json.vehicle ?? json.car ?? json;

    if (data && data.data && !Array.isArray(data.data)) data = data.data;
    if (Array.isArray(data)) {
      if (VIN) {

  async function fetchVehicle() {
    const attempts = [];

    if (VIN) {
      attempts.push(`${API_BASE}/cars?vin=${encodeURIComponent(VIN)}`);
      attempts.push(`${API_BASE}/cars?s=${encodeURIComponent(VIN)}&per_page=20`);
      attempts.push(`${API_BASE}/car?vin=${encodeURIComponent(VIN)}`);
    }

    if (LOT) {
      attempts.push(`${API_BASE}/cars?lot=${encodeURIComponent(LOT)}`);
      attempts.push(`${API_BASE}/cars?s=${encodeURIComponent(LOT)}&per_page=20`);
      attempts.push(`${API_BASE}/car?lot=${encodeURIComponent(LOT)}`);
    }

    let lastError = null;

    for (const url of attempts) {
      try {
        const response = await fetch(url, {
          headers: { "Accept":"application/json" }
        });

        const text = await response.text();
        let json = null;

        try { json = JSON.parse(text); } catch (_) {}

        if (!response.ok) {
          lastError = new Error(json?.error || `HTTP ${response.status}`);
          continue;
        }

        const result = unwrapResult(json);
        if (result) return result;

        lastError = new Error("API nie zwróciło samochodu.");
      } catch (e) {
        lastError = e;
      }
    }

    throw lastError || new Error("Nie udało się pobrać samochodu.");
  }

  function collectObjects(root, out = []) {
    if (!root || typeof root !== "object") return out;
    if (out.includes(root)) return out;
    out.push(root);

    if (Array.isArray(root)) {
      root.forEach(x => collectObjects(x, out));
    } else {
      Object.values(root).forEach(x => {
        if (x && typeof x === "object") collectObjects(x, out);
      });
    }
    return out;
  }

  function findAllByKeys(root, keys) {
    const wanted = new Set(keys.map(k => k.toLowerCase()));
    const result = [];
    for (const obj of collectObjects(root)) {
      for (const [k,v] of Object.entries(obj)) {
        if (wanted.has(k.toLowerCase()) && v !== null && v !== undefined) {
          result.push(v);
        }
      }
    }
    return result;
  }

  function normalizeMedia(root) {
    const found = [];
    const objects = collectObjects(root);

    function addImage(item) {
      if (!item) return;

      if (typeof item === "string") {
        if (/^https?:\/\//i.test(item)) found.push({ type:"image", thumb:item, large:item });
        return;
      }

      const large = first(item.large, item.hd, item.big, item.original, item.original_url, item.large_url, item.url, item.src);
      const thumb = first(item.thumb, item.thumbnail, item.small, item.normal, item.thumb_url, large);

      if (large || thumb) {
        found.push({ type:"image", thumb:thumb || large, large:large || thumb });
      }
    }

    for (const obj of objects) {
      for (const key of ["items","images","photos","media"]) {
        const val = obj[key];
        if (!val) continue;

        if (Array.isArray(val)) {
          val.forEach(x => {
            if (x && typeof x === "object" && String(x.type || "").toLowerCase() !== "video" && String(x.type || "").toLowerCase() !== "vr360") {
              addImage(x);
            } else if (typeof x === "string") {
              addImage(x);
            }
          });
        } else if (typeof val === "object") {
          if (Array.isArray(val.thumbs)) val.thumbs.forEach((x,i) => addImage({ thumb:x, large:val.large?.[i] || val.big?.[i] || x }));
          if (Array.isArray(val.normal)) val.normal.forEach((x,i) => addImage({ thumb:x, large:val.big?.[i] || x }));
          if (Array.isArray(val.big)) val.big.forEach(x => addImage({ thumb:x, large:x }));
          if (Array.isArray(val.images)) val.images.forEach(x => addImage(x));
          if (Array.isArray(val.items)) val.items.forEach(x => addImage(x));
        }
      }
    }

    const seen = new Set();
    const unique = [];

    for (const p of found) {
      const raw = p.large || p.thumb;
      if (!raw) continue;

      // IAAI imageKeys are the real image identity. This removes duplicate
      // thumb/large representations and repeated records.
      const keyMatch = raw.match(/imageKeys=([^&]+)/i);
      const key = keyMatch ? keyMatch[1] : raw.replace(/[?&](width|height)=[^&]+/g,"");

      if (seen.has(key)) continue;
      seen.add(key);
      unique.push(p);
    }

    return unique;
  }

          ${getAuctionUrl() ? `<div class="source-links"><a class="source-link" href="${esc(getAuctionUrl())}" target="_blank" rel="noopener noreferrer">OTWÓRZ ORYGINALNĄ AUKCJĘ ↗</a><a class="source-link" href="${esc(getAuctionUrl())}" target="_blank" rel="noopener noreferrer">${esc(platformName())} — ŹRÓDŁO</a></div>` : ""}
        </aside>
      </div>

      <div class="content-grid">
        <div>
          <section class="panel section" id="details">
            <div class="section-title">
              <h2>Dane samochodu</h2>
              <span>${mediaCount} unikalnych zdjęć</span>
            </div>

            <div class="spec-grid">
              ${field("Rok",year)}
              ${field("Marka",make)}
              ${field("Model",model)}
              ${field("Wersja / seria",series)}
              ${field("VIN",vin)}
              ${field("Nadwozie",getDescription(["BodyStyle","BodyStyleName"]))}
              ${field("Typ pojazdu",getDescription(["Vehicle","VehicleClass","InventoryType"]))}
              ${field("Silnik",getDescription(["Engine","EngineSize","EngineInformation"]))}
              ${field("Skrzynia",getDescription(["Transmission","TransmissionDesc"]))}
              ${field("Napęd",getDescription(["DriveLineType","DriveLineTypeDesc"]))}
              ${field("Paliwo",getDescription(["FuelType","FuelTypeDesc"]))}
              ${field("Cylindry",getDescription(["Cylinders","CylindersDesc"]))}
              ${field("Przebieg",odometer)}
              ${field("Status przebiegu",valueFrom(["ODOBrand"]))}
              ${field("Kolor zewnętrzny",valueFrom(["ExteriorColor"]))}
              ${field("Kolor wnętrza",valueFrom(["InteriorColor"]))}
              ${field("Kolor",getDescription(["ExteriorInterior"]))}
              ${field("Kluczyki",keys)}
              ${field("Run & Drive",runDrive)}
              ${field("Airbagi",airbags)}
              ${field("Restraint / poduszki",getDescription(["RestraintSystem","RestraintType"]))}
              ${field("Kraj produkcji",getDescription(["ManufacturedIn","CountryOfOrigin"]))}
              ${field("Klasa pojazdu",getDescription(["VehicleClass","Segment","SegmentDesc"]))}
              ${field("Opcje",getDescription(["Options"]))}
              ${field("Typ straty",getInfo(["Loss"]))}
              ${field("ACV",getSale(["ActualCashValue"]))}
              ${field("Szac. naprawa",getSale(["EstimatedRepairCost"]))}
              ${field("Minimalna oferta",valueFrom(["MinimumBidAmount"]))}
              ${field("Bid increment",valueFrom(["bid_increment","bidIncrement"]))}
              ${field("Kto może kupić",valueFrom(["WhoCanBuy"]))}
            </div>
          </section>

          <section class="panel section">
            <div class="section-title">
              <h2>Uszkodzenia</h2>
              <span>Dane ze źródła aukcyjnego</span>
            </div>
            <div class="damage-grid">
              ${!isEmpty(primaryDamage) ? `<div class="damage main"><small>Główne uszkodzenie</small><strong>${nice(primaryDamage)}</strong></div>` : ""}
              ${!isEmpty(secondaryDamage) ? `<div class="damage"><small>Drugorzędne uszkodzenie</small><strong>${nice(secondaryDamage)}</strong></div>` : ""}
              ${field("Rodzaj straty",getInfo(["Loss"]))}
            </div>
          </section>

          <section class="panel section">
            <div class="section-title">
              <h2>Dokumenty / TITLE</h2>
              <span>Analiza Rex.Bid</span>
            </div>

            <div class="title-verdict ${verdict.cls}">
              <div class="verdict-label">${verdict.label}</div>
              <div class="verdict-text">${verdict.text}</div>
            </div>

            <div class="spec-grid">
              ${field("Dokument",titleDoc)}
              ${field("Title brand",titleBrand)}
              ${field("Stan / kod title",titleCode)}
              ${field("Stan title",titleState)}
              ${field("Uwagi do title",titleNotes)}
            </div>
          </section>

          ${renderImportCalculator()}

          <section class="panel section">
            <div class="section-title">
              <h2>Sprzedawca</h2>
              <span>Profil na podstawie danych aukcyjnych</span>
            </div>

            <div class="seller-box">
              <div class="seller-rating">
                <span class="risk-dot ${sellerInfo.cls}"></span>
                ${esc(sellerInfo.label)}
              </div>
              ${seller ? `<div class="kv"><span>Sprzedawca</span><strong>${esc(seller)}</strong></div>` : ""}
              ${kv("Typ sprzedawcy",valueFrom(["seller_type","sellerType","SellerType","ProviderType"]))}
              ${kv("Zaufany / zweryfikowany",getTrustedSeller())}
              ${kv("Pochodzenie",valueFrom(["Origin"]))}
              <div class="seller-note">${esc(sellerInfo.note)}</div>
            </div>
          </section>

          ${(video || image360) ? `
            <section class="panel section media-panel" id="media">
              <div class="section-title" style="padding:14px 14px 0">
                <h2>Materiały</h2>
                <span>${video ? "Wideo" : ""}${video && image360 ? " + " : ""}${image360 ? "360°" : ""}</span>
              </div>
              <div class="media-view" id="mediaView">
                <div class="empty">Wybierz Wideo albo Widok 360° powyżej.</div>
              </div>
            </section>
          ` : ""}
        </div>

        <aside>
          <section class="panel side-section">
            <h3>Informacje o aukcji</h3>
            ${kv("Platforma",platformName())}
            ${kv("Numer LOT",lot)}
            ${kv("Status",getAuctionStatus())}
            ${kv("Data aukcji",formatDate(date))}
            ${kv("Sprzedawca",seller)}
            ${kv("Typ sprzedawcy",valueFrom(["seller_type","sellerType","SellerType","ProviderType"]))}
            ${kv("Lane",getSale(["Lane"]))}
            ${kv("Aisle",getSale(["Aisle"]))}
            ${kv("Bid increment",valueFrom(["bid_increment","bidIncrement"]))}
          </section>

          <section class="panel side-section">
            <h3>Lokalizacja</h3>
            ${kv("Oddział",getSale(["SellingBranch"]))}
            ${kv("Miejsce",location)}
            ${kv("Adres",valueFrom(["Address"]))}
            ${kv("Miasto",valueFrom(["City"]))}
            ${kv("Stan",valueFrom(["State","BranchState"]))}
            ${kv("ZIP",valueFrom(["Zip"]))}
            ${kv("Telefon",valueFrom(["Phone"]))}
            ${kv("Pozycja",valueFrom(["VehiclesVehicleLocation"]))}
          </section>

          <section class="panel side-section">
            <h3>Materiały</h3>
            <div class="materials">
              <div class="material"><strong>${mediaCount}</strong><span>unikalnych zdjęć</span></div>
              <div class="material"><strong>${video ? "✓" : "—"}</strong><span>wideo</span></div>
              <div class="material"><strong>${image360 ? "✓" : "—"}</strong><span>widok 360°</span></div>
            </div>
          </section>

          <section class="panel side-section">
            <h3>Dokument / tytuł</h3>
            ${kv("Title",titleDoc)}
            ${kv("Brand",titleBrand)}
            ${kv("State",titleState)}
            ${kv("Code",titleCode)}
            ${kv("VIN",vin)}
          </section>
        </aside>
      </div>
    `;

    bindPageEvents(video,image360);
    renderPhotos();
    calculateImport();
    startCountdown();
  }

  function renderPhotos() {
    const main = document.getElementById("mainImage");
    const thumbs = document.getElementById("thumbs");
    const count = document.getElementById("photoCount");

    if (!photos.length) {
      main.style.display = "none";
      count.textContent = "Brak zdjęć";
      thumbs.innerHTML = `<div class="empty" style="grid-column:1/-1;padding:20px">Brak zdjęć w danych aukcji.</div>`;
      return;
    }

    main.style.display = "block";
    const p = photos[photoIndex];

    main.src = p.large || p.thumb;
    main.alt = `${getTitle() || "Samochód"} — zdjęcie ${photoIndex + 1}`;
    count.textContent = `${photoIndex + 1} / ${photos.length} • HD`;

    thumbs.innerHTML = photos.map((photo,i) => `
      <button class="thumb ${i === photoIndex ? "active" : ""} hd" data-i="${i}" title="Zdjęcie ${i+1} HD">
        <img src="${esc(photo.thumb || photo.large)}" loading="lazy" alt="Miniatura ${i+1}" />
      </button>
    `).join("");

    thumbs.querySelectorAll(".thumb").forEach(btn => {
      btn.addEventListener("click",() => {
        photoIndex = Number(btn.dataset.i);
        renderPhotos();
      });
    });
  }

  function bindPageEvents(video,image360) {
    document.getElementById("prevPhoto")?.addEventListener("click",() => {
      if (!photos.length) return;
      photoIndex = (photoIndex - 1 + photos.length) % photos.length;
      renderPhotos();
    });

    document.getElementById("nextPhoto")?.addEventListener("click",() => {
      if (!photos.length) return;
      photoIndex = (photoIndex + 1) % photos.length;
      renderPhotos();
    });

    document.getElementById("mainImage")?.addEventListener("click",openLightbox);
    document.getElementById("openHd")?.addEventListener("click",openLightbox);

    document.getElementById("openVideo")?.addEventListener("click",() => openViewer(video,"video"));
    document.getElementById("open360")?.addEventListener("click",() => openViewer(image360,"360"));

    document.getElementById("copyVin")?.addEventListener("click",async() => {
      await navigator.clipboard?.writeText(getVin() || "");
      const b = document.getElementById("copyVin");
      if (b) {
        b.textContent = "Skopiowano";
        setTimeout(() => b.textContent = "Kopiuj",1200);
      }
    });

    document.getElementById("copyLink")?.addEventListener("click",async() => {
      await navigator.clipboard?.writeText(location.href);
      const b = document.getElementById("copyLink");
      if (b) {
        b.textContent = "Skopiowano";
        setTimeout(() => b.textContent = "Kopiuj link",1200);
      }
    });

    document.getElementById("scrollInfo")?.addEventListener("click",() => {
      document.getElementById("details")?.scrollIntoView({behavior:"smooth",block:"start"});
    });
    ["cxBid","cxFee","cxUsa","cxSea","cxOther","cxRate","cxDuty","cxExcise","cxVat","cxPl"].forEach(id=>document.getElementById(id)?.addEventListener("input",calculateImport));
  }

  function openLightbox() {
    if (!photos.length) return;

    photoIndex = Math.max(0,Math.min(photoIndex,photos.length-1));
    zoom = 1;
    panX = 0;
    panY = 0;

    const lb = document.getElementById("lightbox");
    lb.classList.add("open");
    lb.setAttribute("aria-hidden","false");
    document.body.classList.add("modal-open");
    updateLightbox();
  }

  function closeLightbox() {
    const lb = document.getElementById("lightbox");
    lb.classList.remove("open");
    lb.setAttribute("aria-hidden","true");
    document.body.classList.remove("modal-open");
  }

  function updateLightbox() {
    if (!photos.length) return;
    const p = photos[photoIndex];
    const img = document.getElementById("lbImage");

    img.src = p.large || p.thumb;
    img.alt = `${getTitle() || "Samochód"} — HD ${photoIndex+1}`;
    document.getElementById("lbInfo").textContent = `HD • ${photoIndex+1} / ${photos.length}`;

    img.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  }

  function setZoom(next) {
    zoom = Math.max(.5,Math.min(5,next));
    if (zoom <= 1) {
      panX = 0;
      panY = 0;
    }
    updateLightbox();
  }

  function openViewer(url,type) {
    if (!url) return;

    const modal = document.getElementById("viewerModal");
    const content = document.getElementById("viewerContent");

    if (type === "360") {
      content.innerHTML = `<iframe src="${esc(url)}" allow="fullscreen; autoplay; xr-spatial-tracking" allowfullscreen title="Widok 360°"></iframe>`;
    } else {
      content.innerHTML = `
        <video controls autoplay playsinline>
          <source src="${esc(url)}" />
          Twoja przeglądarka nie może odtworzyć tego materiału.
          <a href="${esc(url)}" target="_blank" rel="noopener">Otwórz materiał</a>
        </video>
      `;
    }

    modal.classList.add("open");
    modal.setAttribute("aria-hidden","false");
    document.body.classList.add("modal-open");
  }

  function closeViewer() {
    const modal = document.getElementById("viewerModal");
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden","true");
    document.getElementById("viewerContent").innerHTML = "";
    document.body.classList.remove("modal-open");
  }

  document.getElementById("lbClose").addEventListener("click",closeLightbox);
  document.getElementById("lbMinus").addEventListener("click",() => setZoom(zoom-.25));
  document.getElementById("lbPlus").addEventListener("click",() => setZoom(zoom+.25));
  document.getElementById("lbReset").addEventListener("click",() => setZoom(1));

  document.getElementById("lbPrev").addEventListener("click",() => {
    if (!photos.length) return;
    photoIndex = (photoIndex - 1 + photos.length) % photos.length;
    zoom = 1; panX = 0; panY = 0;
    updateLightbox();
    renderPhotos();
  });

  document.getElementById("lbNext").addEventListener("click",() => {
    if (!photos.length) return;
    photoIndex = (photoIndex + 1) % photos.length;
    zoom = 1; panX = 0; panY = 0;
    updateLightbox();
    renderPhotos();
  });

  document.getElementById("viewerClose").addEventListener("click",closeViewer);

  document.getElementById("lightbox").addEventListener("click",e => {
    if (e.target.id === "lightbox") closeLightbox();
  });

  document.getElementById("viewerModal").addEventListener("click",e => {
    if (e.target.id === "viewerModal") closeViewer();
  });

  document.addEventListener("keydown",e => {
    const lb = document.getElementById("lightbox");
    if (lb.classList.contains("open")) {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") document.getElementById("lbPrev").click();
      if (e.key === "ArrowRight") document.getElementById("lbNext").click();
      if (e.key === "+") setZoom(zoom+.25);
      if (e.key === "-") setZoom(zoom-.25);
    }
    if (document.getElementById("viewerModal").classList.contains("open") && e.key === "Escape") {
      closeViewer();
    }
  });

  const lbStage = document.getElementById("lbStage");
  const lbImage = document.getElementById("lbImage");

  lbStage.addEventListener("wheel",e => {
    if (!document.getElementById("lightbox").classList.contains("open")) return;
    e.preventDefault();
    setZoom(zoom + (e.deltaY < 0 ? .15 : -.15));
  },{passive:false});

  lbImage.addEventListener("pointerdown",e => {
    if (zoom <= 1) return;
    dragging = true;
    lbImage.classList.add("dragging");
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    startPanX = panX;
    startPanY = panY;
    lbImage.setPointerCapture(e.pointerId);
  });

  lbImage.addEventListener("pointermove",e => {
    if (!dragging) return;
    panX = startPanX + (e.clientX - dragStartX);
    panY = startPanY + (e.clientY - dragStartY);
    updateLightbox();
  });

  lbImage.addEventListener("pointerup",e => {
    dragging = false;
    lbImage.classList.remove("dragging");
    try { lbImage.releasePointerCapture(e.pointerId); } catch (_) {}
  });

  function startCountdown() {
    const node = document.getElementById("countdown");
    const end = first(
      car.auction?.auction_at,
      car.auction?.full_date,
      getSale(["AuctionDateTime"])
    );
    if (!node || !end) return;

    const target = new Date(end).getTime();
    if (Number.isNaN(target)) return;

    function tick() {
      const diff = target - Date.now();
      if (diff <= 0) {
        node.textContent = "teraz / zakończona";
        return;
      }

      const total = Math.floor(diff/1000);
      const days = Math.floor(total/86400);
      const hours = Math.floor((total%86400)/3600);
      const mins = Math.floor((total%3600)/60);
      const secs = total%60;

      node.textContent =
        `${days ? days+"d " : ""}${String(hours).padStart(2,"0")}:${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
    }

    tick();
    setInterval(tick,1000);
  }

  async function init() {
    if (!VIN && !LOT) {
      page.innerHTML = `<div class="error">Brak parametru VIN lub LOT w adresie strony.</div>`;
      return;
    }

    page.innerHTML = `
      <div class="panel empty">
        <div style="font-size:30px;margin-bottom:10px">⏳</div>
        Pobieranie danych samochodu...
      </div>
    `;

    try {
      car = await fetchVehicle();

      if (!car) throw new Error("Nie znaleziono samochodu.");

      photos = normalizeMedia(car);
      buildPage();
    } catch (error) {
      console.error("Rex.Bid car error:",error);
      page.innerHTML = `
        <div class="error">
          <strong style="display:block;color:#ff6d6d;font-size:18px;margin-bottom:8px">
            Nie udało się pobrać samochodu
          </strong>
          ${esc(error?.message || "Nieznany błąd")}
        </div>
      `;
    }
  }

  init();
</script>
</body>
</html>
