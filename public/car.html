<title>Rex.Bid — Samochód</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #15171a;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
}

.topbar {
    background: #111315;
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
}

.nav {
    max-width: 1400px;
    min-height: 72px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 30px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span,
.footer-logo span {
    color: #ffb400;
}

.menu {
    display: flex;
    gap: 22px;
    flex: 1;
}

.menu a {
    color: #d9dcdf;
    font-size: 14px;
    font-weight: 700;
}

.menu a:hover {
    color: white;
}

.back {
    color: #d9dcdf;
    font-size: 13px;
    font-weight: 700;
}

.container {
    max-width: 1350px;
    margin: 0 auto;
    padding: 35px 24px 70px;
}

.loading,
.error {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    padding: 50px 25px;
    text-align: center;
}

.loading strong,
.error strong {
    display: block;
    font-size: 20px;
    margin-bottom: 10px;
}

.error {
    color: #666;
}

/* HEADER */

.car-header {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 20px;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}

.platform {
    display: inline-block;
    background: #111315;
    color: white;
    padding: 6px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 900;
    margin-bottom: 8px;
}

.status {
    display: inline-block;
    margin-left: 8px;
    padding: 6px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 900;
}

.status.active {
    background: #e8f7ed;
    color: #17823b;
}

.status.upcoming {
    background: #fff4d8;
    color: #9a6800;
}

.status.ended {
    background: #eceef0;

}

.car-header h1 {
    margin: 4px 0 8px;
    font-size: 32px;
}

.subtitle {
    color: #70757b;

}

.favorite {
    border: 1px solid #d8dce0;
    background: white;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 800;

}

.favorite:hover {
    background: #f5f6f8;
}

.favorite.active {
    color: #e4002b;
}

/* MAIN */

.main-grid {
    display: grid;
    grid-template-columns: 1.45fr .75fr;
    gap: 20px;
    align-items: start;
}

/* GALLERY */

.gallery {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    overflow: hidden;
}

.main-image-wrap {
    height: 560px;
    background: #e9ebed;
    display: flex;
    align-items: center;
    justify-content: center;
}

.main-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.no-image {
    color: #777;
    font-weight: 700;
}

.thumbs {
    display: flex;
    gap: 8px;
    padding: 12px;
    overflow-x: auto;
    border-top: 1px solid #e0e3e6;
}

.thumb {
    width: 90px;
    height: 65px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    flex-shrink: 0;
    background: #eee;
}

.thumb:hover {
    border-color: #bbb;
}

.thumb.active {
    border-color: #ffb400;
}

/* INFO */

.info-card {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    padding: 22px;
}

.price-label {
    color: #777d83;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 5px;
}

.price {
    font-size: 38px;
    font-weight: 900;
    margin-bottom: 10px;
}

.auction-status {
    display: inline-block;
    margin-bottom: 15px;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 900;
}

.auction-status.active {
    background: #e8f7ed;
    color: #17823b;
}

.auction-status.upcoming {
    background: #fff4d8;
    color: #9a6800;
}

.auction-status.ended {
    background: #eceef0;
    color: #666;
}

.countdown {
    background: #111315;
    color: white;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 15px;
}

.countdown-label {
    color: #aeb3b8;
    font-size: 10px;
    font-weight: 800;
    margin-bottom: 5px;
    text-transform: uppercase;
}

.countdown-value {
    font-size: 21px;
    font-weight: 900;
}

.info-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid #eceef0;
    font-size: 14px;
}

.info-row:last-child {
    border-bottom: 0;
}

.info-label {
    color: #777d83;
}

.info-value {
    font-weight: 800;
    text-align: right;
}

.auction-button {
    display: block;

    margin-top: 18px;
    background: #ffb400;

}

.auction-button:hover {
    background: #ffc431;
}

/* SECTIONS */

.details {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    margin-top: 20px;
    padding: 25px;
}

.details h2 {

}

.details-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;

}

.detail {

}

.detail-label {

}

.detail-value {

}

/* AUCTION DATA */

.auction-data-grid {

    grid-template-columns: repeat(4, 1fr);

}

.auction-box {
    border: 1px solid #e2e5e8;

    background: #fafbfc;
}

.auction-box-label {

.auction-box-value {

/* LOCATION */

.location-row {

}

.location-row:last-child {

}

.location-label {

}

.location-value {

/* BADGES */

.badges {
    display: flex;

    gap: 8px;
    margin-bottom: 18px;
}

.badge {
    padding: 7px 10px;
    border-radius: 6px;
    background: #f0f2f4;
    color: #444;
    font-size: 11px;
    font-weight: 900;
}

.badge.good {
    background: #e8f7ed;

}

.badge.warning {
    background: #fff4d8;
    color: #9a6800;
}

/* VIDEO */

.video-box {
    border: 1px solid #e2e5e8;
    border-radius: 8px;
    padding: 18px;
}

.video-box p {
    margin: 0 0 12px;
    color: #666;

.video-button {

.video-button:hover {

/* HISTORY */

.history {

.history-empty {

.history-table {

/* FOOTER */

footer {

}

.footer-inner {
    max-width: 1300px;
    margin: 0 auto;
}

.footer-logo {
    color: white;

.copyright {

/* MOBILE */

@media (max-width: 1000px) {

    .main-grid {

    .header-top {

    }

}

<script>

/* =========================================================
   PODSTAWOWE FUNKCJE
========================================================= */

function safe(value, fallback = "—") {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    return value;
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function displayValue(value, fallback = "—") {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    if (
        typeof value === "string" ||
        typeof value === "number" ||
        typeof value === "boolean"
    ) {
        return String(value);
    }

    if (Array.isArray(value)) {

        return value
            .map(item => displayValue(item, ""))
            .filter(Boolean)
            .join(", ") || fallback;
    }

    if (typeof value === "object") {

        const preferred = [
            "name",
            "value",
            "display",
            "label",
            "description",
            "text",
            "type",
            "title"
        ];

        for (const key of preferred) {

            if (
                value[key] !== undefined &&
                value[key] !== null &&
                value[key] !== ""
            ) {
                return displayValue(
                    value[key],
                    fallback
                );
            }
        }

        const values =
            Object.values(value)
                .map(item => displayValue(item, ""))
                .filter(Boolean);

        if (values.length) {
            return values.join(", ");
        }

        return fallback;
    }

    return fallback;
}


function money(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    if (typeof value === "object") {

        value =
            value.amount ??
            value.value ??
            value.usd ??
            value.price ??
            null;
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return displayValue(value);
    }

    return "$" +
        number.toLocaleString("en-US");
}


/* =========================================================
   CENA
========================================================= */

function getPrice(car) {

    const candidates = [

        car.pricing?.current_bid_usd,
        car.pricing?.current_bid2_usd,
        car.current_bid_usd,
        car.current_bid,
        car.price,
        car.sale_price,
        car.bid

    ];

    for (const value of candidates) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {
            return value;
        }
    }

    return null;
}


/* =========================================================
   PRZEBIEG
========================================================= */

function getMileage(car) {

    const value =
        car.odometer?.mi ??
        car.odometer?.miles ??
        car.odometer ??
        car.mileage ??
        car.miles;

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    const number = Number(value);

    if (Number.isFinite(number)) {

        return number.toLocaleString("en-US") +
            " mi";
    }

    return displayValue(value);
}


/* =========================================================
   DANE POJAZDU
========================================================= */

function getDamage(car) {

    return displayValue(
        car.condition?.primary_damage ??
        car.damage ??
        car.primary_damage ??
        car.damage_type
    );
}


function getSecondaryDamage(car) {

    return displayValue(
        car.condition?.secondary_damage ??
        car.secondary_damage
    );
}


function getRunCondition(car) {

    return displayValue(
        car.condition?.run_condition?.label ??
        car.condition?.run_condition?.value ??
        car.condition?.status ??
        car.run_cond ??
        car.details?.vehicle_information?.StartCode
    );
}


function getLocation(car) {

    return displayValue(
        car.location?.display ??
        car.location?.name ??
        car.location ??
        car.city
    );
}


function getFuel(car) {

    return displayValue(
        car.vehicle_specs?.fuel_type ??
        car.fuel_type ??
        car.engine?.fuel_type ??
        car.fuel
    );
}


function getTransmission(car) {

    return displayValue(
        car.vehicle_specs?.transmission ??
        car.transmission ??
        car.specs?.transmission ??
        car.transmission_type
    );
}


function getDrive(car) {

    return displayValue(
        car.vehicle_specs?.drive_type ??
        car.drive_type ??
        car.specs?.drive_type ??
        car.drive
    );
}


function getEngine(car) {

    return displayValue(
        car.vehicle_specs?.engine?.raw ??
        car.vehicle_specs?.engine?.description ??
        car.vehicle_specs?.engine?.name ??
        car.engine?.description ??
        car.engine?.name ??
        car.engine
    );
}


function getBodyType(car) {

    return displayValue(
        car.vehicle_specs?.body_style ??
        car.body_type ??
        car.body?.type ??
        car.body_style
    );
}


function getColor(car) {

    return displayValue(
        car.vehicle_specs?.exterior_color ??
        car.color ??
        car.exterior_color ??
        car.colors?.exterior
    );
}


function getLot(car) {

    return displayValue(
        car.lot_number ??
        car.lot ??
        car.lot_id ??
        car.lotNumber
    );
}


function hasKey(car) {

    const value =
        car.condition?.has_key ??
        car.keys ??
        car.key ??
        car.has_keys ??
        car.details?.attributes?.Keys;

    if (value === true || value === "True") {
        return "Present";
    }

    if (value === false || value === "False") {
        return "Brak";
    }

    return displayValue(value);
}


function getPlatform(car) {

    return displayValue(
        car.platform ??
        car.auction?.platform ??
        car.source
    );
}


/* =========================================================
   DATA AUKCJI
========================================================= */

function getAuctionDate(car) {

    return (
        car.auction?.auction_at ??
        car.auction?.full_date ??
        car.auction?.ad ??
        car.ad ??
        car.auction_date ??
        car.sale_date ??
        car.details?.sale_information?.AuctionDateTime ??
        null
    );
}


function getAuctionState(car) {

    const state =
        String(
            car.auction?.state ??
            car.lot_status ??
            car.status ??
            car.auction_status ??
            ""
        ).toLowerCase();

    if (
        state === "open" ||
        state === "active" ||
        state === "live"
    ) {
        return {
            key: "active",
            label: "AKTYWNA AUKCJA"
        };
    }

    if (
        state.includes("sold") ||
        state.includes("ended") ||
        state.includes("closed") ||
        state.includes("completed")
    ) {
        return {
            key: "ended",
            label: "AUKCJA ZAKOŃCZONA"
        };
    }

    if (
        state.includes("upcoming") ||
        state.includes("future") ||
        state.includes("scheduled")
    ) {
        return {
            key: "upcoming",
            label: "NADCHODZĄCA AUKCJA"
        };
    }

    const dateValue = getAuctionDate(car);

    if (dateValue) {

        const date = parseDateValue(dateValue);

        if (date && date.getTime() > Date.now()) {

            return {
                key: "upcoming",
                label: "NADCHODZĄCA AUKCJA"
            };
        }
    }

    return {
        key: "active",
        label: "AKTYWNA AUKCJA"
    };
}


/* =========================================================
   DATY
========================================================= */

function parseDateValue(value) {

    if (!value) {
        return null;
    }

    if (value instanceof Date) {
        return value;
    }

    let text = String(value).trim();

    /*
     * API może zwracać:
     * 2026-09-21T13:30:00+00:00
     */

    text = text.replace(
        /([+-]\d{2}):(\d{2})$/,
        "$1$2"
    );

    let date = new Date(text);

    if (!Number.isNaN(date.getTime())) {
        return date;
    }

    /*
     * Obsługa formatu:
     * 09/21/2026 13:30:00 +00:00
     */

    const match =
        String(value).match(
            /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/
        );

    if (match) {

        return new Date(
            Number(match[3]),
            Number(match[1]) - 1,
            Number(match[2]),
            Number(match[4]),
            Number(match[5]),
            Number(match[6])
        );
    }

    return null;
}


function formatDate(value) {

    if (!value) {
        return "—";
    }

    const date = parseDateValue(value);

    if (!date) {
        return displayValue(value);
    }

    return date.toLocaleString(
        "pl-PL",
        {
            year: "numeric",
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   TYTUŁ
========================================================= */

function carTitle(car) {

    if (car.title) {
        return car.title;
    }

    return (
        safe(car.year, "") +
        " " +
        safe(car.make, "") +
        " " +
        safe(car.model, "")
    ).trim();
}


/* =========================================================
   ZDJĘCIA
========================================================= */

function cleanMediaUrl(value) {

    if (!value) {
        return null;
    }

    let url = String(value).trim();

    /*
     * API w tym przypadku zwracało czasami markdown:
     *
     * [https://...](https://...)
     *
     * Wyciągamy właściwy URL.
     */

    const markdownMatch =
        url.match(
            /^\[.*?\]\((.*?)\)$/
        );

    if (markdownMatch) {
        url = markdownMatch[1];
    }

    /*
     * Naprawiamy escaped ampersandy/backslashe.
     */

    url = url
        .replace(/\\&/g, "&")
        .replace(/\\~/g, "~")
        .replace(/\\\\/g, "\\");

    return url;
}


function getImages(car) {

    let images = [];

    if (
        car.media &&
        Array.isArray(car.media.items)
    ) {

        car.media.items.forEach(item => {

            if (
                item &&
                item.type === "image"
            ) {

                const url =
                    item.large ??
                    item.thumb ??
                    item.url ??
                    item.src;

                const clean =
                    cleanMediaUrl(url);

                if (clean) {
                    images.push(clean);
                }
            }
        });
    }


    if (
        car.media &&
        Array.isArray(car.media.thumbs)
    ) {

        car.media.thumbs.forEach(image => {

            const clean =
                cleanMediaUrl(image);

            if (clean) {
                images.push(clean);
            }
        });
    }


    if (Array.isArray(car.images)) {

        car.images.forEach(image => {

            let url = image;

            if (typeof image === "object") {

                url =
                    image.large ??
                    image.url ??
                    image.src ??
                    image.image_url ??
                    image.medium ??
                    image.thumbnail;
            }

            const clean =
                cleanMediaUrl(url);

            if (clean) {
                images.push(clean);
            }
        });
    }


    if (
        car.photos &&
        Array.isArray(car.photos)
    ) {

        car.photos.forEach(image => {

            const clean =
                cleanMediaUrl(
                    typeof image === "object"
                        ? (
                            image.large ??
                            image.url ??
                            image.src
                        )
                        : image
                );

            if (clean) {
                images.push(clean);
            }
        });
    }


    return [
        ...new Set(images)
    ];
}


/* =========================================================
   VIDEO
========================================================= */

function getVideoUrl(car) {

    if (
        car.media &&
        Array.isArray(car.media.items)
    ) {

        const video =
            car.media.items.find(
                item =>
                    item &&
                    item.type === "video"
            );

        if (video) {

            return cleanMediaUrl(
                video.url
            );
        }
    }

    return cleanMediaUrl(
        car.media?.video ??
        car.video_url ??
        car.engine_video_url
    );
}

function getFavorites() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "rex_bid_favorites"
            ) || "[]"
        );

    } catch {

        return [];
    }
}


function saveFavorites(items) {

    localStorage.setItem(
        "rex_bid_favorites",
        JSON.stringify(items)
    );
}


function toggleFavorite(vin) {

    if (!vin) {
        return;
    }

    let favorites =
        getFavorites();

    if (
        favorites.includes(vin)
    ) {

        favorites =
            favorites.filter(
                item => item !== vin
            );

    } else {

        favorites.push(vin);
    }

    saveFavorites(favorites);

    renderFavoriteButton(vin);
}


function renderFavoriteButton(vin) {

    const button =
        document.getElementById(
            "favoriteButton"
        );

    if (!button) {
        return;
    }

    const active =
        getFavorites()
            .includes(vin);

    button.classList.toggle(
        "active",
        active
    );

    button.textContent =
        active
            ? "♥ Usuń z ulubionych"

/* =========================================================

========================================================= */

let countdownTimer = null;


function startCountdown(targetValue) {

    if (countdownTimer) {

        clearInterval(
            countdownTimer
        );
    }

    const target =
        parseDateValue(targetValue);

    const element =
        document.getElementById(
            "countdownValue"
        );

    if (!target || !element) {
        return;
    }


    function update() {

        const diff =
            target.getTime() -
            Date.now();

        if (diff <= 0) {

            element.textContent =
                "Aukcja rozpoczęta";

            clearInterval(
                countdownTimer
            );

            return;
        }

        const totalSeconds =
            Math.floor(
                diff / 1000
            );

        const days =
            Math.floor(
                totalSeconds / 86400
            );

        const hours =
            Math.floor(
                (totalSeconds % 86400) /
                3600
            );

        const minutes =
            Math.floor(
                (totalSeconds % 3600) /
                60
            );

        const seconds =
            totalSeconds % 60;


        if (days > 0) {

            element.textContent =
                `${days} dni ${hours} godz. ${minutes} min.`;

        } else {

            element.textContent =
                `${hours} godz. ${minutes} min. ${seconds} sek.`;
        }
    }


    update();

    countdownTimer =
        setInterval(
            update,
            1000
        );
}

/* =========================================================
   ZMIANA ZDJĘCIA
========================================================= */

function changeImage(image, element) {

    const main =
        document.getElementById(
            "mainImage"
        );

    if (main) {

        main.src =
            image;
    }


    document
        .querySelectorAll(".thumb")
        .forEach(
            thumb =>
                thumb.classList.remove(
                    "active"
                )
        );


    if (element) {

        element.classList.add(
            "active"
        );
    }
}


/* =========================================================
   API
========================================================= */

async function loadCar() {

    const app =
        document.getElementById(
            "app"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const vin =
        params.get("vin");


    if (!vin) {

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie znaleziono samochodu
                </strong>

                Brak numeru VIN w adresie.

            </div>

        `;

        return;
    }


    try {

        /*
         * NIE ZMIENIAMY TEGO ENDPOINTU.
         *
         * Działa:
         *
         * /api/cars?s=VIN
         */

        const response =
            await fetch(
                "/api/cars?s=" +
                encodeURIComponent(vin),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Błąd HTTP " +
                response.status
            );
        }


        const result =
            await response.json();


        if (!result.ok) {

            throw new Error(
                result.error ||
                "Błąd API"
            );
        }


        const cars =
            Array.isArray(result.data)
                ? result.data
                : [];


        const car =
            cars.find(
                item =>
                    String(
                        item.vin ??
                        item.VIN ??
                        ""
                    ).toUpperCase() ===
                    String(vin)
                        .toUpperCase()
            ) ||
            cars[0];


        if (!car) {

            app.innerHTML = `

                <div class="error">

                    <strong>
                        Nie znaleziono samochodu
                    </strong>

                    Oferta nie jest dostępna.

                </div>

            `;

            return;
        }


        renderCar(car);


    } catch (error) {

        console.error(
            "Rex.Bid car.html:",
            error
        );


        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie udało się pobrać samochodu
                </strong>

                <div style="margin-top:10px;">
                    Wystąpił problem z połączeniem z API.
                </div>

                <div
                    style="
                        margin-top:12px;
                        font-size:12px;
                        color:#999;
                    "
                >
                    ${escapeHtml(
                        error.message
                    )}
                </div>

            </div>

        `;
    }
}


/* =========================================================
   START
========================================================= */

loadCar();

</script>
