<style>

* {

}

body {

    background: #f5f6f8;

}

a {

button,

.logo {

.menu {

}

}

.status.upcoming {

}

}

.car-header h1 {

}

.favorite {

.favorite:hover {

}

/* =========================
   COUNTDOWN
========================= */

.countdown-box {

    border-radius: 10px;

    display: flex;

    color: #aeb4ba;

}

.countdown-date {
    font-size: 13px;

}

.countdown.active {

   MAIN
========================= */

.main-grid {

}

.gallery {

.auction-status.active {

.auction-button {

.auction-button:hover {

/* =========================

.details {

.details h2 {

.details-grid {

<script>

/* =========================================================
   PODSTAWOWE FUNKCJE
========================================================= */

function safe(value, fallback = "—") {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    return value;
}


function displayValue(value, fallback = "—") {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    if (
        typeof value === "string" ||
        typeof value === "number" ||
        typeof value === "boolean"
    ) {
        return String(value);
    }

    if (Array.isArray(value)) {

        return value
            .map(item => displayValue(item, ""))
            .filter(Boolean)
            .join(", ") || fallback;
    }

    if (typeof value === "object") {

        const preferred = [
            "name",
            "value",
            "display",
            "label",
            "description",
            "text",
            "type",
            "title"
        ];

        for (const key of preferred) {

            if (
                value[key] !== undefined &&
                value[key] !== null &&
                value[key] !== ""
            ) {

                return displayValue(
                    value[key],
                    fallback
                );
            }
        }

        const values =
            Object.values(value)
                .map(item =>
                    displayValue(item, "")
                )
                .filter(Boolean);

        if (values.length) {
            return values.join(", ");
        }

        return fallback;
    }

    return fallback;
}


/* =========================================================
   CENA
========================================================= */

function money(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    if (typeof value === "object") {

        value =
            value.amount ??
            value.value ??
            value.usd ??
            value.price ??
            null;
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return displayValue(value);
    }

    return "$" +
        number.toLocaleString("en-US");
}


function getPrice(car) {

    const candidates = [

        car.pricing?.current_bid_usd,
        car.pricing?.current_bid2_usd,
        car.current_bid_usd,
        car.current_bid,
        car.price,
        car.sale_price,
        car.bid

    ];

    for (const value of candidates) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            return value;
        }
    }

    return null;
}


/* =========================================================
   PRZEBIEG
========================================================= */

function getMileage(car) {

    const candidates = [

        car.odometer?.mi,
        car.odometer?.miles,
        car.odometer,
        car.mileage,
        car.miles

    ];

    for (const value of candidates) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            if (typeof value === "object") {

                const number =
                    value.mi ??
                    value.miles ??
                    value.value;

                if (number !== undefined) {

                    return Number(number)
                        .toLocaleString("en-US") +
                        " mi";
                }
            }

            if (!isNaN(Number(value))) {

                return Number(value)
                    .toLocaleString("en-US") +
                    " mi";
            }

            return displayValue(value);
        }
    }

    return "—";
}


/* =========================================================
   DANE SAMOCHODU
========================================================= */

function getDamage(car) {

    return displayValue(
        car.condition?.primary_damage ??
        car.details?.vehicle_information?.PrimaryDamage ??
        car.primary_damage ??
        car.damage ??
        car.damage_type
    );
}


function getLocation(car) {

    return displayValue(
        car.location?.display ??
        car.details?.sale_information?.SellingBranch ??
        car.details?.attributes?.BranchName ??
        car.location?.name ??
        car.location ??
        car.city
    );
}


function getFuel(car) {

    return displayValue(
        car.vehicle_specs?.fuel_type ??
        car.details?.vehicle_description?.FuelType ??
        car.fuel_type ??
        car.engine?.fuel_type ??
        car.fuel
    );
}


function getTransmission(car) {

    return displayValue(
        car.vehicle_specs?.transmission ??
        car.details?.vehicle_description?.Transmission ??
        car.transmission ??
        car.specs?.transmission ??
        car.transmission_type
    );
}


function getDrive(car) {

    return displayValue(
        car.vehicle_specs?.drive_type ??
        car.details?.vehicle_description?.DriveLineType ??
        car.drive_type ??
        car.specs?.drive_type ??
        car.drive
    );
}


function getEngine(car) {

    return displayValue(
        car.vehicle_specs?.engine?.raw ??
        car.vehicle_specs?.engine?.description ??
        car.details?.vehicle_description?.Engine ??
        car.engine?.description ??
        car.engine?.name ??
        car.engine?.type ??
        car.engine
    );
}


function getBodyType(car) {

    return displayValue(
        car.vehicle_specs?.body_style ??
        car.details?.vehicle_description?.BodyStyle ??
        car.body_type ??
        car.body?.type ??
        car.body_style
    );
}


function getColor(car) {

    return displayValue(
        car.vehicle_specs?.exterior_color ??
        car.details?.attributes?.ExteriorColor ??
        car.color ??
        car.exterior_color ??
        car.colors?.exterior
    );
}


function getLot(car) {

    return displayValue(
        car.lot_number ??
        car.lot ??
        car.lot_number ??
        car.lot_id ??
        car.lotNumber ??
        car.details?.attributes?.StockNumber
    );
}


function getKeys(car) {

    const value =
        car.condition?.has_key ??
        car.details?.vehicle_information?.KeySlashFob ??
        car.details?.attributes?.Keys ??
        car.keys ??
        car.key ??
        car.has_keys;

    if (value === true || value === "True") {
        return "Obecny";
    }

    if (value === false || value === "False") {
        return "Brak";
    }

    return displayValue(value);
}


function getRunCondition(car) {

    return displayValue(
        car.condition?.run_condition?.label ??
        car.condition?.run_condition?.value ??
        car.details?.vehicle_information?.StartCode ??
        car.details?.attributes?.StartsDesc ??
        car.run_cond
    );
}


/* =========================================================
   DATA AUKCJI
========================================================= */

function getAuctionDate(car) {

    return (
        car.auction?.full_date ??
        car.auction?.auction_at ??
        car.auction_date ??
        car.details?.sale_information?.AuctionDateTime ??
        car.details?.attributes?.AuctionDateTime ??
        car.sale_date ??
        null
    );
}


function getAuctionDateObject(car) {

    const value = getAuctionDate(car);

    if (!value) {
        return null;
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return null;
    }

    return date;
}


function formatDate(value) {

    if (!value) {
        return "—";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return displayValue(value);
    }

    return date.toLocaleString(
        "pl-PL",
        {
            year: "numeric",
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   STATUS AUKCJI
========================================================= */

function getStatus(car) {

    const raw =
        String(
            car.auction?.state ??
            car.lot_status ??
            car.status ??
            car.auction_status ??
            car.sale_status ??
            ""
        ).toLowerCase();

    if (
        raw.includes("sold") ||
        raw.includes("ended") ||
        raw.includes("closed") ||
        raw.includes("completed")
    ) {

        return {
            key: "ended",
            label: "AUKCJA ZAKOŃCZONA"
        };
    }

    const auctionDate =
        getAuctionDateObject(car);

    if (auctionDate) {

        const now = Date.now();

        if (auctionDate.getTime() > now) {

            return {
                key: "upcoming",
                label: "NADCHODZĄCA AUKCJA"
            };
        }
    }

    if (
        raw === "open" ||
        raw.includes("active") ||
        raw.includes("live")
    ) {

        return {
            key: "active",
            label: "AKTYWNA AUKCJA"
        };
    }

    if (auctionDate) {

        return {
            key: "active",
            label: "AKTYWNA AUKCJA"
        };
    }

    return {
        key: "active",
        label: "AKTYWNA AUKCJA"
    };
}


/* =========================================================
   TYTUŁ
========================================================= */

function carTitle(car) {

    if (car.title) {
        return car.title;
    }

    return (
        safe(car.year, "") +
        " " +
        safe(car.make, "") +
        " " +
        safe(car.model, "")
    ).trim();
}


/* =========================================================
   ZDJĘCIA
========================================================= */

function cleanMediaUrl(value) {

    if (!value) {
        return null;
    }

    let url = String(value).trim();

    /*
     * API czasami zwraca URL jako markdown:
     *
     * [https://...](https://...)
     *
     * Wyciągamy wtedy właściwy adres.
     */

    const markdownMatch =
        url.match(
            /^\[.*?\]\((.*?)\)$/
        );

    if (markdownMatch) {
        url = markdownMatch[1];
    }

    /*
     * Usuwamy ewentualne backslashe
     * dodane podczas serializacji.
     */

    url = url
        .replace(/\\~/g, "~")
        .replace(/\\&/g, "&")
        .replace(/\\=/g, "=")
        .replace(/\\\?/g, "?")
        .replace(/\\\//g, "/");

    return url;
}


function getImages(car) {

    let images = [];

    /*
     * Główne pole images
     */

    if (Array.isArray(car.images)) {

        images = [
            ...images,
            ...car.images
        ];
    }

    /*
     * media.thumbs
     */

    if (
        car.media &&
        Array.isArray(car.media.thumbs)
    ) {

        images = [
            ...images,
            ...car.media.thumbs
        ];
    }

    /*
     * media.items
     */

    if (
        car.media &&
        Array.isArray(car.media.items)
    ) {

        images = [
            ...images,
            ...car.media.items
        ];
    }

    /*
     * photos
     */

    if (
        car.photos &&
        Array.isArray(car.photos)
    ) {

        images = [
            ...images,
            ...car.photos
        ];
    }

    images =
        images
            .map(image => {

                if (
                    typeof image === "string"
                ) {

                    return cleanMediaUrl(image);
                }

                if (
                    typeof image === "object"
                ) {

                    return cleanMediaUrl(
                        image.large ??
                        image.url ??
                        image.src ??
                        image.image_url ??
                        image.medium ??
                        image.thumb ??
                        image.thumbnail
                    );
                }

                return null;
            })
            .filter(Boolean);

    /*
     * Bardzo ważne:
     * usuwamy duplikaty.
     *
     * Dzięki temu jeśli API zwróci
     * 11 zdjęć w thumbs + te same 11
     * w items, strona pokaże tylko 11.
     */

    return [
        ...new Set(images)
    ];
}


/* =========================================================
   VIDEO
========================================================= */

function getVideoUrl(car) {

    if (
        car.media &&
        Array.isArray(car.media.items)
    ) {

        const video =
            car.media.items.find(
                item =>
                    item &&
                    item.type === "video" &&
                    item.url
            );

        if (video) {
            return cleanMediaUrl(video.url);
        }
    }

    if (
        car.media &&
        car.media.video
    ) {

        return cleanMediaUrl(
            car.media.video.url ??
            car.media.video
        );
    }

    return null;
}


/* =========================================================
   ULUBIONE
========================================================= */

function getFavorites() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "rex_bid_favorites"
            ) || "[]"
        );

    } catch {

        return [];
    }
}


function saveFavorites(items) {

function toggleFavorite(vin) {

    if (!vin) return;

    let favorites =
        getFavorites();

    if (
        favorites.includes(vin)
    ) {

        favorites =
            favorites.filter(
                item => item !== vin
            );

    } else {

        favorites.push(vin);
    }

    saveFavorites(favorites);

    renderFavoriteButton(vin);
}


function renderFavoriteButton(vin) {

    const button =
        document.getElementById(
            "favoriteButton"

    if (!button) return;

    const active =
        getFavorites()
            .includes(vin);

    button.classList.toggle(
        "active",
        active

        active

/* =========================================================
   COUNTDOWN
========================================================= */

let countdownTimer = null;


function formatCountdown(milliseconds) {

    if (milliseconds <= 0) {
        return "00:00:00";
    }

    const totalSeconds =
        Math.floor(
            milliseconds / 1000
        );

    const days =
        Math.floor(
            totalSeconds / 86400
        );

    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;

    const h =
        String(hours)
            .padStart(2, "0");

    const m =
        String(minutes)
            .padStart(2, "0");

    const s =
        String(seconds)
            .padStart(2, "0");

    if (days > 0) {

        return (
            days +
            " dni " +
            h +
            ":" +
            m +
            ":" +
            s
        );
    }

    return (
        h +
        ":" +
        m +
        ":" +
        s
    );
}


function updateCountdown(auctionDate) {

    const countdown =
        document.getElementById(
            "countdown"
        );

    const countdownLabel =
        document.getElementById(
            "countdownLabel"
        );

    const countdownDate =
        document.getElementById(
            "countdownDate"
        );

    if (
        !countdown ||
        !auctionDate
    ) {
        return;
    }

    const target =
        new Date(auctionDate);

    if (
        Number.isNaN(
            target.getTime()
        )
    ) {

        countdown.textContent =
            "Brak danych";

        return;
    }

    function tick() {

        const now =
            Date.now();

        const difference =
            target.getTime() - now;

        if (difference > 0) {

            countdown.classList.add(
                "active"
            );

            countdown.classList.remove(
                "finished"
            );

            countdown.textContent =
                formatCountdown(
                    difference
                );

            if (countdownLabel) {

                countdownLabel.textContent =
                    "AUKCJA ROZPOCZNIE SIĘ ZA";
            }

            return;
        }

        countdown.classList.remove(
            "active"
        );

        countdown.classList.add(
            "finished"
        );

        countdown.textContent =
            "00:00:00";

        if (countdownLabel) {

            countdownLabel.textContent =
                "AUKCJA POWINNA JUŻ TRWAĆ";
        }
    }

    tick();

    if (countdownTimer) {

        clearInterval(
            countdownTimer
        );
    }

    countdownTimer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================

function changeImage(image, element) {

    const main =
        document.getElementById(

    document
        .querySelectorAll(".thumb")

        element.classList.add(

    }
}

/* =========================================================
   POBIERANIE SAMOCHODU
========================================================= */

async function loadCar() {

    const app =
        document.getElementById(
            "app"
        );

    const params =
        new URLSearchParams(
            window.location.search
        );

    const vin =
        params.get("vin");


    if (!vin) {

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie znaleziono samochodu
                </strong>

                Brak numeru VIN w adresie.

            </div>

        `;

        return;
    }


    try {

        /*
         * TEN ENDPOINT ZOSTAWIAMY.
         *
         * To jest endpoint, który już
         * wcześniej działał:
         *
         * /api/cars?s=VIN
         */

        const response =
            await fetch(
                "/api/cars?s=" +
                encodeURIComponent(vin),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Błąd HTTP " +
                response.status
            );
        }


        const result =
            await response.json();


        if (!result.ok) {

            throw new Error(
                result.error ||
                "Błąd API"
            );
        }


        const cars =
            Array.isArray(result.data)
                ? result.data
                : [];


        const wantedVin =
            String(vin)
                .trim()
                .toUpperCase();


        const car =
            cars.find(
                item =>
                    String(
                        item.vin ??
                        item.VIN ??
                        ""
                    )
                    .trim()
                    .toUpperCase() ===
                    wantedVin
            ) ||
            cars[0];


        if (!car) {

            app.innerHTML = `

                <div class="error">

                    <strong>
                        Nie znaleziono samochodu
                    </strong>

                    Oferta nie jest dostępna.

                </div>

            `;

            return;
        }


        renderCar(car);


    } catch (error) {

        console.error(
            "Rex.Bid car.html:",
            error
        );

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie udało się pobrać samochodu
                </strong>

                Wystąpił problem
                z połączeniem z API.

                <br><br>

                <small>
                    ${displayValue(
                        error?.message,
                        "Nieznany błąd"
                    )}
                </small>

            </div>

        `;
    }
}
