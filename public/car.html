<head>

<title>Rex.Bid — Samochód</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #15171a;
}

a {

}

.topbar {
    background: #111315;
    color: white;

    top: 0;

.nav {
    max-width: 1400px;

    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;

.logo {

}

.logo span {

}

.menu {
    display: flex;

}

.menu a {

}

.back {

}

.container {

.loading,

}

.header-top {

}

    background: #111315;

    padding: 6px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 900;
    margin-bottom: 10px;
}

.status {
    display: inline-block;
    margin-left: 8px;
    padding: 6px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 900;
}

.status.active {

}

.status.upcoming {
    background: #fff4d8;

}

.status.ended {

}

.car-header h1 {

}

.subtitle {

.favorite {

    background: white;
    border-radius: 8px;
    padding: 11px 16px;

    font-weight: 800;
}

.favorite.active {
    color: #e4002b;
}

.main-grid {
    display: grid;
    grid-template-columns: 1.4fr .8fr;
    gap: 20px;
}

.gallery {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;

}

.main-image {

}

.thumbs {

}

.thumb {

    height: 65px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    flex-shrink: 0;
}

.thumb.active {

}

.info-card {

    border: 1px solid #e0e3e6;
    border-radius: 12px;
    padding: 22px;
}

.price-label {
    color: #777d83;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 5px;
}

.price {

    font-weight: 900;

}

.auction-status {

    margin-bottom: 14px;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 900;
}

.auction-status.active {

}

.auction-status.upcoming {

.info-row {

.details {

.details-grid {

.detail {

.detail-label {

.detail-value {

.auction-button {

.media-section {

.media-buttons {

.media-button {

}

.media-button:hover {

.video-box {

.video-box video {

.history {

.history-empty {

.history-table {

.history-table th,

footer {

}

.footer-inner {

}

.footer-logo {

.footer-logo span {

}

.copyright {

@media (max-width: 900px) {

    }

}

@media (max-width: 600px) {

    }

    }

    .countdown-time {

    }
}

<script>

function safe(value, fallback = "—") {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    return value;
}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function displayValue(value, fallback = "—") {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    if (
        typeof value === "string" ||
        typeof value === "number" ||
        typeof value === "boolean"
    ) {
        return escapeHtml(String(value));
    }

    if (Array.isArray(value)) {

        return value
            .map(item => displayValue(item, ""))
            .filter(Boolean)
            .join(", ") || fallback;
    }

    if (typeof value === "object") {

        const preferred = [
            "name",
            "value",
            "display",
            "label",
            "description",
            "text",
            "type",
            "title",
            "raw"
        ];

        for (const key of preferred) {

            if (
                value[key] !== undefined &&
                value[key] !== null &&
                value[key] !== ""
            ) {

                return displayValue(
                    value[key],
                    fallback
                );
            }
        }

        const values =
            Object.values(value)
                .map(item =>
                    displayValue(item, "")
                )
                .filter(Boolean);

        if (values.length) {
            return values.join(", ");
        }

        return fallback;
    }

    return fallback;
}


function money(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    if (typeof value === "object") {

        value =
            value.amount ??
            value.value ??
            value.usd ??
            value.price ??
            null;
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return displayValue(value);
    }

    return "$" +
        number.toLocaleString("en-US");
}


function getPrice(car) {

    const candidates = [

        car.pricing?.current_bid_usd,
        car.pricing?.current_bid2_usd,
        car.pricing?.current_bid,
        car.current_bid_usd,
        car.current_bid,
        car.price,
        car.sale_price,
        car.bid

    ];

    for (const value of candidates) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {
            return value;
        }
    }

    return null;
}


function getMileage(car) {

    const candidates = [

        car.odometer?.mi,
        car.odometer?.miles,
        car.odometer,
        car.mileage,
        car.miles,
        car.details?.vehicle_information?.Odometer

    ];

    for (const value of candidates) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            if (typeof value === "object") {

                const number =
                    value.mi ??
                    value.miles ??
                    value.value;

                if (number !== undefined) {

                    return Number(number)
                        .toLocaleString("en-US") +
                        " mi";
                }
            }

            const cleaned =
                String(value)
                    .replace(/,/g, "")
                    .match(/[\d.]+/);

            if (cleaned) {

                return Number(cleaned[0])
                    .toLocaleString("en-US") +
                    " mi";
            }

            return displayValue(value);
        }
    }

    return "—";
}


function getDamage(car) {

    return displayValue(
        car.condition?.primary_damage ??
        car.damage ??
        car.primary_damage ??
        car.damage_type ??
        car.details?.vehicle_information?.PrimaryDamage
    );
}


function getSecondaryDamage(car) {

    return displayValue(
        car.condition?.secondary_damage ??
        car.secondary_damage ??
        car.details?.attributes?.SecondaryDamageDesc
    );
}


function getLocation(car) {

    return displayValue(
        car.location?.display ??
        car.location?.name ??
        car.location ??
        car.city ??
        car.details?.sale_information?.SellingBranch
    );
}


function getFuel(car) {

    return displayValue(
        car.vehicle_specs?.fuel_type ??
        car.fuel_type ??
        car.engine?.fuel_type ??
        car.fuel ??
        car.details?.vehicle_description?.FuelType
    );
}


function getTransmission(car) {

    return displayValue(
        car.vehicle_specs?.transmission ??
        car.transmission ??
        car.specs?.transmission ??
        car.transmission_type ??
        car.details?.vehicle_description?.Transmission
    );
}


function getDrive(car) {

    return displayValue(
        car.vehicle_specs?.drive_type ??
        car.drive_type ??
        car.specs?.drive_type ??
        car.drive ??
        car.details?.vehicle_description?.DriveLineType
    );
}


function getEngine(car) {

    return displayValue(
        car.vehicle_specs?.engine?.raw ??
        car.vehicle_specs?.engine?.description ??
        car.vehicle_specs?.engine?.name ??
        car.vehicle_specs?.engine?.type ??
        car.engine ??
        car.details?.vehicle_description?.Engine
    );
}


function getBodyType(car) {

    return displayValue(
        car.vehicle_specs?.body_style ??
        car.body_style ??
        car.body_type ??
        car.body?.type ??
        car.details?.vehicle_description?.BodyStyle
    );
}


function getColor(car) {

    return displayValue(
        car.vehicle_specs?.exterior_color ??
        car.color ??
        car.exterior_color ??
        car.colors?.exterior ??
        car.details?.vehicle_description?.ExteriorInterior
    );
}


function getCylinders(car) {

    return displayValue(
        car.vehicle_specs?.engine?.cylinders ??
        car.cylinders ??
        car.details?.vehicle_description?.Cylinders
    );
}


function getKeys(car) {

    const value =
        car.condition?.has_key ??
        car.keys ??
        car.key ??
        car.has_keys ??
        car.details?.vehicle_information?.KeySlashFob;

    if (value === true || String(value).toLowerCase() === "true") {
        return "Obecny";
    }

    if (value === false || String(value).toLowerCase() === "false") {
        return "Brak";
    }

    return displayValue(value);
}


function getRunCondition(car) {

    return displayValue(
        car.condition?.run_condition?.label ??
        car.condition?.run_condition?.value ??
        car.run_cond ??
        car.details?.vehicle_information?.StartCode
    );
}


function getTitleDocument(car) {

    return displayValue(
        car.sale_document?.name ??
        car.details?.sale_information?.TitleSaleDoc
    );
}


function getLot(car) {

    return displayValue(
        car.lot_number ??
        car.lot ??
        car.lot_id ??
        car.lotNumber ??
        car.details?.auction_information?.stockNumber
    );
}


function getAuctionDate(car) {

    return (
        car.auction?.full_date ??
        car.auction?.auction_at ??
        car.auction_date ??
        car.auction?.date ??
        car.auction?.start_time ??
        car.auction?.scheduled_at ??
        car.sale_date ??
        car.sale?.date ??
        car.details?.sale_information?.AuctionDateTime ??
        null
    );
}


function formatDate(value) {

    if (!value) {
        return "—";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return displayValue(value);
    }

    return date.toLocaleString(
        "pl-PL",
        {
            year: "numeric",
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function getStatus(car) {

    const raw =
        String(
            car.auction?.state ??
            car.lot_status ??
            car.status ??
            car.auction_status ??
            car.sale_status ??
            ""
        ).toLowerCase();

    if (
        raw.includes("sold") ||
        raw.includes("ended") ||
        raw.includes("closed") ||
        raw.includes("completed")
    ) {

        return {
            key: "ended",
            label: "AUKCJA ZAKOŃCZONA"
        };
    }

    if (
        raw.includes("upcoming") ||
        raw.includes("future") ||
        raw.includes("scheduled")
    ) {

        return {
            key: "upcoming",
            label: "NADCHODZĄCA AUKCJA"
        };
    }

    const dateValue =
        getAuctionDate(car);

    if (dateValue) {

        const date =
            new Date(dateValue);

        if (!Number.isNaN(date.getTime())) {

            if (
                date.getTime() >
                Date.now()
            ) {

                return {
                    key: "upcoming",
                    label: "NADCHODZĄCA AUKCJA"
                };
            }
        }
    }

    return {
        key: "active",
        label: "AKTYWNA AUKCJA"
    };
}


function carTitle(car) {

    if (car.title) {
        return escapeHtml(car.title);
    }

    return escapeHtml(
        (
            safe(car.year, "") +
            " " +
            safe(car.make, "") +
            " " +
            safe(car.model, "")
        ).trim()
    );
}


function normalizeImageUrl(image) {

    if (!image) {
        return null;
    }

    let url = "";

    if (typeof image === "string") {
        url = image;
    }

    if (typeof image === "object") {

        url =
            image.large ??
            image.url ??
            image.src ??
            image.image_url ??
            image.medium ??
            image.thumbnail ??
            image.thumb ??
            "";
    }

    if (!url) {
        return null;
    }

    /*
     * API może zwrócić URL opakowany w markdown:
     * [https://...](https://...)
     */

    const markdownMatch =
        url.match(
            /^\[.*?\]\((.*?)\)$/
        );

    if (markdownMatch) {
        url = markdownMatch[1];
    }

    url = url
        .replace(/\\&/g, "&")
        .replace(/\\~/g, "~")
        .replace(/^<|>$/g, "");

    return url;
}


function getImages(car) {

    const images = [];

    function add(item) {

        const url =
            normalizeImageUrl(item);

        if (
            url &&
            !images.includes(url)
        ) {

            images.push(url);
        }
    }


    if (Array.isArray(car.images)) {

        car.images.forEach(add);
    }


    if (
        car.media &&
        Array.isArray(car.media.items)
    ) {

        car.media.items
            .filter(
                item =>
                    item &&
                    item.type === "image"
            )
            .forEach(
                item =>
                    add(
                        item.large ??
                        item.url ??
                        item.thumb
                    )
            );
    }


    if (
        car.media &&
        Array.isArray(car.media.thumbs)
    ) {

        car.media.thumbs.forEach(add);
    }


    if (
        car.photos &&
        Array.isArray(car.photos)
    ) {

        car.photos.forEach(add);
    }


    /*
     * Nie dodajemy drugi raz tych samych zdjęć.
     * Dla IAA preferujemy wersję large z media.items.
     */

    const uniqueKeys = new Set();
    const result = [];

    for (const image of images) {

        const key =
            image
                .replace(
                    /[?&]width=\d+/g,
                    ""
                )
                .replace(
                    /[?&]height=\d+/g,
                    ""
                );

        if (!uniqueKeys.has(key)) {

            uniqueKeys.add(key);
            result.push(image);
        }
    }

    return result;
}


function getVideoUrl(car) {

    if (
        car.media &&
        Array.isArray(car.media.items)
    ) {

        const video =
            car.media.items.find(
                item =>
                    item &&
                    item.type === "video" &&
                    item.url
            );

        if (video) {

            return normalizeImageUrl(
                video.url
            );
        }
    }

    return (
        car.media?.video_url ??
        car.video_url ??
        car.video ??
        car.details?.attributes?.EngineVideoLink ??
        null
    );
}


function get360Url(car) {

    return (
        car.media?.url_360 ??
        car.media?.view_360 ??
        car.url_360 ??
        car.details?.attributes?.Link360 ??
        null
    );
}


function getAuctionUrl(car) {

    return (
        car.auction_url ??
        car.auction?.url ??
        car.url ??
        car.source_url ??
        car.source?.url ??
        ""
    );
}


function getFavorites() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "rex_bid_favorites"
            ) || "[]"
        );

    } catch {

        return [];
    }
}


function saveFavorites(items) {

function toggleFavorite(vin) {

    if (!vin) return;

    let favorites =
        getFavorites();

    if (
        favorites.includes(vin)

                item => item !== vin

    } else {

        favorites.push(vin);

    saveFavorites(favorites);

    renderFavoriteButton(vin);
}

function renderCountdown(car) {

    const dateValue =
        getAuctionDate(car);

    if (!dateValue) {
        return "";
    }

    const date =
        new Date(dateValue);

    if (
        Number.isNaN(date.getTime())
    ) {
        return "";
    }

    const timestamp =
        date.getTime();

    return `

        <div
            class="countdown-box"
            id="countdownBox"
            data-auction-time="${timestamp}"
        >

            <div class="countdown-title">
                Czas do aukcji
            </div>

            <div
                class="countdown-time"
                id="countdownTime"
            >
                Ładowanie...
            </div>

        </div>

    `;
}


function startCountdown() {

    const box =
        document.getElementById(
            "countdownBox"
        );

    const output =
        document.getElementById(
            "countdownTime"
        );

    if (!box || !output) {
        return;
    }

    const target =
        Number(
            box.dataset.auctionTime
        );

    if (
        !Number.isFinite(target)
    ) {
        return;
    }


    function update() {

        const diff =
            target -
            Date.now();


        if (diff <= 0) {

            output.innerHTML =
                `<span class="countdown-finished">
                    AUKCJA W TRAKCIE / ROZPOCZĘTA
                </span>`;

            return;
        }


        const totalSeconds =
            Math.floor(
                diff / 1000
            );


        const days =
            Math.floor(
                totalSeconds /
                86400
            );


        const hours =
            Math.floor(
                (
                    totalSeconds %
                    86400
                ) / 3600
            );


        const minutes =
            Math.floor(
                (
                    totalSeconds %
                    3600
                ) / 60
            );


        const seconds =
            totalSeconds %
            60;


        output.innerHTML = `

            <span>
                ${String(days).padStart(2, "0")}
            </span>d :

            <span>
                ${String(hours).padStart(2, "0")}
            </span>h :

            <span>
                ${String(minutes).padStart(2, "0")}
            </span>m :

            <span>
                ${String(seconds).padStart(2, "0")}
            </span>s

        `;
    }


    update();

    const interval =
        setInterval(
            update,
            1000
        );


    window.addEventListener(
        "beforeunload",
        () => clearInterval(interval),
        { once: true }
    );
}

function changeImage(image, element) {

        document.getElementById(
            "mainImage"

    if (main) {
        main.src = image;

    document
        .querySelectorAll(".thumb")
        .forEach(
            thumb =>
                thumb.classList.remove(
                    "active"
                )
        );

    if (element) {
        element.classList.add(
            "active"
        );
    }
}


async function loadCar() {

    const app =
        document.getElementById(
            "app"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const vin =
        params.get("vin");


    if (!vin) {

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie znaleziono samochodu
                </strong>

                Brak numeru VIN w adresie.

            </div>

        `;

        return;
    }


    try {

        /*
         * Używamy działającego endpointu:
         *
         * /api/cars?s=VIN
         */

        const response =
            await fetch(
                "/api/cars?s=" +
                encodeURIComponent(vin),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Błąd HTTP " +
                response.status
            );
        }


        const result =
            await response.json();


        if (!result.ok) {

            throw new Error(
                result.error ||
                "Błąd API"
            );
        }


        const cars =
            Array.isArray(result.data)
                ? result.data
                : [];


        const car =
            cars.find(
                item =>
                    String(
                        item.vin ??
                        item.VIN ??
                        ""
                    ).toUpperCase() ===
                    String(vin)
                        .toUpperCase()
            ) ||
            cars[0];


        if (!car) {

            app.innerHTML = `

                <div class="error">

                    <strong>
                        Nie znaleziono samochodu
                    </strong>

                    Oferta nie jest dostępna.

                </div>

            `;

            return;
        }


        renderCar(car);


    } catch (error) {

        console.error(error);

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie udało się pobrać samochodu
                </strong>

                Wystąpił problem z połączeniem z API.

            </div>

        `;
    }
}
