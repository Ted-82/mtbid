<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTBID — Samochód</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #15171a;
}

a {
    color: inherit;
    text-decoration: none;
}

.topbar {
    background: #111315;
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
}

.nav {
    max-width: 1400px;
    min-height: 72px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 30px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: #ffb400;
}

.menu {
    display: flex;
    gap: 22px;
    flex: 1;
}

.menu a {
    color: #d9dcdf;
    font-size: 14px;
    font-weight: 700;
}

.menu a:hover {
    color: white;
}

.back {
    color: #d9dcdf;
    font-size: 13px;
    font-weight: 700;
}

.container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 35px 24px 70px;
}

.loading,
.error {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    padding: 50px 25px;
    text-align: center;
}

.error strong,
.loading strong {
    display: block;
    font-size: 20px;
    margin-bottom: 10px;
}

.error {
    color: #666;
}

.car-header {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 20px;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}

.platform {
    display: inline-block;
    background: #111315;
    color: white;
    padding: 6px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 900;
    margin-bottom: 10px;
}

.car-header h1 {
    margin: 0 0 8px;
    font-size: 32px;
}

.subtitle {
    color: #70757b;
    font-size: 14px;
}

.favorite {
    border: 1px solid #d8dce0;
    background: white;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 800;
}

.favorite.active {
    color: #e4002b;
}

.main-grid {
    display: grid;
    grid-template-columns: 1.4fr .8fr;
    gap: 20px;
}

.gallery {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    overflow: hidden;
}

.main-image {
    width: 100%;
    height: 520px;
    object-fit: cover;
    display: block;
    background: #e9ebed;
}

.thumbs {
    display: flex;
    gap: 8px;
    padding: 12px;
    overflow-x: auto;
}

.thumb {
    width: 90px;
    height: 65px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
}

.thumb.active {
    border-color: #ffb400;
}

.info-card {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    padding: 22px;
}

.price-label {
    color: #777d83;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 5px;
}

.price {
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 20px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid #eceef0;
    font-size: 14px;
}

.info-row:last-child {
    border-bottom: 0;
}

.info-label {
    color: #777d83;
}

.info-value {
    font-weight: 800;
    text-align: right;
}

.details {
    background: white;
    border: 1px solid #e0e3e6;
    border-radius: 12px;
    margin-top: 20px;
    padding: 25px;
}

.details h2 {
    margin: 0 0 20px;
    font-size: 22px;
}

.details-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: #e4e6e8;
    border: 1px solid #e4e6e8;
}

.detail {
    background: white;
    padding: 15px;
}

.detail-label {
    color: #777d83;
    font-size: 11px;
    margin-bottom: 5px;
}

.detail-value {
    font-size: 14px;
    font-weight: 800;
}

.auction-button {
    display: block;
    width: 100%;
    margin-top: 18px;
    background: #ffb400;
    color: #111315;
    text-align: center;
    padding: 13px;
    border-radius: 8px;
    font-weight: 900;
}

.auction-button:hover {
    background: #ffc431;
}

footer {
    background: #111315;
    color: #bfc3c7;
    padding: 35px 24px;
}

.footer-inner {
    max-width: 1300px;
    margin: 0 auto;
}

.footer-logo {
    color: white;
    font-size: 24px;
    font-weight: 900;
}

.footer-logo span {
    color: #ffb400;
}

.copyright {
    margin-top: 15px;
    font-size: 12px;
    color: #858b91;
}

@media (max-width: 900px) {
    .main-grid {
        grid-template-columns: 1fr;
    }

    .main-image {
        height: 420px;
    }

    .details-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .nav {
        padding: 15px;
    }

    .menu {
        display: none;
    }

    .container {
        padding: 20px 14px 50px;
    }

    .header-top {
        flex-direction: column;
    }

    .car-header h1 {
        font-size: 25px;
    }

    .main-image {
        height: 280px;
    }

    .details-grid {
        grid-template-columns: 1fr;
    }

    .price {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="nav">

        <a href="index.html" class="logo">
            MT<span>BID</span>
        </a>

        <nav class="menu">
            <a href="index.html">Aukcje</a>
            <a href="jak-to-dziala.html">Jak to działa</a>
            <a href="o-nas.html">O nas</a>
            <a href="kontakt.html">Kontakt</a>
            <a href="ulubione.html">♡ Ulubione</a>
        </nav>

        <a href="index.html" class="back">
            ← Wróć do aukcji
        </a>

    </div>
</header>

<main class="container" id="app">

    <div class="loading">
        <strong>Ładowanie samochodu...</strong>
        Pobieranie danych aukcji.
    </div>

</main>

<footer>
    <div class="footer-inner">

        <div class="footer-logo">
            MT<span>BID</span>
        </div>

        <div class="copyright">
            © 2026 MTBID. Wszystkie prawa zastrzeżone.
        </div>

    </div>
</footer>

<script>

const fallbackImage =
    "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1400&q=80";


function safe(value, fallback = "—") {
    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return fallback;
    }

    return value;
}


function money(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    return "$" + Number(value).toLocaleString("en-US");
}


function getMileage(car) {

    if (car.mileage !== undefined) {
        return car.mileage;
    }

    if (car.odometer?.mi !== undefined) {
        return Number(car.odometer.mi).toLocaleString("en-US") + " mi";
    }

    return "—";
}


function getPrice(car) {

    if (car.price !== undefined) {
        return car.price;
    }

    if (car.pricing?.current_bid_usd !== undefined) {
        return car.pricing.current_bid_usd;
    }

    return null;
}


function getDamage(car) {

    if (car.damage) {
        return car.damage;
    }

    if (car.condition?.primary_damage) {
        return car.condition.primary_damage;
    }

    return "—";
}


function getLocation(car) {

    if (typeof car.location === "string") {
        return car.location;
    }

    if (car.location?.display) {
        return car.location.display;
    }

    return "USA";
}


function getFuel(car) {

    if (car.fuel_type) {
        return car.fuel_type;
    }

    if (car.engine?.fuel_type) {
        return car.engine.fuel_type;
    }

    return "—";
}


function getTransmission(car) {

    if (car.transmission) {
        return car.transmission;
    }

    if (car.specs?.transmission) {
        return car.specs.transmission;
    }

    return "—";
}


function getDrive(car) {

    if (car.drive_type) {
        return car.drive_type;
    }

    if (car.specs?.drive_type) {
        return car.specs.drive_type;
    }

    return "—";
}


function getImages(car) {

    let images = [];

    if (
        car.media &&
        Array.isArray(car.media.thumbs)
    ) {
        images = car.media.thumbs;
    }

    if (
        car.media &&
        Array.isArray(car.media.images)
    ) {
        images = car.media.images;
    }

    if (Array.isArray(car.images)) {
        images = car.images;
    }

    images = images.filter(Boolean);

    if (!images.length) {
        images.push(fallbackImage);
    }

    return [...new Set(images)];
}


function carTitle(car) {

    if (car.title) {
        return car.title;
    }

    return (
        safe(car.year, "") + " " +
        safe(car.make, "") + " " +
        safe(car.model, "")
    ).trim();
}


function getFavorites() {

    try {
        return JSON.parse(
            localStorage.getItem("mtbid_favorites") || "[]"
        );
    } catch {
        return [];
    }
}


function saveFavorites(items) {

    localStorage.setItem(
        "mtbid_favorites",
        JSON.stringify(items)
    );
}


function toggleFavorite(vin) {

    let favorites = getFavorites();

    if (favorites.includes(vin)) {

        favorites = favorites.filter(
            item => item !== vin
        );

    } else {

        favorites.push(vin);

    }

    saveFavorites(favorites);

    renderFavoriteButton(vin);
}


function renderFavoriteButton(vin) {

    const button =
        document.getElementById("favoriteButton");

    if (!button) return;

    const active =
        getFavorites().includes(vin);

    button.classList.toggle(
        "active",
        active
    );

    button.textContent =
        active
            ? "♥ Usuń z ulubionych"
            : "♡ Dodaj do ulubionych";
}


function renderCar(car) {

    const app =
        document.getElementById("app");

    const vin =
        car.vin ||
        car.lot ||
        "";

    const images =
        getImages(car);

    const price =
        getPrice(car);

    const platform =
        safe(car.platform, "").toUpperCase();

    const title =
        carTitle(car);

    app.innerHTML = `

        <section class="car-header">

            <div class="header-top">

                <div>

                    <div class="platform">
                        ${platform}
                    </div>

                    <h1>
                        ${title}
                    </h1>

                    <div class="subtitle">
                        VIN: ${safe(vin)}
                    </div>

                </div>

                <button
                    class="favorite"
                    id="favoriteButton"
                    onclick="toggleFavorite('${vin}')"
                >
                    ♡ Dodaj do ulubionych
                </button>

            </div>

        </section>


        <div class="main-grid">

            <section class="gallery">

                <img
                    id="mainImage"
                    class="main-image"
                    src="${images[0]}"
                    alt="${title}"
                >

                <div class="thumbs">

                    ${images.map(
                        (image, index) => `

                            <img
                                class="thumb ${index === 0 ? "active" : ""}"
                                src="${image}"
                                onclick="changeImage('${image}', this)"
                                alt="${title}"
                            >

                        `
                    ).join("")}

                </div>

            </section>


            <aside class="info-card">

                <div class="price-label">
                    AKTUALNA OFERTA
                </div>

                <div class="price">
                    ${money(price)}
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Rok
                    </span>

                    <span class="info-value">
                        ${safe(car.year)}
                    </span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Przebieg
                    </span>

                    <span class="info-value">
                        ${getMileage(car)}
                    </span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Uszkodzenie
                    </span>

                    <span class="info-value">
                        ${getDamage(car)}
                    </span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Lokalizacja
                    </span>

                    <span class="info-value">
                        ${getLocation(car)}
                    </span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Lot
                    </span>

                    <span class="info-value">
                        ${safe(car.lot)}
                    </span>
                </div>


                <a
                    href="#"
                    class="auction-button"
                    id="auctionButton"
                    target="_blank"
                    rel="noopener"
                >
                    PRZEJDŹ DO AUKCJI
                </a>

            </aside>

        </div>


        <section class="details">

            <h2>
                Szczegóły samochodu
            </h2>

            <div class="details-grid">

                <div class="detail">
                    <div class="detail-label">
                        Marka
                    </div>
                    <div class="detail-value">
                        ${safe(car.make)}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-label">
                        Model
                    </div>
                    <div class="detail-value">
                        ${safe(car.model)}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-label">
                        VIN
                    </div>
                    <div class="detail-value">
                        ${safe(car.vin)}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-label">
                        Skrzynia
                    </div>
                    <div class="detail-value">
                        ${getTransmission(car)}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-label">
                        Paliwo
                    </div>
                    <div class="detail-value">
                        ${getFuel(car)}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-label">
                        Napęd
                    </div>
                    <div class="detail-value">
                        ${getDrive(car)}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-label">
                        Silnik
                    </div>
                    <div class="detail-value">
                        ${safe(car.engine)}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-label">
                        Typ nadwozia
                    </div>
                    <div class="detail-value">
                        ${safe(car.body_type)}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-label">
                        Kolor
                    </div>
                    <div class="detail-value">
                        ${safe(car.color)}
                    </div>
                </div>

            </div>

        </section>

    `;

    renderFavoriteButton(vin);

    setupAuctionLink(car);
}


function changeImage(image, element) {

    document.getElementById(
        "mainImage"
    ).src = image;

    document
        .querySelectorAll(".thumb")
        .forEach(
            thumb =>
                thumb.classList.remove("active")
        );

    element.classList.add("active");
}


function setupAuctionLink(car) {

    const button =
        document.getElementById(
            "auctionButton"
        );

    if (!button) return;

    const url =
        car.auction_url ||
        car.url ||
        car.source_url ||
        "";

    if (!url) {

        button.style.display = "none";

        return;
    }

    button.href = url;
}


async function loadCar() {

    const app =
        document.getElementById("app");

    const params =
        new URLSearchParams(
            window.location.search
        );

    const vin =
        params.get("vin");

    if (!vin) {

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie znaleziono samochodu
                </strong>

                Brak numeru VIN w adresie.

            </div>

        `;

        return;
    }


    try {

        /*
         * WAŻNE:
         * Pobieramy całą działającą listę /api/cars.
         * Nie używamy już ?s=VIN, ponieważ nasz
         * obecny endpoint zwraca poprawnie listę ofert.
         */

        const response =
            await fetch("/api/cars");

        if (!response.ok) {

            throw new Error(
                "Błąd HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (!result.ok) {

            throw new Error(
                result.error ||
                "Błąd API"
            );

        }


        const cars =
            Array.isArray(result.data)
                ? result.data
                : [];


        /*
         * Szukamy konkretnego samochodu
         * po VIN w danych, które już działają.
         */

        const car =
            cars.find(
                item =>
                    String(item.vin || "")
                    .toLowerCase() ===
                    String(vin)
                    .toLowerCase()
            );


        if (!car) {

            app.innerHTML = `

                <div class="error">

                    <strong>
                        Nie znaleziono samochodu
                    </strong>

                    Oferta o VIN
                    <b>${vin}</b>
                    nie znajduje się obecnie
                    na liście ofert.

                    <br><br>

                    <a href="index.html">
                        ← Wróć do aukcji
                    </a>

                </div>

            `;

            return;
        }


        renderCar(car);


    } catch (error) {

        console.error(
            "MTBID car error:",
            error
        );

        app.innerHTML = `

            <div class="error">

                <strong>
                    Nie udało się pobrać samochodu
                </strong>

                Wystąpił problem z połączeniem
                z API MTBID.

                <br><br>

                <a href="index.html">
                    ← Wróć do aukcji
                </a>

            </div>

        `;

    }

}


loadCar();

</script>

</body>
</html>
