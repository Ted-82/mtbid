<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moje konto | REX.Bid</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      min-height: 76px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      text-decoration: none;
      color: #111827;
      font-size: 30px;
      font-weight: 900;
    }

    .logo span {
      color: #e11d48;
    }

    nav {
      display: flex;
      gap: 22px;
    }

    nav a {
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    nav a:hover {
      color: #e11d48;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 45px 24px 70px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    .welcome p {
      margin: 0;
      color: #6b7280;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 25px;
    }

    .layout[hidden] {
      display: none !important;
    }

    .sidebar {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px;
      height: fit-content;
    }

    .side-link {
      display: block;
      padding: 13px 14px;
      border-radius: 9px;
      color: #374151;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .side-link:hover,
    .side-link.active {
      background: #fff1f2;
      color: #be123c;
    }

    .content {
      display: grid;
      gap: 22px;
    }

    .profile {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 25px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 25px;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
    }

    .profile h2 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    .profile-email {
      color: #6b7280;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .stat {
      background: #f8fafc;
      border-radius: 12px;
      padding: 18px;
    }

    .stat-number {
      display: block;
      font-size: 27px;
      font-weight: 900;
      color: #111827;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #6b7280;
      font-size: 13px;
    }

    .section {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 25px;
    }

    .section h2 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .account-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid #eef0f3;
    }

    .account-row:last-child {
      border-bottom: 0;
    }

    .row-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .row-value {
      font-weight: 800;
      color: #111827;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
    }

    .btn-red {
      background: #e11d48;
      color: white;
    }

    .btn-outline {
      background: white;
      border: 1px solid #d1d5db;
      color: #111827;
    }

    .logout {
      width: 100%;
      margin-top: 12px;
      color: #be123c;
    }

    footer {
      background: #111827;
      color: #d1d5db;
      padding: 35px 24px;
    }

    .footer-inner {
      max-width: 1250px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-logo {
      color: white;
      font-size: 22px;
      font-weight: 900;
    }

    @media (max-width: 850px) {
      nav {
        display: none;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
      }

      .logout {
        margin-top: 0;
      }
    }

    @media (max-width: 550px) {
      .header-inner {
        min-height: 65px;
        padding: 0 16px;
      }

      .logo {
        font-size: 25px;
      }

      .container {
        padding: 30px 16px 50px;
      }

      .welcome h1 {
        font-size: 30px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .sidebar {
        grid-template-columns: 1fr;
      }

      .account-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>

</head>
