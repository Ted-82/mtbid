<body class="rex-guide">
<a class="skip-link" href="#main">Przejdź do treści</a>
<header><div class="header-inner"><a href="/" class="logo" aria-label="REXBID — Rynek aukcyjny USA, strona główna"><img class="rexbid-brand-image" src="/rexbid-logo-20261117-dark.webp" width="420" height="159" alt=""><span class="brand-note">RYNEK AUKCYJNY USA</span></a><a href="/?catalog=1#results">Zobacz aukcje</a></div></header>
<main id="main" class="guide-shell purchase-budget" data-purchase-budget>
  <section class="guide-section purchase-lookup" aria-labelledby="purchase-heading">
    <h1 id="purchase-heading">Twój budżet zakupu</h1>
    <p>Wpisz budżet w złotych i wybierz auto po VIN lub LOT. Sprawdzisz, ile maksymalnie przeznaczyć na licytację, uwzględniając import do Polski i prowizję 2500 zł brutto.</p>
    <form data-purchase-form>
      <label class="guide-field purchase-budget-input">Twój łączny budżet · PLN<input name="budget" type="number" min="1" step="1" inputmode="decimal" placeholder="np. 30000" required></label>
      <label class="guide-field">VIN lub numer LOT
        <input name="identifier" required maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="np. 74796146">
      </label>
      <label class="guide-field">Platforma
        <select name="platform"><option value="">Copart i IAAI</option><option value="copart">Copart</option><option value="iaai">IAAI</option></select>

      <button type="submit" class="guide-button">Oblicz limit licytacji</button>

    <p data-purchase-status role="status" aria-live="polite"></p>
    <div data-purchase-matches></div>
    <noscript><p>Włącz JavaScript, aby wyszukać auto i obliczyć wycenę.</p></noscript>
  </section>
  <section class="guide-section purchase-selected" data-purchase-selected hidden aria-labelledby="purchase-vehicle">
    <h2 id="purchase-vehicle" tabindex="-1"></h2>
    <p data-purchase-identity></p>
    <a data-purchase-original>Przejdź do karty auta</a>
