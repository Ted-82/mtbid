<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/rexbid-brand.css?v=20261117-integrated" />
<script src="/rexbid-storage.js?v=61ff9ecd8bc8" defer></script>
<script src="/rexbid-mobile-nav.js?v=baf47bbe1e" defer></script>
<link rel="stylesheet" href="/rexbid-account.css?v=186f9a00ec44">
<noscript data-rex-navigation-fallback><style>header .rex-menu-toggle{display:none!important}header .header-inner,header .header,header .bar{flex-wrap:wrap}header nav.rex-primary-nav{display:flex!important;position:static;flex-wrap:wrap;width:auto;box-shadow:none}</style></noscript></head>

<body class="account-page">

<header>
<div class="header">

<a href="index.html" class="logo" aria-label="REXBID — strona główna"><img class="rexbid-brand-image" src="/rexbid-logo-20261117-dark.webp" width="420" height="159" alt=""><span class="brand-note">RYNEK AUKCYJNY USA</span></a>

<a href="index.html" class="back">
← Wróć
</a>

<button class="rex-menu-toggle" type="button" aria-label="Otwórz menu główne" aria-expanded="false" aria-controls="rexPrimaryNav">☰</button><nav class="rex-primary-nav" id="rexPrimaryNav" aria-label="Nawigacja główna"><a href="/?catalog=1#results">Aukcje</a><a href="/jak-to-dziala">Jak to działa</a><a href="/ulubione">Ulubione <span data-rexbid-count="favorites">0</span></a><a href="/konto">Konto</a><a href="/pomoc">Pomoc</a><a href="/kontakt">Kontakt</a></nav><div class="rexbid-auth-nav" data-rexbid-auth-nav aria-label="Konto użytkownika"></div></div>
</header>

<main>

<section class="box">

<h1>Witaj ponownie</h1>

<div class="subtitle">
Zaloguj się do swojego konta REXBID.
</div>

<form id="loginForm">

<div class="group">

<label for="email">
E-mail
</label>

<input
id="email"
type="email"
autocomplete="email"
placeholder="twoj@email.pl"
required
>

</div>

<div class="group">

<label for="password">
Hasło
</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Twoje hasło"
required
>

</div>

<button type="submit">
Zaloguj się
</button>

</form>

<button id="resendConfirmation" type="button" hidden style="margin-top:10px;background:#374151">Wyślij ponownie wiadomość potwierdzającą</button>

<p style="margin:14px 0 0;text-align:right;font-size:13px"><a href="reset-hasla.html">Nie pamiętasz hasła?</a></p>

<div id="message" class="message">
</div>

<div class="register">

Nie masz jeszcze konta?

<br><br>

<a href="rejestracja.html">
Utwórz konto →
</a>

</div>

</section>

</main>

<script src="/rexbid-auth.js?v=21437df8759b"></script>
<script>

document
.getElementById("loginForm")
.addEventListener("submit",function(e){

if (window.RexBidAuth?.enabled) return;

e.preventDefault();

document
.getElementById("message")
.style.display="block";

});

</script>

</body>
</html>
