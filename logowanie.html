<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie — MTBID</title>

<style>
*{box-sizing:border-box}

:root{
--dark:#101114;
--bg:#f4f5f7;
--text:#111318;
--muted:#737780;
--border:#e5e7eb;
--accent:#e11d2e;
}

body{
margin:0;
background:var(--bg);
font-family:Arial,Helvetica,sans-serif;
color:var(--text);
}

header{
background:var(--dark);
}

.header{
max-width:1200px;
min-height:76px;
margin:auto;
padding:0 24px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
color:white;
text-decoration:none;
font-size:28px;
font-weight:900;
letter-spacing:-1.5px;
}

.logo span{
color:var(--accent);
}

.back{
color:#d1d5db;
text-decoration:none;
font-size:14px;
font-weight:700;
}

main{
min-height:calc(100vh - 76px);
display:flex;
align-items:center;
justify-content:center;
padding:50px 20px;
}

.box{
width:100%;
max-width:430px;
background:white;
border-radius:18px;
padding:35px;
box-shadow:0 10px 40px rgba(0,0,0,.08);
}

.box h1{
margin:0 0 8px;
font-size:32px;
letter-spacing:-1.5px;
}

.subtitle{
color:var(--muted);
font-size:14px;
margin-bottom:28px;
}

.group{
margin-bottom:17px;
}

label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:7px;
}

input{
width:100%;
height:48px;
padding:0 14px;
border:1px solid var(--border);
border-radius:9px;
font-size:14px;
outline:none;
}

input:focus{
border-color:#777;
}

button{
width:100%;
height:50px;
border:0;
border-radius:9px;
background:var(--dark);
color:white;
font-weight:900;
font-size:14px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.message{
display:none;
margin-top:15px;
padding:12px;
background:#f3f4f6;
border-radius:8px;
font-size:13px;
line-height:1.5;
}

.register{
margin-top:23px;
padding-top:22px;
border-top:1px solid var(--border);
text-align:center;
font-size:13px;
color:var(--muted);
}

.register a{
color:var(--text);
font-weight:900;
text-decoration:none;
}

@media(max-width:600px){
.box{
padding:25px 20px;
}
.header{
padding:0 16px;
}
}
</style>
</head>

<body>

<header>
<div class="header">

<a href="index.html" class="logo">
MT<span>BID</span>
</a>

<a href="index.html" class="back">
← Wróć
</a>

</div>
</header>

<main>

<section class="box">

<h1>Witaj ponownie</h1>

<div class="subtitle">
Zaloguj się do swojego konta MTBID.
</div>

<form id="loginForm">

<div class="group">

<label for="email">
E-mail
</label>

<input
id="email"
type="email"
placeholder="twoj@email.pl"
required
>

</div>

<div class="group">

<label for="password">
Hasło
</label>

<input
id="password"
type="password"
placeholder="Twoje hasło"
required
>

</div>

<button type="submit">
Zaloguj się
</button>

</form>

<div id="message" class="message">
Panel logowania zostanie podłączony do prawdziwego
systemu kont w kolejnym etapie.
</div>

<div class="register">

Nie masz jeszcze konta?

<br><br>

<a href="rejestracja.html">
Utwórz konto →
</a>

</div>

</section>

</main>

<script>

document
.getElementById("loginForm")
.addEventListener("submit",function(e){

e.preventDefault();

document
.getElementById("message")
.style.display="block";

});

</script>

</body>
</html>
